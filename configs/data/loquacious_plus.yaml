# LoquaciousSet `medium` + non-overlapping sources from multiasr.yaml
#
# LoquaciousSet `medium` train: 1.09M rows / ~2,500hr. Per the HF
# dataset README, medium takes 500hr from each of 5 sources (uniform):
#   - LibriHeavy           500hr
#   - YODAS                500hr
#   - People's Speech      500hr
#   - CommonVoice 18.0     500hr
#   - VoxPopuli en         500hr
#   - LibriSpeech dev/test-other (eval only — not in train)
#
# Mix shares against full train pool (raw row counts; TEDLIUM, GS-S,
# and SPGI-M all capped to 218K to match Loquacious-medium per-source
# size; Loquacious-medium internal sources broken out by hour-share ×
# 1.09M — segment lengths vary across sources, so per-source row
# counts are first-order estimates, not exact):
# ┌──────────────────────────────┬────────────┬─────────┐
# │ Source                       │ Raw rows   │ Percent │
# ├──────────────────────────────┼────────────┼─────────┤
# │ TEDLIUM-3         (capped)   │    218,000 │   10.2% │
# │ Gigaspeech S      (capped)   │    218,000 │   10.2% │
# │ LibriHeavy        (Loq-med)  │   ~218,000 │   10.2% │
# │ YODAS             (Loq-med)  │   ~218,000 │   10.2% │
# │ People's Speech   (Loq-med)  │   ~218,000 │   10.2% │
# │ CommonVoice 18.0  (Loq-med)  │   ~218,000 │   10.2% │
# │ VoxPopuli         (Loq-med)  │   ~218,000 │   10.2% │
# │ SPGISpeech M      (capped)   │    218,000 │   10.2% │
# │ Switchboard                  │    185,402 │    8.6% │
# │ AMI IHM                      │    108,502 │    5.0% │
# │ AMI SDM                      │    107,319 │    5.0% │
# └──────────────────────────────┴            ┴         ┘
# Total raw train rows: ~2,144,223  (Loq-med: 1.09M, ≈50.8% of mix)
#
# Added from multiasr.yaml (zero source overlap with Loquacious-medium):
#   - TEDLIUM-3            TED talks, scripted long-form
#   - Gigaspeech S         podcast / audiobook / YouTube mix
#   - SPGISpeech M         financial earnings calls
#   - Switchboard          telephony conversational
#   - AMI IHM              close-talk meeting mic
#   - AMI SDM              single distant mic (far-field meeting)
#
# Dropped from multiasr.yaml because they overlap with Loquacious-large:
#   - LibriHeavy medium                       (Loquacious bundles LibriHeavy)
#   - MLCommons/peoples_speech clean_sa/dirty_sa/validation
#                                             (Loquacious bundles Peoples)
#   - CommonVoice 17 en                       (Loquacious bundles CV 18.0;
#                                              same crowdsourced base)
#   - VoxPopuli en                            (Loquacious bundles VoxPopuli)

datasets:
  # LoquaciousSet medium — 1.09M train rows / 2,500hr. Per the HF
  # dataset README, medium uniformly samples 500hr from each of 5
  # sources (so per-source share is 20% of bundle by hours);
  # approximate row counts are 1.09M scaled by the 20% hour-share
  # (segment lengths actually vary across sources, so these are
  # first-order estimates, not exact):
  #   - LibriHeavy           500hr  20%  ~218K rows
  #   - YODAS                500hr  20%  ~218K rows  (en000+en001, LID filtered)
  #   - People's Speech      500hr  20%  ~218K rows  (clean subset only)
  #   - CommonVoice 18.0     500hr  20%  ~218K rows  (validated; >9k-sample spk capped)
  #   - VoxPopuli            500hr  20%  ~218K rows
  #   - LibriSpeech            0hr   0%       0 rows (only used in dev/test splits)
  # Dev split is LibriSpeech dev-other (5hr LS + 5/1.5/1.5/5 from
  # VP/YODAS/PS/CV; ~15hr total).
  - path: speechbrain/LoquaciousSet
    name: medium
    audio_column: wav
    text_column: text
    task: transcribe
    train_splits: [train]
    eval_splits: [dev]

  # TEDLIUM-3 — natural 268K train rows (~452hr), capped to 218K to
  # match the per-source balance with Loquacious-medium sub-sources and
  # SPGI/GS. TED talk presentational speech. Transcripts are lowercase
  # no-punct (TEDLIUM convention); the dominant cased+punct signal in
  # the mix absorbs it. scripts/train.py:_normalize_label strips the
  # TEDLIUM `<unk>` and `[bracket]` annotations.
  - path: sanchit-gandhi/tedlium-data
    audio_column: audio
    text_column: text
    task: transcribe
    train_splits: [train]
    eval_splits: [validation]
    target_samples: 218000

  # Gigaspeech S (speechcolab repo) — natural ~220K train rows (~250hr),
  # capped to 218K to match per-source balance. Curated podcast /
  # audiobook / YouTube mix at S tier (cap difference is negligible —
  # picked S over M originally to keep GS from dominating the pool).
  # Requires accepting the dataset license and HF_TOKEN at load.
  - path: speechcolab/gigaspeech
    name: s
    audio_column: audio
    text_column: text
    task: transcribe
    train_splits: [train]
    eval_splits: []
    target_samples: 218000

  # Gigaspeech dev — separate config; data lives under split name
  # `validation` (HF builder convention).
  - path: speechcolab/gigaspeech
    name: dev
    audio_column: audio
    text_column: text
    task: transcribe
    train_splits: []
    eval_splits: [validation]

  # SPGISpeech M — natural 385K train rows (~1,000hr), capped to 218K
  # to match the per-source size of the Loquacious-medium sub-sources
  # (~218K each). Without the cap, SPGI alone would sit at ~18% of the
  # mix vs ~10% per other source — uncapped exposure would tilt the
  # acoustic prior toward studio-clean earnings-call register.
  # Kensho-employed professional transcribers (highest label fidelity
  # in the mix), so even a 218K slice is a strong supervision anchor.
  - path: kensho/spgispeech
    name: M
    audio_column: audio
    text_column: transcript
    task: transcribe
    train_splits: [train]
    eval_splits: [validation]
    target_samples: 218000

  # Switchboard — 185,402 train rows. Conversational telephony.
  # Telephony-band + multi-talker disfluency supervision that nothing
  # else in the mix provides.
  - path: hhoangphuoc/switchboard
    audio_column: audio
    text_column: transcript
    task: transcribe
    train_splits: [train]
    eval_splits: [validation]

  # AMI IHM — 108,502 train rows; ~79K post-filter after the
  # DataCollator's <0.8s drop on isolated backchannels. Close-talk
  # meeting mic.
  - path: edinburghcstr/ami
    name: ihm
    audio_column: audio
    text_column: text
    task: transcribe
    train_splits: [train]
    eval_splits: [validation]

  # AMI SDM — 107,319 train rows; ~67K post-filter. Single distant mic
  # (far-field). Same hand-transcribed labels as IHM at the text level;
  # only the acoustics differ. Restores far-field / multi-talker /
  # heavy-reverb exposure.
  - path: edinburghcstr/ami
    name: sdm
    audio_column: audio
    text_column: text
    task: transcribe
    train_splits: [train]
    eval_splits: [validation]

# Audio processing
sample_rate: 16000

# Processing options
dataset_cache_dir: ${hydra:runtime.cwd}/datasets_cache
# Cap each eval split at this many rows BEFORE concatenation so every
# dataset contributes a balanced slice to during-training eval.
max_eval_samples_per_dataset: 250
