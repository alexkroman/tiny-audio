# Multi-ASR dataset configuration
#
# Natural-cap mix: every dataset runs at its full natural train-split
# size, with Gigaspeech on the curated M tier rather than L. The one
# exception is the Big-3 (LibriHeavy / CommonVoice 17 / Gigaspeech M),
# each held to a 600K `target_samples` cap so no single-speaker read
# corpus dominates the per-step gradient — see the mix table below.
# The prior revision's "tilt"
# (downcap Switchboard / AMI-SDM / SPGI to fund GS L expansion) was
# rolled back after observing cross-eval regression: cutting exposure
# on the "already-winning" evals removed cross-corpus regularization
# without producing matching gains on the target evals, and stepping
# GS to L pushed one corpus to 34% of the mix and dragged the decoder
# toward GS's register. Natural caps treat every source as a balanced
# contributor sized by its own data availability rather than by which
# eval we're chasing.
# LoquaciousSet was dropped in a prior revision; the unique coverage
# Loquacious bundled (LibriHeavy / VoxPopuli) is restored here as
# direct HF slices with explicit per-source sizing:
#   - LibriHeavy `medium` (5,042hr / ~1.1M, mythicinfinity mirror) —
#     replaces LibriSpeech clean+other (uppercase / no-punct) entirely.
#     `text_original` preserves case + punctuation, matching the Qwen3
#     decoder's native output format; LibriSpeech's uppercase-no-punct
#     was a format minority polluting the dominant cased+punct training
#     distribution. LibriHeavy's source pool is a strict superset of
#     LibriSpeech (same LibriLight base, plus the harder speakers LS
#     filtered out as "too noisy"), so this swap also gains acoustic
#     diversity. Step to `large` (50,794hr) only if LH-medium proves
#     data-limited on LibriVox-domain eval; medium already gives 3.4×
#     the prior LibriHeavy-small + LS clean+other clean-read budget.
#   - VoxPopuli `en` (543hr / ~168K) — L2-European parliamentary speech.
#     `raw_text` preserves case+punct; `normalized_text` is lowercase
#     no-punct (LS-style) and is the wrong format for the Qwen3 decoder.
# Raw YODAS (espnet/yodas) remains rejected: en000 is ~469 GB (500 ×
# 938 MB tarballs) for ~5,000hr / ~2.5M samples; codebase loads via
# load_dataset() in map mode (not streaming), so a target_samples cap
# would not reduce download. Label quality is also weaker than the
# other corpora (YouTube user-provided captions even on the manual
# tier are not verbatim ASR-grade).
# Emilia-YODAS 616h (MrDragonFox/EN_Emilia_Yodas_616h) was tried as a
# partial-YODAS path: a 228K-sample / 616hr / 108GB Parquet curation
# of the English portion segmented to single-speaker clips by the
# Emilia pipeline and re-transcribed by ElevenLabs Scribe v1. Removed
# after net regression on clean-speech evals — label-WER ceiling
# ~5-12% (Scribe v1) was noisier than every human-transcribed source
# in the mix and the YouTube-monologue register didn't earn its 6.3%
# mix share. If re-introducing later, filter by dnsmos > 3.0 + Scribe/
# Emilia transcript agreement to suppress the label-noise tail.
# Peoples: `clean_sa` only (311K). Both `_sa` configs apply the
# sentence-alignment filter on top of the corpus-level CER ≤ 20%
# bound, so each segment's audio span matches its label span; the
# prior `clean` (1.5M, NOT sentence-aligned) revision regressed
# training because per-segment audio/text drift on what became the
# largest corpus poisoned the gradient. `dirty_sa` (602K, noisier
# `dirty` source tier with uncontrolled mics / older archival audio /
# varying SNR) was dropped after observing its share of the
# supervision signal was net-negative for eval — at 12% of the mix
# its label-quality and acoustic-conditions tradeoff didn't earn the
# slot relative to expanding cleaner-label corpora. Peoples eval refs
# are human-transcribed (paid native-English transcribers per the
# MLCommons dataset card), so the eval signal itself is clean. No
# dataset is repeated — every source runs at natural train-split
# size, so each example is seen at most once per epoch.
#
# Two columns: the raw load_dataset() row count (pre-filter), and the
# count after the DataCollator drops (audio <0.8s, >30s, empty-norm
# label) plus the CV down_votes filter. Audit (2026-05-15, 200–500
# samples streamed per dataset) is the source for the loss-rate column;
# percentages are of the post-filter total.
# ┌──────────────────────────┬───────────┬───────────┬─────────┐
# │ Dataset                  │ Raw       │ Effective │ Percent │
# ├──────────────────────────┼───────────┼───────────┼─────────┤
# │ LibriHeavy med (cap 600K)│ ~1,067,000│   600,000 │   19.4% │
# │ CommonVoice 17 en (600K) │ ~1,100,000│   600,000 │   19.4% │
# │ Gigaspeech M (cap 600K)  │   ~910,000│   600,000 │   19.4% │
# │ SPGISpeech M             │   385,000 │   385,000 │   12.5% │
# │ Peoples clean_sa         │   311,000 │   311,000 │   10.1% │
# │ TEDLIUM-3                │  ~268,000 │  ~268,000 │    8.7% │
# │ VoxPopuli en             │  ~168,000 │  ~165,000 │    5.3% │
# │ AMI IHM                  │   108,502 │   ~79,000 │    2.6% │
# │ AMI SDM                  │   107,319 │   ~67,000 │    2.2% │
# │ Earnings22 train         │    11,450 │   ~11,000 │    0.4% │
# └──────────────────────────┴           ┴           ┴         ┘
# Total raw: ~4,436,271  →  Total effective: ~3,086,000 (-30.4%)
#
# SWITCHBOARD REMOVED (2026-09-17). `hhoangphuoc/switchboard` returns 404 /
# RepositoryNotFoundError -- the repo is gone from the Hub, which is the
# normal fate of a public Switchboard mirror since the corpus is LDC-licensed
# (LDC97S62). It was 185,402 raw / ~180,000 effective / 5.5% of the prior mix
# and the only telephony-band source here, so this is a real coverage loss,
# not a cleanup: the mix now has no 8 kHz narrowband speech at all, and the
# conversational share drops from 10.0% to AMI's 4.7%. Prior notes in this
# file record that cutting Switchboard exposure regressed cross-eval
# performance even on non-Switchboard evals, so expect that again.
#
# No drop-in replacement exists today. A Hub search turned up one real audio
# mirror, `dys-asr/switchboard-sr8000` (~100K-1M rows, 42 parquet shards,
# 8 kHz so the loader's Audio(sampling_rate=16000) cast would resample it),
# but it is gated=manual and needs an access request. Re-add it there if the
# telephony gap shows up in eval; the entries removed alongside this one are
# in scripts/eval/datasets.py, scripts/analysis.py and
# scripts/debug/inspect_datasets.py.
#
# Big-3 (LibriHeavy + CV17 + GS) capped at 600K each with deterministic
# shuffle (combined 58.3% mix share after the Switchboard removal, up
# from 55.2% purely because the denominator shrank). AMI combined 4.7%,
# which is now the entire conversational share (was 10.0% with
# Switchboard).
#
# Big-3 (LibriHeavy + CV + GS) capped at 600K each to address structural
# single-speaker dominance (was ~62% combined mix share, now 50.1%).
# Raises AMI / Switchboard / VoxPopuli per-step gradient share without
# upsampling them (which the natural-cap rationale documents as overfit-
# prone for AMI). AMI combined goes 3.1% → 4.1%, Switchboard 3.8% → 5.0%.
# Cost: ~1.7M rows of single-speaker data dropped — may modestly hurt
# LS Clean / LS Other / CV / Gigaspeech per-eval WER, in exchange for
# AMI / ami-sdm / Switchboard gradient share. Net direction unknown
# until empirical eval.
#
# Rebalance after run n18 (Peoples clean 1M cap) showed continued
# conversational-eval regression at step 22K (AMI 26.26, ami-sdm 74.94
# — *worse* than n18 step 13K's 20.72 / 69.38). Diagnosis: even at 1M
# cap, Peoples + LibriHeavy + CV + GS combined to ~80% single-speaker
# presentational gradient share, drowning out AMI/CV.
#
# Single-variable rebalance vs n18:
#   Peoples 1M `clean` (cap) → `clean_sa` (311K natural).
#   Frees ~689K rows of gradient share that were going to noisy auto-
#   aligned single-speaker content. Matches thurs's setting that
#   produced AMI 17.54 / ami-sdm 43.23 at end of training.
#
# AMI IHM/SDM kept at natural cap (post-<0.8s-filter ~79K / ~67K, 3.1%
# combined mix share). Prior 305K upsample target was documented to
# produce 29% IHM WER from same-speaker replay (overfit, not data-
# limited). IHM and SDM share identical transcripts per meeting
# segment — only the mic placement differs — so upsampling is mostly
# replay against fixed unique-text count and recapitulates the
# replay-overfit failure mode.
#
# WHAM (nguyenvulebinh/wham) was tried multiple times for non-speech-
# rejection training (5%, 2%, then 2.8% with random truncation to
# [1, 18]s) and removed each time. The cleanest signal came from the
# sat run where WHAM was in the mix and most non-conversational evals
# regressed (CV +1.96, LS Other +0.83, Loquacious +0.87, VoxPopuli
# +0.60). The 2.8% empty-transcript gradient share appears to bias the
# model toward under-generation on low-volume / noisy speech segments.
# If non-speech rejection becomes a deployment-need later, re-introduce
# via inference-time silence/VAD heuristics rather than mix-share
# gradient signal.
#
# The text_override + _allow_empty_label + random_truncate_seconds
# plumbing in scripts/train.py (added for WHAM) is kept — generic
# config fields, future-useful.
#
# Earnings22 uses `sanchit-gandhi/earnings22_robust_split` (pre-split:
# train/validation/test). The `test` split is what the eval pipeline
# scores against (scripts/eval/datasets.py); the `train` split included
# here is disjoint and safe to train on.
#
# Filter loss by source (measured 2026-05-15):
# - CommonVoice down_votes filter (in scripts/train.py): drops ~13% of
#   the raw train split. Prior estimate of 2–5% in the per-dataset
#   comment block below was an underestimate. Filter behavior is
#   correct — Mozilla's `train` split admits clips with non-zero
#   down_votes despite up_votes>down_votes; we tighten to down_votes==0.
# - AMI IHM/SDM <0.8s filter (DataCollator._MIN_AUDIO_SECONDS): drops
#   ~27% (IHM) / ~30–37% (SDM) of rows. The filtered rows are isolated
#   backchannels — "YEAH", "HMM", "OKAY", etc. — where the audio span
#   and reference transcript don't actually align. Filter behavior is
#   correct; the prior natural-cap rationale just didn't account for
#   the loss. AMI's mix share is correspondingly smaller than the
#   row-count alone suggests.
# - LibriHeavy >30s filter (DataCollator._MAX_AUDIO_SECONDS): drops ~3%.
#   Whisper's 30s window forces this — longer audio gets silently
#   truncated while the label is kept whole.
# - Switchboard pure-`<LAUGH>` rows: ~2.5% normalize to empty label.
# - VoxPopuli >30s rows: ~1.5%.
#
# Download-size choices: Gigaspeech uses speechcolab's official M tier
# (~1,000hr / ~910K segments — curated subset of L/XL, natural cap,
# no replay). CommonVoice and LibriSpeech both use the fixie-ai
# mirrors for their sharded parquet layouts. TEDLIUM uses the
# canonical LIUM mirror. LibriHeavy uses mythicinfinity's mirror
# (audio arrays included, Opus-encoded) — pkufool/libriheavy is a
# Lhotse manifest repo, not a directly-loadable audio dataset.

datasets:
  # TEDLIUM-3 — TED talk presentational speech. Re-added after a prior
  # streaming experiment dropped it; tiny-audio is 2.08pt behind
  # universal-3-pro on this eval and direct exposure is the lever.
  # Note: transcripts are normalized (lowercase, no punctuation); ~7% of
  # the mix so the dominant cased+punct signal should absorb it. Apply
  # case+punct restoration as a preprocess in a follow-up run if output
  # formatting bias shows up empirically.
  - path: sanchit-gandhi/tedlium-data
    audio_column: audio
    text_column: text
    task: transcribe
    train_splits: [train]
    eval_splits: [validation]
    # natural cap ~268K samples (~452hr); LIUM/tedlium no longer on Hub

  # LibriHeavy `medium` (mythicinfinity mirror, ~5,042hr / ~1.1M).
  # LibriVox-sourced audiobook readings — same underlying LibriLight
  # source pool as LibriSpeech, but `text_original` preserves the book's
  # case + punctuation (LibriSpeech collapses to uppercase / no-punct,
  # which fights the Qwen3 decoder's native cased+punct output format).
  # `medium` (5,042hr / 1.1M) replaces the prior LibriHeavy-small +
  # LibriSpeech clean+other trio (~1,470hr / ~404K combined) — 3.4×
  # more clean-read hours at uniformly higher label quality, removing
  # the LS uppercase-no-punct format minority that was polluting the
  # decoder's output distribution. LibriHeavy is a strict superset of
  # LibriSpeech's source pool (includes the speakers LS labeled "other"
  # and the harder speakers LS filtered out entirely), so this swap
  # also gains acoustic diversity, not just label quality. Tier choices:
  # small (509hr) was prior; large (50,794hr / 11.2M) would dominate the
  # mix (~50% share) — step to it only if eval shows LH-medium still
  # data-limited on LibriVox-domain coverage. Note pkufool/libriheavy
  # is a Lhotse manifest repo (not loadable as-is); use the
  # mythicinfinity mirror which ships Opus-encoded audio arrays
  # (~140 GB download for medium).
  - path: mythicinfinity/libriheavy
    name: medium
    audio_column: audio
    text_column: text_original
    task: transcribe
    train_splits: [train]
    eval_splits: []
    # Big-3 cap (see the mix table above). Read by
    # scripts/train.py:_resample_to_target, which shuffles on self.seed
    # before selecting so the cap is a representative sample rather than
    # the first N rows — LibriHeavy ships ordered by chapter/speaker.
    target_samples: 600000

  # People's Speech `clean_sa` (~311K train natural, CC-BY). Sentence-
  # aligned subset of the clean tier: CER ≤ 20% upper bound on alignment
  # quality AND the `_sa` sentence-alignment filter applied. The wider
  # `clean` (~1.5M) and `dirty_sa` tiers are both out of the mix (see the
  # revert history below); `clean_sa` is the only Peoples train source.
  # Peoples eval refs are
  # human-transcribed (paid native-English transcribers, not auto-aligned),
  # so the eval gap vs universal-3-pro is genuine model quality, not ref
  # noise — the lever is acoustic exposure to the eval distribution.
  #
  # REVISED: stepped up from `clean_sa` (311K) → `clean` capped at 1M →
  # full `clean` (~1.5M, no cap) → back to `clean` capped at 1M → back
  # to `clean_sa` (311K natural). Run n18 (Peoples `clean` cap 1M)
  # showed the same conversational regression pattern as 09in (Peoples
  # `clean` 1.5M), just slower:
  #   - AMI WER: n18 step 13K 20.72 → n18 step 22K 26.26 (+5.54 during
  #     6K training steps)
  #   - ami-sdm WER: n18 step 13K 69.38 → step 22K 74.94 (+5.56)
  #   - CV WER: n18 step 13K 13.13 → step 22K 15.14 (+2.01)
  # All three are multi-speaker / accent-diverse / hard distributions
  # that were being out-voted by Peoples' dominant single-speaker
  # gradient signal. Even at 1M cap (~19% mix share), Peoples still
  # displaces AMI (1.3%) and CV (~18%) per-step gradient share enough
  # to bias the decoder toward Peoples-register specialization.
  # Reverting to `clean_sa` (311K, 5.8% share) — thurs's setting that
  # produced AMI 17.54 / ami-sdm 43.23. Loses the upstream-volume bet
  # (1M auto-aligned rows) for the per-row quality bet (sentence-aligned
  # subset). thurs's WER on Peoples eval was 22.05; the noisier-clean
  # tail did NOT improve Peoples WER in either cap-1M or uncapped runs
  # (both ~25), so the volume bet wasn't paying off on the source
  # distribution anyway.
  - path: MLCommons/peoples_speech
    name: clean_sa
    audio_column: audio
    text_column: text
    task: transcribe
    train_splits: [train]
    eval_splits: []

  # People's Speech validation split — MLCommons ships dev/test as separate
  # configs (not splits inside clean_sa). Validation is human-transcribed
  # (paid native-English transcribers) so eval refs are clean ground
  # truth, not auto-aligned. Pairs with the clean_sa train entry above
  # (validation is config-independent — same split serves whichever
  # train config is loaded).
  - path: MLCommons/peoples_speech
    name: validation
    audio_column: audio
    text_column: text
    task: transcribe
    train_splits: []
    eval_splits: [validation]

  # CommonVoice 17 English (fixie-ai mirror, ~1.1M train pre-filter).
  # Strict-validated filter applied in scripts/train.py: rows with
  # down_votes != 0 are dropped, cutting the tail of community-flagged
  # audio/transcript mismatches that Mozilla's standard `train` split
  # still admits (validated requires up_votes > down_votes, not
  # down_votes == 0). Drops ~13% of train rows (measured 2026-05-15 on
  # a 200-sample stream — earlier estimate of ~2-5% was wrong). 600K
  # cap with deterministic shuffle in scripts/train.py:
  # _resample_to_target samples representatively from the pool.
  #
  # CV is a +3.14 eval gap vs universal-3-pro driven primarily by
  # accent + device-diversity distribution shift, not reference noise.
  # Brief swap to CV19 (fsicoli mirror) was reverted — CV19's train
  # split is the same magnitude as CV17 (~1.1M), so the swap was mostly
  # a contributor-distribution refresh worth ~0.3-0.5 WER, not a
  # volume expansion. The fsicoli mirror is script-based with a 45GB
  # first-time download that hung the train-loop loader; CV17's
  # fixie-ai Parquet shards are smaller, faster, and battle-tested
  # with this codebase. Worth revisiting only if the +0.3-0.5 WER
  # delta becomes the deciding gap to u3pro.
  - path: fixie-ai/common_voice_17_0
    name: en
    audio_column: audio
    text_column: sentence
    task: transcribe
    train_splits: [train]
    eval_splits: [validation]
    # Big-3 cap. Applies to train_splits only, so the validation split
    # stays whole. CV ships ordered by validation date — the shuffle in
    # _resample_to_target is what keeps the cap from being a date slice.
    target_samples: 600000

  # Gigaspeech M (official speechcolab repo). M tier is ~1,000hr / ~910K
  # segments — natural cap, no replay. Stepped back down from L
  # (~2,500hr / ~2M) after the L step pushed GS to 34% of the mix and
  # pulled the decoder toward GS's register at the expense of cross-eval
  # performance. M is the curated subset of L/XL — same source
  # distribution, tighter label quality, ~2.5× smaller download. Long-
  # form / podcast / YouTube register coverage preserved. Requires
  # accepting the dataset license on HF and HF_TOKEN at load.
  - path: speechcolab/gigaspeech
    name: m
    audio_column: audio
    text_column: text
    task: transcribe
    train_splits: [train]
    eval_splits: []
    # Big-3 cap. M's natural size (~910K) is closest to the cap of the
    # three, so this trims the least.
    target_samples: 600000

  # Gigaspeech dev split — official repo ships dev/test as separate configs
  # (same pattern as the fixie mirror). The `dev` config exposes its data
  # under split name `validation` (HF builder convention).
  - path: speechcolab/gigaspeech
    name: dev
    audio_column: audio
    text_column: text
    task: transcribe
    train_splits: []
    eval_splits: [validation]

  # SPGISpeech M — financial earnings calls. Natural cap ~385K (was
  # capped to 150K in the prior tilt to fund GS L expansion; uncapped
  # here as part of the natural-cap reset). Kensho-employed
  # professional transcribers — highest label fidelity in the mix.
  # Carries the finance / earnings vocabulary, and the clean studio
  # acoustics serve as a high-fidelity supervision anchor for the
  # projector.
  - path: kensho/spgispeech
    name: M
    audio_column: audio
    text_column: transcript
    task: transcribe
    train_splits: [train]
    eval_splits: [validation]

  # Earnings22 (sanchit-gandhi/earnings22_robust_split, 11,450 train /
  # ~5GB / cased+punct). Earnings calls from 22 multinational companies
  # spanning 5 dialect families — UK, US, Indian, Canadian, Australian
  # English. Re-split by sanchit-gandhi into train/validation/test
  # (~80/10/10) explicitly to enable clean training-vs-evaluation
  # separation; the canonical Earnings22 ASR benchmark (used by
  # distil-whisper, Whisper-AT, and our own scripts/eval/datasets.py)
  # consumes the `test` split. Including the `train` split here is the
  # correct way to take Earnings22 domain exposure without contaminating
  # the eval signal — the rows are disjoint.
  #
  # Domain rationale: tiny-audio-next-thurs trails universal-3-pro by
  # +3.93 WER on Earnings22 eval despite SPGISpeech M (also earnings)
  # being in the mix at 385K. SPGI is studio-quality single-speaker
  # quarterly reports; Earnings22 is multi-speaker accent-diverse Q&A
  # over telephony — different acoustic + register profile. Direct
  # exposure to the eval distribution (without contamination) targets
  # this gap.
  #
  # Natural size only (~11K). Small mix share (~0.2%) but high-leverage
  # for the Earnings22 eval gap specifically; cross-corpus regularization
  # benefit on other evals is marginal at this volume. Each segment is
  # 5-15s typical, well under the 30s Whisper window. text_column is
  # `sentence` matching the eval pipeline's field for direct format
  # parity.
  - path: sanchit-gandhi/earnings22_robust_split
    audio_column: audio
    text_column: sentence
    task: transcribe
    train_splits: [train]
    eval_splits: []

  # VoxPopuli `en` (facebook, natural ~168K / ~543hr). European Parliament
  # L2-accented English read by parliamentarians — restores the VP
  # coverage Loquacious bundled (550hr via Loquacious-large; 500hr via
  # Loquacious-medium). `raw_text` preserves case + punctuation (matches
  # parliamentary record formatting); `normalized_text` is lowercased
  # with punctuation removed (LibriSpeech-style) and is the wrong format
  # for the Qwen3 decoder, so use `raw_text` despite the noisier label
  # surface. Natural cap — small enough to take whole, no replay risk.
  # Validation split exists so include it in eval rotation.
  - path: facebook/voxpopuli
    name: en
    audio_column: audio
    text_column: raw_text
    task: transcribe
    train_splits: [train]
    eval_splits: [validation]

  # AMI corpus IHM — close-talk meeting mic. Natural cap ~108,502, post-
  # <0.8s-filter effective ~79K (the filter drops backchannels like
  # "YEAH"/"HMM"/"OKAY" where audio/transcript span doesn't align).
  #
  # NATURAL CAP (no target_samples). Prior 305K target was ~3× replay
  # on the same speakers and produced 29% IHM eval — overfit signature,
  # not data-limited. IHM and SDM also share identical transcripts per
  # meeting segment (only the mic placement differs), so upsampling
  # either one is mostly replay against fixed unique-text count.
  # Natural cap is the right level — diversity is the constraint, not
  # gradient frequency.
  - path: edinburghcstr/ami
    name: ihm
    audio_column: audio
    text_column: text
    task: transcribe
    train_splits: [train]
    eval_splits: [validation]

  # AMI corpus SDM — single distant mic (far-field). Natural cap
  # ~107,319, post-<0.8s-filter effective ~67K. Shares hand-transcribed
  # labels with IHM; supervision signal is identical at the text level,
  # only the acoustics differ.
  #
  # NATURAL CAP (no target_samples). Same reasoning as IHM above —
  # upsampling SDM would mostly replay identical text labels against
  # different acoustic frames; the projector benefits from the audio
  # diversity but the decoder side caps at the natural unique-meeting-
  # segment count.
  - path: edinburghcstr/ami
    name: sdm
    audio_column: audio
    text_column: text
    task: transcribe
    train_splits: [train]
    eval_splits: [validation]

# Audio processing
sample_rate: 16000

# Processing options
dataset_cache_dir: ${hydra:runtime.cwd}/datasets_cache
# Cap each eval split at this many rows BEFORE concatenation so every
# dataset in the mix contributes a balanced slice to during-training
# eval. Prior `max_eval_samples: 2000` (global cap, applied post-concat)
# was a misconfig — it silently dropped all eval splits after the first
# ~2 (TEDLIUM 591 + head 1409 of Peoples val saturated the cap).
# Raised from 250 to 500 (~4,500 total across 9 eval splits): run ppbo0oqn
# observed eval-loss stdev of 0.0045 across 8 late-stage eval points, with
# late-stage improvements in the same 0.002–0.005 range. The signal was
# at or below the noise floor — couldn't distinguish "real plateau" from
# "noisy walk." Doubling samples cuts noise ~√2 to ~0.003, enough margin
# to make individual eval bumps clearly real vs noise. Eval cycle wall-
# clock grows ~2× (still small relative to the 30+ minutes between evals
# at step_eval=2000 with batch=100). Datasets with small eval splits
# (TEDLIUM 591, AMI ~500, Peoples val) are now near-uncapped; the bump
# matters most for CV / Gigaspeech dev / SPGI where eval splits are huge.
max_eval_samples_per_dataset: 500
