# Multi-ASR dataset configuration
#
# Natural-cap mix: every dataset runs at its full natural train-split
# size, with Gigaspeech on the curated M tier rather than L. The one
# exception is the Big-3 (LibriHeavy / CommonVoice 17 / Gigaspeech M),
# each held to a 600K `target_samples` cap so no single-speaker read
# corpus dominates the per-step gradient — see the mix table below.
# The prior revision's "tilt"
# (downcap Switchboard / AMI-SDM / SPGI to fund GS L expansion) was
# rolled back after observing cross-eval regression: cutting exposure
# on the "already-winning" evals removed cross-corpus regularization
# without producing matching gains on the target evals, and stepping
# GS to L pushed one corpus to 34% of the mix and dragged the decoder
# toward GS's register. Natural caps treat every source as a balanced
# contributor sized by its own data availability rather than by which
# eval we're chasing.
# LoquaciousSet was dropped in a prior revision; the unique coverage
# Loquacious bundled (LibriHeavy / VoxPopuli) is restored here as
# direct HF slices with explicit per-source sizing:
#   - LibriHeavy `medium` (5,042hr / ~1.1M, mythicinfinity mirror) —
#     replaces LibriSpeech clean+other (uppercase / no-punct) entirely.
#     `text_original` preserves case + punctuation, matching the Qwen3
#     decoder's native output format; LibriSpeech's uppercase-no-punct
#     was a format minority polluting the dominant cased+punct training
#     distribution. LibriHeavy's source pool is a strict superset of
#     LibriSpeech (same LibriLight base, plus the harder speakers LS
#     filtered out as "too noisy"), so this swap also gains acoustic
#     diversity. Step to `large` (50,794hr) only if LH-medium proves
#     data-limited on LibriVox-domain eval; medium already gives 3.4×
#     the prior LibriHeavy-small + LS clean+other clean-read budget.
#   - VoxPopuli `en` (543hr / ~168K) — L2-European parliamentary speech.
#     `raw_text` preserves case+punct; `normalized_text` is lowercase
#     no-punct (LS-style) and is the wrong format for the Qwen3 decoder.
# Raw YODAS (espnet/yodas) remains rejected: en000 is ~469 GB (500 ×
# 938 MB tarballs) for ~5,000hr / ~2.5M samples; codebase loads via
# load_dataset() in map mode (not streaming), so a target_samples cap
# would not reduce download. Label quality is also weaker than the
# other corpora (YouTube user-provided captions even on the manual
# tier are not verbatim ASR-grade).
# Emilia-YODAS 616h (MrDragonFox/EN_Emilia_Yodas_616h) was tried as a
# partial-YODAS path: a 228K-sample / 616hr / 108GB Parquet curation
# of the English portion segmented to single-speaker clips by the
# Emilia pipeline and re-transcribed by ElevenLabs Scribe v1. Removed
# after net regression on clean-speech evals — label-WER ceiling
# ~5-12% (Scribe v1) was noisier than every human-transcribed source
# in the mix and the YouTube-monologue register didn't earn its 6.3%
# mix share. If re-introducing later, filter by dnsmos > 3.0 + Scribe/
# Emilia transcript agreement to suppress the label-noise tail.
# Peoples: REMOVED FROM TRAINING 2026-09-18 (kept as an eval set).
# CORRECTION to what this header used to claim: it asserted that "both
# `_sa` configs apply the sentence-alignment filter ... so each segment's
# audio span matches its label span." That is false. The `_sa` filter
# constrains alignment QUALITY, not segment boundaries — `clean_sa`
# ships fixed ~15s grid windows in which 99.3% of rows begin mid-stream
# and the word straddling each seam is lost. The full measurement and
# the removal rationale are at the (now commented-out) clean_sa entry
# below. `dirty_sa` (602K) had been dropped earlier for label quality.
# Peoples eval refs ARE clean — test/validation are utterance-bounded,
# not grid-cut (median 4.2s vs train's 14.8s), and are human-transcribed
# per the MLCommons card. No dataset is repeated — every source runs at
# natural train-split size, so each example is seen at most once per
# epoch.
#
# MEASURED 2026-09-20 (datasets-server /filter, /statistics and /size, plus
# the real _normalize_label and _has_edge_content_tag run over sampled rows).
# The previous table was wrong by ~235,000 rows (9.3%) and wrong UNEVENLY.
# Root cause: DataCollator._MAX_AUDIO_SECONDS is 19.0 (scripts/train.py), set
# in 94d59598 on 2026-09-17, while every filter-loss figure here was derived
# in d602fd97 (2026-05-20) against a 30s cap and never re-derived. The
# collator's drops also run AFTER target_samples, so a capped source silently
# delivers fewer rows than its cap and no log line reports it.
#
# Two counts: raw load_dataset() rows, and rows surviving every filter
# (duration <0.8s / >19.0s, empty normalized label, CV down_votes, the
# Gigaspeech audiobook exclusion, the TEDLIUM leading-<unk> drop, and the
# LibriHeavy duration pre-filter added below).
# ┌──────────────────────────┬───────────┬───────────┬─────────┐
# │ Dataset                  │ Raw       │ Effective │ Percent │
# ├──────────────────────────┼───────────┼───────────┼─────────┤
# │ LibriHeavy med (cap 600K)│ 1,101,040 │   600,000 │   22.3% │
# │ Gigaspeech M (cap 600K)  │   910,140 │   600,000 │   22.3% │
# │ CommonVoice 17 en (600K) │ 1,101,170 │   599,940 │   22.3% │
# │ SPGISpeech M             │   385,000 │   385,000 │   14.3% │
# │ TEDLIUM-3                │   268,263 │  ~194,900 │    7.3% │
# │ VoxPopuli en             │   182,482 │  ~157,000 │    5.9% │
# │ AMI SDM                  │   107,319 │    74,265 │    2.8% │
# │ AMI IHM                  │   108,502 │    73,239 │    2.7% │
# └──────────────────────────┴───────────┴───────────┴─────────┘
# Total raw: ~4,163,916  →  Total effective: ~2,684,344
#
# 8 training sources. Big-3 combined 66.9%. AMI combined 5.5% and still the
# entire conversational share; the mix has zero 8 kHz telephony. Finance is
# carried by SPGISpeech alone (14.3%), professionally transcribed, no overlap
# with any eval split.
#
# STATE PLAINLY, because it cuts against this file's own stated goal: the
# Big-3 caps exist to hold single-speaker read speech down, and restoring
# LibriHeavy to a true 600K RAISES Big-3 concentration (66.5% as actually
# run before this revision -> 66.9% now). The 58.3% figure this file used to
# quote was never achievable once Peoples and Earnings22 left -- 3x600K over
# a ~2.7M denominator is ~67% by arithmetic. If a lower Big-3 share is
# wanted, the lever is LOWERING the three caps, not leaving an unintended
# shortfall in place. What changed here is that the caps now mean what they
# say.
#
# SWITCHBOARD REMOVED (2026-09-17). `hhoangphuoc/switchboard` returns 404 /
# RepositoryNotFoundError -- the repo is gone from the Hub, which is the
# normal fate of a public Switchboard mirror since the corpus is LDC-licensed
# (LDC97S62) and redistribution is not. It was 185,402 raw / ~180,000
# effective / 5.5% of the prior mix and the only telephony-band source here,
# so this is a real coverage loss, not a cleanup: the mix now has no 8 kHz
# narrowband speech at all, and the conversational share drops from 10.0% to
# AMI's 4.7%. Prior notes in this file record that merely *capping*
# Switchboard exposure regressed cross-eval performance even on
# non-Switchboard evals, so expect that again, larger.
#
# A replacement exists and is NOT WIRED IN because it is gated and access has
# not been granted. Recording the survey so it does not have to be redone:
#
#   dys-asr/switchboard-sr8000 -- the same corpus, better packaged and larger
#   than the dead mirror. 264,333 rows against 185,402, 42 parquet shards,
#   15.5 GB. 8 kHz native, which is the point rather than a defect: the
#   loader's Audio(sampling_rate=16000) cast upsamples it and leaves
#   band-limited audio in a 16 kHz container, which is what the encoder sees
#   on real telephony at inference.
#
#   Verified 2026-09-17: gated=manual. Repo metadata and README read fine
#   unauthenticated, but data files 403 with GatedRepoError, so adding the
#   entry produces a config that parses cleanly and then dies inside
#   load_dataset(). That is why it is a note instead of an entry.
#
#   To wire it up once access lands: add an entry with text_column `text`,
#   text_case `mono` (inferred from the LDC97S62 lowercase/no-punct
#   convention -- UNVERIFIED, confirm with `python -m scripts.debug.inspect_datasets`,
#   because if the mirror ships cased text then `mono` pushes it through
#   truecase and flattens proper nouns), train_splits [train], eval_splits []
#   since only a train split exists, and target_samples 185000 to restore the
#   5.5% share this mix was last validated at rather than let it arrive at
#   7.9%. Note a cap does not reduce the 15.5 GB download -- load_dataset()
#   runs in map mode, same caveat as the YODAS note above. Every per-source
#   percentage in the table above moves when it returns.
#
#   Same org, also gated, also worth having: fisher-sr8000 (1,114,202 rows of
#   conversational telephone speech, 59.2 GB -- 4x Switchboard) and
#   eval2000-sr8000 (Hub5'00, 4,742 rows, 0.2 GB, a `test` split, which is
#   the canonical telephony benchmark and would belong in
#   scripts/eval/datasets.py rather than here).
#
# (Two Switchboard-era share paragraphs were deleted here on 2026-09-20.
# They claimed 58.3% and 50.1% Big-3 share, contradicted each other and the
# table above, and both described a mix that still contained Switchboard,
# Peoples and Earnings22. The measured table is the single source of truth.)
#
# Rebalance after run n18 (Peoples clean 1M cap) showed continued
# conversational-eval regression at step 22K (AMI 26.26, ami-sdm 74.94
# — *worse* than n18 step 13K's 20.72 / 69.38). Diagnosis: even at 1M
# cap, Peoples + LibriHeavy + CV + GS combined to ~80% single-speaker
# presentational gradient share, drowning out AMI/CV.
#
# Single-variable rebalance vs n18:
#   Peoples 1M `clean` (cap) → `clean_sa` (311K natural).
#   Frees ~689K rows of gradient share that were going to noisy auto-
#   aligned single-speaker content. Matches thurs's setting that
#   produced AMI 17.54 / ami-sdm 43.23 at end of training.
#
# AMI IHM/SDM kept at natural cap (post-<0.8s-filter ~79K / ~67K, 3.1%
# combined mix share). Prior 305K upsample target was documented to
# produce 29% IHM WER from same-speaker replay (overfit, not data-
# limited). IHM and SDM share identical transcripts per meeting
# segment — only the mic placement differs — so upsampling is mostly
# replay against fixed unique-text count and recapitulates the
# replay-overfit failure mode.
#
# WHAM (nguyenvulebinh/wham) was tried multiple times for non-speech-
# rejection training (5%, 2%, then 2.8% with random truncation to
# [1, 18]s) and removed each time. The cleanest signal came from the
# sat run where WHAM was in the mix and most non-conversational evals
# regressed (CV +1.96, LS Other +0.83, Loquacious +0.87, VoxPopuli
# +0.60). The 2.8% empty-transcript gradient share appears to bias the
# model toward under-generation on low-volume / noisy speech segments.
# If non-speech rejection becomes a deployment-need later, re-introduce
# via inference-time silence/VAD heuristics rather than mix-share
# gradient signal.
#
# The text_override + _allow_empty_label + random_truncate_seconds
# plumbing in scripts/train.py (added for WHAM) is kept — generic
# config fields, future-useful.
#
# Earnings22 uses `sanchit-gandhi/earnings22_robust_split` (pre-split:
# train/validation/test). The `test` split is what the eval pipeline
# scores against (scripts/eval/datasets.py); the `train` split included
# here is disjoint and safe to train on.
#
# Filter loss by source (re-measured 2026-09-20 against the REAL 19.0s cap;
# the prior block was computed against 30.0s and understated every
# duration-driven loss):
# - LibriHeavy >19.0s: 19.6% (documented as ~3%, which is the 30s figure --
#   this single error is most of the 235K-row discrepancy). Now pre-filtered
#   at prep time via `exclude_where: {column: audio_duration, above: 19.0}`
#   so the 600K cap selects from an ~885K eligible pool and actually delivers
#   600K. Side effect, stated: it shifts LibriHeavy toward shorter segments
#   (median was 14.05s).
# - VoxPopuli >19.0s: ~13.7% (documented ~1.5% at 30s). Raw train is 182,482
#   rows, not the ~168K stated elsewhere in this file.
# - TEDLIUM leading-<unk>: 27.3% (see _EDGE_CONTENT_TAG_RE, now leading-only;
#   the leading+trailing union was 41.2%, and the old "roughly half" estimate
#   double-counted the 1,652 rows that do both). TEDLIUM >19.0s is 0.07%.
# - CommonVoice down_votes != 0: 14.81% (documented ~13%).
# - AMI <0.8s: IHM 32.3% (documented ~27%), SDM 30.8% (documented 30-37%).
#   The filtered rows are isolated backchannels -- "YEAH", "HMM", "OKAY" --
#   where audio span and reference do not align. Filter behaviour is correct.
# - SPGISpeech: ZERO loss from both duration filters (min 5.01s, max 15.00s).
# - Gigaspeech: audiobook exclusion drops 27.8%, leaving 656,893 -- still
#   above the 600K cap, so its contribution is unchanged.
#
# Download-size choices: Gigaspeech uses speechcolab's official M tier
# (~1,000hr / ~910K segments — curated subset of L/XL, natural cap,
# no replay). CommonVoice and LibriSpeech both use the fixie-ai
# mirrors for their sharded parquet layouts. TEDLIUM uses the
# canonical LIUM mirror. LibriHeavy uses mythicinfinity's mirror
# (audio arrays included, Opus-encoded) — pkufool/libriheavy is a
# Lhotse manifest repo, not a directly-loadable audio dataset.

datasets:
  # TEDLIUM-3 — TED talk presentational speech. Re-added after a prior
  # streaming experiment dropped it; tiny-audio is 2.08pt behind
  # universal-3-pro on this eval and direct exposure is the lever.
  # Note: transcripts are normalized (lowercase, no punctuation); ~7% of
  # the mix so the dominant cased+punct signal should absorb it. Apply
  # case+punct restoration as a preprocess in a follow-up run if output
  # formatting bias shows up empirically.
  - path: sanchit-gandhi/tedlium-data
    audio_column: audio
    text_column: text
    task: transcribe
    # Lowercase, no punctuation.
    text_case: mono
    text_punct: false
    train_splits: [train]
    eval_splits: [validation]
    # natural cap ~268K samples (~452hr); LIUM/tedlium no longer on Hub

  # LibriHeavy `medium` (mythicinfinity mirror, ~5,042hr / ~1.1M).
  # LibriVox-sourced audiobook readings — same underlying LibriLight
  # source pool as LibriSpeech, but `text_original` preserves the book's
  # case + punctuation (LibriSpeech collapses to uppercase / no-punct,
  # which fights the Qwen3 decoder's native cased+punct output format).
  # `medium` (5,042hr / 1.1M) replaces the prior LibriHeavy-small +
  # LibriSpeech clean+other trio (~1,470hr / ~404K combined) — 3.4×
  # more clean-read hours at uniformly higher label quality, removing
  # the LS uppercase-no-punct format minority that was polluting the
  # decoder's output distribution. LibriHeavy is a strict superset of
  # LibriSpeech's source pool (includes the speakers LS labeled "other"
  # and the harder speakers LS filtered out entirely), so this swap
  # also gains acoustic diversity, not just label quality. Tier choices:
  # small (509hr) was prior; large (50,794hr / 11.2M) would dominate the
  # mix (~50% share) — step to it only if eval shows LH-medium still
  # data-limited on LibriVox-domain coverage. Note pkufool/libriheavy
  # is a Lhotse manifest repo (not loadable as-is); use the
  # mythicinfinity mirror which ships Opus-encoded audio arrays
  # (~140 GB download for medium).
  - path: mythicinfinity/libriheavy
    name: medium
    audio_column: audio
    text_column: text_original
    task: transcribe
    # `text_original` preserves the book's case + punctuation.
    text_case: cased
    text_punct: true
    train_splits: [train]
    eval_splits: []
    # Drop the >19s tail BEFORE target_samples, not after. DataCollator's
    # 19.0s cap silently removed 19.6% of LibriHeavy at collate time, i.e.
    # after this cap had already picked 600K, so the source delivered 482,400
    # rows against a nominal 600K -- most of the 235K-row error in the old
    # mix table. Filtering here makes the cap select from the ~885K eligible
    # rows and deliver a true 600K. `audio_duration` is a float column on the
    # mythicinfinity mirror (verified via the datasets-server /info endpoint),
    # and `input_columns` keeps the filter from decoding audio to answer it.
    exclude_where:
      column: audio_duration
      above: 19.0
    # Big-3 cap (see the mix table above). Read by
    # scripts/train.py:_resample_to_target, which shuffles on self.seed
    # before selecting so the cap is a representative sample rather than
    # the first N rows — LibriHeavy ships ordered by chapter/speaker.
    target_samples: 600000

  # People's Speech `clean_sa` (~311K train natural, CC-BY). Sentence-
  # aligned subset of the clean tier: CER ≤ 20% upper bound on alignment
  # quality AND the `_sa` sentence-alignment filter applied. The wider
  # `clean` (~1.5M) and `dirty_sa` tiers are both out of the mix (see the
  # revert history below); `clean_sa` is the only Peoples train source.
  # Peoples eval refs are
  # human-transcribed (paid native-English transcribers, not auto-aligned),
  # so the eval gap vs universal-3-pro is genuine model quality, not ref
  # noise — the lever is acoustic exposure to the eval distribution.
  #
  # REVISED: stepped up from `clean_sa` (311K) → `clean` capped at 1M →
  # full `clean` (~1.5M, no cap) → back to `clean` capped at 1M → back
  # to `clean_sa` (311K natural). Run n18 (Peoples `clean` cap 1M)
  # showed the same conversational regression pattern as 09in (Peoples
  # `clean` 1.5M), just slower:
  #   - AMI WER: n18 step 13K 20.72 → n18 step 22K 26.26 (+5.54 during
  #     6K training steps)
  #   - ami-sdm WER: n18 step 13K 69.38 → step 22K 74.94 (+5.56)
  #   - CV WER: n18 step 13K 13.13 → step 22K 15.14 (+2.01)
  # All three are multi-speaker / accent-diverse / hard distributions
  # that were being out-voted by Peoples' dominant single-speaker
  # gradient signal. Even at 1M cap (~19% mix share), Peoples still
  # displaces AMI (1.3%) and CV (~18%) per-step gradient share enough
  # to bias the decoder toward Peoples-register specialization.
  # Reverting to `clean_sa` (311K, 5.8% share) — thurs's setting that
  # produced AMI 17.54 / ami-sdm 43.23. Loses the upstream-volume bet
  # (1M auto-aligned rows) for the per-row quality bet (sentence-aligned
  # subset). thurs's WER on Peoples eval was 22.05; the noisier-clean
  # tail did NOT improve Peoples WER in either cap-1M or uncapped runs
  # (both ~25), so the volume bet wasn't paying off on the source
  # distribution anyway.
  # PEOPLES clean_sa REMOVED FROM TRAINING (2026-09-18). It was 311K rows /
  # 10.1% of the mix, the 5th-largest source. Kept as an EVAL set (the
  # `validation` entry below is unaffected).
  #
  # The claim in the header of this file -- that both `_sa` configs apply a
  # sentence-alignment filter "so each segment's audio span matches its label
  # span" -- is WRONG. The `_sa` filter constrains alignment *quality*, not
  # segment boundaries. What `clean_sa` actually ships, measured by streaming
  # it:
  #   - 85.8-95.7% of rows are fixed ~15s windows (14.0-15.1s), cut on a grid
  #     rather than on sentence boundaries.
  #   - Row ids are literal chunk indices off one source mp3
  #     (`..._DOT_mp3_00000.flac`, `_00001.flac`, ...).
  #   - Only 4 of 600 sampled rows (0.7%) are chunk `00000`. So 99.3% of rows
  #     begin mid-stream BY CONSTRUCTION -- there is no clean subset to filter
  #     down to.
  #   - Labels do not join across seams; the word straddling each cut is lost.
  #     Label density is 2.773 words/sec of audio against 3.016 for the
  #     non-grid-cut eval segments, an estimated ~8% label shortfall (that
  #     figure is confounded by register differences, so treat it as an
  #     estimate, but the direction is unambiguous).
  #
  # The TEST and VALIDATION splits do NOT share this defect -- checked
  # explicitly, because if they did the regression would be a broken benchmark
  # rather than a model problem:
  #            duration median   % in 14.0-15.1s band   label density
  #   train          14.77s              90.7%            2.708 w/s
  #   test            4.21s               0.3%            3.016 w/s
  #   validation      4.06s               1.3%            2.831 w/s
  # Train is grid-cut; test and validation are utterance-bounded. So the eval
  # references are clean and the deficit is real. It also means the recipe was
  # training on 15s grid chunks and evaluating on short utterances -- a
  # duration/segmentation distribution mismatch layered on top of the label
  # damage, which is why the onset prior cost so much at eval time.
  #
  # Why that is harmful rather than merely noisy: for a large share of these
  # rows the loss-minimising behaviour is "do not transcribe the speech at
  # t=0", and the clips also start at sample 0 with no lead-in, so onset
  # position became a learnable cue for "skip the first word". Measured on the
  # Peoples eval: the model dropped >=1 leading reference word on 52/100
  # samples (92 words = 5.59 WER pts) against 22 samples / 45 words for
  # universal-3-5-pro; that 2.86-point gap exceeds the entire +2.61 deficit,
  # and stripping leading/trailing deletion runs made the two systems tie.
  #
  # The decisive argument for removal rather than mitigation: training on
  # these 311K rows did not buy Peoples accuracy. The frozen Granite encoder's
  # own CTC head -- which never saw this data -- scores 18.53 on the Peoples
  # eval against our full stack's 22.05. We paid 10.1% of the mix to be 3.5
  # WER points WORSE on the corpus we were buying. Peoples was also the single
  # largest error pool in the whole eval suite (24.3% of all our word errors)
  # and the only statistically significant regression (+3.46 at n=500,
  # CI [+2.45, +4.43]).
  #
  # Alternatives considered and rejected:
  #   - Filter to clean rows: impossible, 99.3% of rows are mid-stream.
  #   - Use another Hub mirror: every mirror inherits the upstream windowing.
  #     Verified on `ylacombe/peoples_speech_repunc` -- identical chunk-index
  #     ids, identical ~15s durations, identical failed seams. It does add a
  #     `repunc_text` field, but re-punctuating does not re-segment.
  #   - Re-segment ourselves: the right long-term fix and still worth doing.
  #     `MLCommons/unsupervised_peoples_speech` carries the raw long-form
  #     audio, so forced-aligning the full transcripts and re-splitting on
  #     sentence boundaries is possible -- but that is an alignment pipeline,
  #     not a config change. Revisit if the register is missed.
  #
  # KNOWN RISK, stated plainly: this file's own history records that cutting
  # exposure on a corpus regressed cross-eval performance even on unrelated
  # evals, by removing cross-corpus regularization. Dropping 10.1% of the mix
  # may cost something on the conversational evals that no longer have Peoples
  # in the gradient. Run this as a SINGLE-VARIABLE change and compare AMI /
  # AMI-SDM / Loquacious against the previous run before concluding. If the
  # regularization loss is real, the answer is re-segmentation, not reinstating
  # the grid-cut labels.
  #
  # Paired mitigation kept in place: _EDGE_CONTENT_TAG_RE in scripts/train.py
  # drops TEDLIUM rows whose label starts or ends with a stripped `<unk>`
  # (30.4% / 21.9% of TEDLIUM rows) -- a second, independent source of the
  # same onset-truncation prior.
  #
  # A lead-in-jitter augmentation was also written and then removed: with
  # Peoples gone there is no grid-cut source left to justify it. Gigaspeech,
  # the other long-form source, is utterance-segmented (median 3.00s, 0.2% of
  # rows in the 14.0-15.1s band, median 126s gap between segments), so every
  # segment already starts at a real speech onset.

  # People's Speech validation split — MLCommons ships dev/test as separate
  # configs (not splits inside clean_sa). Validation is human-transcribed
  # (paid native-English transcribers) so eval refs are clean ground
  # truth, not auto-aligned. Pairs with the clean_sa train entry above
  # (validation is config-independent — same split serves whichever
  # train config is loaded).
  - path: MLCommons/peoples_speech
    name: validation
    audio_column: audio
    text_column: text
    task: transcribe
    # Lowercase, no punctuation.
    text_case: mono
    text_punct: false
    train_splits: []
    eval_splits: [validation]

  # CommonVoice 17 English (fixie-ai mirror, ~1.1M train pre-filter).
  # Strict-validated filter applied in scripts/train.py: rows with
  # down_votes != 0 are dropped, cutting the tail of community-flagged
  # audio/transcript mismatches that Mozilla's standard `train` split
  # still admits (validated requires up_votes > down_votes, not
  # down_votes == 0). Drops ~13% of train rows (measured 2026-05-15 on
  # a 200-sample stream — earlier estimate of ~2-5% was wrong). 600K
  # cap with deterministic shuffle in scripts/train.py:
  # _resample_to_target samples representatively from the pool.
  #
  # CV is a +3.14 eval gap vs universal-3-pro driven primarily by
  # accent + device-diversity distribution shift, not reference noise.
  # Brief swap to CV19 (fsicoli mirror) was reverted — CV19's train
  # split is the same magnitude as CV17 (~1.1M), so the swap was mostly
  # a contributor-distribution refresh worth ~0.3-0.5 WER, not a
  # volume expansion. The fsicoli mirror is script-based with a 45GB
  # first-time download that hung the train-loop loader; CV17's
  # fixie-ai Parquet shards are smaller, faster, and battle-tested
  # with this codebase. Worth revisiting only if the +0.3-0.5 WER
  # delta becomes the deciding gap to u3pro.
  - path: fixie-ai/common_voice_17_0
    name: en
    audio_column: audio
    text_column: sentence
    task: transcribe
    # `sentence` is the written prompt the contributor read aloud.
    text_case: cased
    text_punct: true
    train_splits: [train]
    eval_splits: [validation]
    # Big-3 cap. Applies to train_splits only, so the validation split
    # stays whole. CV ships ordered by validation date — the shuffle in
    # _resample_to_target is what keeps the cap from being a date slice.
    target_samples: 600000

  # Gigaspeech M (official speechcolab repo). M tier is ~1,000hr / ~910K
  # segments — natural cap, no replay. Stepped back down from L
  # (~2,500hr / ~2M) after the L step pushed GS to 34% of the mix and
  # pulled the decoder toward GS's register at the expense of cross-eval
  # performance. M is the curated subset of L/XL — same source
  # distribution, tighter label quality, ~2.5× smaller download. Long-
  # form / podcast / YouTube register coverage preserved. Requires
  # accepting the dataset license on HF and HF_TOKEN at load.
  - path: speechcolab/gigaspeech
    name: m
    audio_column: audio
    text_column: text
    task: transcribe
    # ALL-CAPS; punctuation arrives as <COMMA>/<PERIOD> tags.
    text_case: mono
    text_punct: true
    train_splits: [train]
    eval_splits: []
    # Exclude the audiobook tier. Measured 2026-09-18 via the HF
    # datasets-server `statistics` endpoint:
    #             audiobook   youtube   podcast
    #   m/train     26.2%      42.1%     31.7%   (62,770-row partial scan)
    #   dev/valid    0.0%      55.3%     44.7%   (FULL 6,750-row scan)
    # The split we are scored on contains zero audiobook, yet a quarter of
    # the Gigaspeech rows we train on are audiobook -- a register that is 0%
    # of the eval, and one the mix already over-supplies via 600K LibriHeavy
    # audiobook rows.
    #
    # This is free, which is why it is worth doing even though the Gigaspeech
    # WER gap is not statistically significant (+0.41 at n=500, CI
    # [-0.04, +0.85]). MEASURED on the 2026-09-19 run: 253,247 of 910,140
    # m/train rows are audiobook (27.8%), leaving 656,893 -- still above the
    # 600K target_samples cap below, which _resample_to_target applies AFTER
    # this filter. So Gigaspeech contributes exactly 600K rows either way and
    # row count, mix share and download are all UNCHANGED. The ~167K
    # out-of-register rows that used to land in the 600K sample are swapped
    # for in-register ones, not removed; there is no volume to make up.
    #
    # Headroom is only 56,893 rows (9.5%). Exclude a second tier here and the
    # cap stops binding, at which point _resample_to_target silently
    # repeat-pads rows to reach 600K -- check the dropped/kept counts in the
    # exclude_where log line before adding one.
    #
    # `source` is a ClassLabel (ids 0=audiobook, 1=podcast, 2=youtube), not a
    # string column; _prepare_split resolves these names to ids. Comparing
    # rows against the names directly matches nothing -- that bug made this
    # filter drop 0/910140 rows on its first run.
    #
    # Must be applied before the keep_cols pruning in _prepare_split, which
    # is why the filter is declared here and executed early; see
    # `exclude_where` in scripts/train.py.
    exclude_where:
      column: source
      values: [audiobook]
    # Big-3 cap. M's natural size (910,140; 656,893 after the audiobook
    # exclusion) is closest to the cap of the three, so this trims the least.
    target_samples: 600000

  # Gigaspeech dev split — official repo ships dev/test as separate configs
  # (same pattern as the fixie mirror). The `dev` config exposes its data
  # under split name `validation` (HF builder convention).
  - path: speechcolab/gigaspeech
    name: dev
    audio_column: audio
    text_column: text
    task: transcribe
    # ALL-CAPS; punctuation arrives as <COMMA>/<PERIOD> tags.
    text_case: mono
    text_punct: true
    train_splits: []
    eval_splits: [validation]

  # SPGISpeech M — financial earnings calls. Natural cap ~385K (was
  # capped to 150K in the prior tilt to fund GS L expansion; uncapped
  # here as part of the natural-cap reset). Kensho-employed
  # professional transcribers — highest label fidelity in the mix.
  # Carries the finance / earnings vocabulary, and the clean studio
  # acoustics serve as a high-fidelity supervision anchor for the
  # projector.
  - path: kensho/spgispeech
    name: M
    audio_column: audio
    text_column: transcript
    task: transcribe
    # Kensho transcribers, cased+punct. 13% of rows are lowercase
    # sliding-window fragments that the heuristic truecased, injecting
    # proper nouns (permissions -> Permissions, website -> Website).
    text_case: cased
    text_punct: true
    train_splits: [train]
    eval_splits: [validation]

  # Earnings22 (sanchit-gandhi/earnings22_robust_split, 11,450 train /
  # ~5GB / cased+punct). Earnings calls from 22 multinational companies
  # spanning 5 dialect families — UK, US, Indian, Canadian, Australian
  # English. Re-split by sanchit-gandhi into train/validation/test
  # (~80/10/10) explicitly to enable clean training-vs-evaluation
  # separation; the canonical Earnings22 ASR benchmark (used by
  # distil-whisper, Whisper-AT, and our own scripts/eval/datasets.py)
  # consumes the `test` split. Including the `train` split here is the
  # correct way to take Earnings22 domain exposure without contaminating
  # the eval signal — the rows are disjoint.
  #
  # Domain rationale: tiny-audio-next-thurs trails universal-3-pro by
  # +3.93 WER on Earnings22 eval despite SPGISpeech M (also earnings)
  # being in the mix at 385K. SPGI is studio-quality single-speaker
  # quarterly reports; Earnings22 is multi-speaker accent-diverse Q&A
  # over telephony — different acoustic + register profile. Direct
  # exposure to the eval distribution (without contamination) targets
  # this gap.
  #
  # Natural size only (~11K). Small mix share (~0.2%) but high-leverage
  # for the Earnings22 eval gap specifically; cross-corpus regularization
  # benefit on other evals is marginal at this volume. Each segment is
  # 5-15s typical, well under the 30s Whisper window. text_column is
  # `sentence` matching the eval pipeline's field for direct format
  # parity.
  # EARNINGS22 REMOVED FROM TRAINING (2026-09-18) -- EVAL CONTAMINATION.
  # It was 11,450 raw / ~11,000 effective / 0.4% of the mix.
  #
  # `sanchit-gandhi/earnings22_robust_split` is NOT call-disjoint, despite the
  # note above claiming "the rows are disjoint". Measured by streaming 3,000
  # train and 1,500 test rows: **124 of 124 sampled test `source_id`s also
  # appear in the train sample -- 100%**. The re-split is a segment-level
  # random shuffle over a flat pool of ~125 calls, so every call in the test
  # set has sibling segments -- same speakers, same acoustics, same company
  # names and tickers -- in training. The original claim is true at the ROW
  # level and false at the CALL/SESSION level, which is the level that matters.
  #
  # `scripts/eval/datasets.py` scores the test split of this same repo, so the
  # Earnings22 eval number was measuring memorisation. The scale of the
  # distortion: our 5.88 WER against AssemblyAI universal-3-5-pro's 10.90 was
  # the single largest apparent win in the suite and one of only three
  # statistically significant results -- and the baseline had never seen the
  # data. Removing it from the POOLED comparison moves us from a significant
  # overall win (-0.77, CI [-1.23, -0.34]) to a statistical tie
  # (-0.39, CI [-0.81, +0.02]).
  #
  # Dropping it from training rather than re-splitting: a call-disjoint
  # re-split is possible (group by `source_id`, hold out ~20% of calls) but
  # buys ~0.4% of the mix while adding a bespoke split to maintain. The eval
  # is the valuable half -- Earnings22 is a standard benchmark and the only
  # accented multi-dialect earnings-call set in the suite -- so keep scoring
  # it and stop training on it. SPGISpeech M (385K, 13.9%) already carries the
  # finance register with professionally-transcribed labels.
  #
  # Every other eval corpus here uses canonical speaker-disjoint benchmark
  # splits; Earnings22 was the only custom re-split and the only contaminated
  # one. Checked, not assumed.

  # VoxPopuli `en` (facebook, natural ~168K / ~543hr). European Parliament
  # L2-accented English read by parliamentarians — restores the VP
  # coverage Loquacious bundled (550hr via Loquacious-large; 500hr via
  # Loquacious-medium). `raw_text` preserves case + punctuation (matches
  # parliamentary record formatting); `normalized_text` is lowercased
  # with punctuation removed (LibriSpeech-style) and is the wrong format
  # for the Qwen3 decoder, so use `raw_text` despite the noisier label
  # surface. Natural cap — small enough to take whole, no replay risk.
  # Validation split exists so include it in eval rotation.
  - path: facebook/voxpopuli
    name: en
    audio_column: audio
    text_column: raw_text
    task: transcribe
    # `raw_text` follows the parliamentary record (case + punct).
    text_case: cased
    text_punct: true
    train_splits: [train]
    eval_splits: [validation]

  # AMI corpus IHM — close-talk meeting mic. Natural cap ~108,502, post-
  # <0.8s-filter effective ~79K (the filter drops backchannels like
  # "YEAH"/"HMM"/"OKAY" where audio/transcript span doesn't align).
  #
  # NATURAL CAP (no target_samples). Prior 305K target was ~3× replay
  # on the same speakers and produced 29% IHM eval — overfit signature,
  # not data-limited. IHM and SDM also share identical transcripts per
  # meeting segment (only the mic placement differs), so upsampling
  # either one is mostly replay against fixed unique-text count.
  # Natural cap is the right level — diversity is the constraint, not
  # gradient frequency.
  - path: edinburghcstr/ami
    name: ihm
    audio_column: audio
    text_column: text
    task: transcribe
    # ALL-CAPS, no punct. 21% of rows are under the truecase floor.
    text_case: mono
    text_punct: false
    train_splits: [train]
    eval_splits: [validation]

  # AMI corpus SDM — single distant mic (far-field). Natural cap
  # ~107,319, post-<0.8s-filter effective ~67K. Shares hand-transcribed
  # labels with IHM; supervision signal is identical at the text level,
  # only the acoustics differ.
  #
  # NATURAL CAP (no target_samples). Same reasoning as IHM above —
  # upsampling SDM would mostly replay identical text labels against
  # different acoustic frames; the projector benefits from the audio
  # diversity but the decoder side caps at the natural unique-meeting-
  # segment count.
  - path: edinburghcstr/ami
    name: sdm
    audio_column: audio
    text_column: text
    task: transcribe
    # ALL-CAPS, no punct. 21% of rows are under the truecase floor.
    text_case: mono
    text_punct: false
    train_splits: [train]
    eval_splits: [validation]

# Audio processing
sample_rate: 16000

# Processing options
dataset_cache_dir: ${hydra:runtime.cwd}/datasets_cache
# Cap each eval split at this many rows BEFORE concatenation so every
# dataset in the mix contributes a balanced slice to during-training
# eval. Prior `max_eval_samples: 2000` (global cap, applied post-concat)
# was a misconfig — it silently dropped all eval splits after the first
# ~2 (TEDLIUM 591 + head 1409 of Peoples val saturated the cap).
# Raised from 250 to 500 (~4,500 total across 9 eval splits): run ppbo0oqn
# observed eval-loss stdev of 0.0045 across 8 late-stage eval points, with
# late-stage improvements in the same 0.002–0.005 range. The signal was
# at or below the noise floor — couldn't distinguish "real plateau" from
# "noisy walk." Doubling samples cuts noise ~√2 to ~0.003, enough margin
# to make individual eval bumps clearly real vs noise. Eval cycle wall-
# clock grows ~2× (still small relative to the 30+ minutes between evals
# at step_eval=2000 with batch=100). Datasets with small eval splits
# (TEDLIUM 591) are near-uncapped; AMI validation is 13,098 rows so the
# cap binds hard there; the bump
# matters most for CV / Gigaspeech dev / SPGI where eval splits are huge.
max_eval_samples_per_dataset: 500
