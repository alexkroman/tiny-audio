# Main configuration
#
# Runs the joint from-scratch recipe by default: frozen GLM-ASR-Nano-2512
# encoder + fresh MLP projector + Qwen3-0.6B decoder fine-tuned jointly.
# Use `+experiments=mps_smoke` for the local MPS/CPU smoke variant.
defaults:
  - data: multiasr
  - training: production
  - _self_

# Model configuration (must match ASRConfig parameter names)
model:
  audio_model_id: zai-org/GLM-ASR-Nano-2512
  # Qwen3-0.6B ships with a chat_template, which DataCollatorForChatML requires.
  text_model_id: Qwen/Qwen3-0.6B
  projector_type: mlp  # Options: mlp, mosa, moe, qformer

  # Master weights in fp32 so AdamW updates below the bf16 ULP gap (~0.0078
  # near 1.0) actually land — bf16 master weights silently round small
  # RMSNorm/LayerNorm updates to zero, freezing every norm scale in the LM.
  # Compute is still bf16 via training.bf16=true autocast.
  model_dtype: float32

  # Projector settings
  projector_pool_stride: 4
  projector_hidden_dim: 1024
  # Label smoothing applied inside the LM's loss_function (consumed by liger's
  # fused linear CE when apply_liger_kernel_to_qwen3() is active in
  # scripts/train.py). ASRModel.forward zeros it on eval so eval/loss reports
  # raw CE. HF Trainer's label_smoothing_factor stays at 0 (see training
  # config) to avoid double-smoothing and to avoid the LabelSmoother's
  # (B,T,V) fp32 log_softmax materialization (~15GB at B=50/V=152k on
  # Qwen3-0.6B).
  label_smoothing: 0.1

  # Generation settings
  max_new_tokens: 256

# Hydra output directories
hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  job:
    chdir: true

verbose: false

# Data loading. EPYC 9355 has 32 cores; this is one-shot dataset prep, so
# we can afford to use most of them.
num_proc: 24
