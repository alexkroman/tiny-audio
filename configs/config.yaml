# Main configuration -- the default training recipe.
#
#   openai/whisper-large-v3 encoder                    FULLY FROZEN (0 trainable)
#   -> MLP projector (fresh init, 4x frame stacking, lr 1e-3)
#   -> Qwen/Qwen3-1.7B, base FROZEN + LoRA all-linear r=64 (lr 1e-4)
#
# WHISPER + QWEN3 (2026-10-20). Replaces granite-speech-5.0-470m-turboctc-nc
# + Qwen3.5-2B (verbatim-aug-2: mean of 9 5.490, #26 of 56; that recipe is
# still the published model, mazesmazes/tiny-audio). The leaderboard ranks
# above it are mostly encoders trained for the system they sit in, and the
# Granite encoder alone (CTC, #20, 5.441) beat the full stack, so the encoder
# is the lever. This is Higgs Audio v3 STT's pairing (#13, 5.224:
# Whisper-large-v3 + Qwen3-1.7B-Base + MLP), with the stock encoder rather
# than Higgs's tuned one and the post-trained decoder (see text_model_id).
# It also drops the Granite NC encoder's CC-BY-NC-SA terms: Whisper is MIT,
# Qwen3 Apache-2.0.
#
#   poetry run python scripts/train.py
#
# Every key below is checked against the structured-config schema in
# scripts/train_config.py (`base_config`): unknown keys and mistyped values
# fail at startup. Add new knobs there first, or use `+training.<key>=...`
# for a one-off.
---
defaults:
  - base_config
  - data: multiasr
  - training: production
  - _self_

# Model configuration (must match ASRConfig parameter names)
model:
  # Stock Whisper-large-v3 (32 layers, d=1280, 128 mel bins), the encoder
  # Higgs Audio v3 STT builds on. Higgs fine-tuned theirs (Apache-2.0) and
  # could be swapped in later; their fine-tune excluded every recording in
  # the leaderboard's test sets.
  audio_model_id: openai/whisper-large-v3
  # Post-trained, not Higgs's Base. Both ship the same chat template, but the
  # decoder is frozen, so its output row for <|im_end|> (the end of every
  # training target) never changes; the post-trained model is trained to end
  # turns with it, Base is not, and a frozen Base that rarely predicts it
  # would keep generating. Unverified for Base, so the safe choice; Base is a
  # one-line swap.
  text_model_id: Qwen/Qwen3-1.7B
  # Whisper's two convs (the ASRConfig default) take 100 Hz mel to 50 Hz.
  projector_hidden_dim: 4096
  model_dtype: bfloat16
  projector_dtype: float32

  # PROJECTOR, surveyed against transformers 5.17 (2026-09-21): RMSNorm(in)
  # -> Linear -> GELU -> Linear with biases, a fixed output scale, no dropout,
  # no trailing norm -- the tree's majority design (GLM-ASR, Voxtral,
  # AudioFlamingo3, Qwen3-ASR are two-layer GELU MLPs; Higgs v3 STT an MLP
  # after 2x stacking; Canary-Qwen a single linear or identity).
  #
  # 4x frame stacking: Whisper's 50 Hz becomes 12.5 Hz, the published recipe's
  # audio-token rate (~237 tokens for a 19s clip), so decoder cost and batch
  # memory stay comparable. Higgs runs at 25 Hz (2x); that doubles the
  # decoder's audio tokens, so it is a separate experiment.
  projector_pool_stride: 4

  # INFERENCE prompt only. Training picks the prompt per row from
  # `text_punct` (scripts/train.py _build_sample), so the plain default
  # ("Transcribe the speech to text") is only ever trained on TEDLIUM + AMI,
  # ~12% of the mix. Leaving this unset makes inference borrow their style.
  # Measured on frozen-2 (2026-09-24, same weights, CV n=300): plain 9.50 vs
  # this prompt 7.38. The plain prompt drops all terminal punctuation and
  # prefixes "Laughter" on 15% of CV rows.
  transcribe_prompt: "Transcribe the speech with proper punctuation and capitalization"

  # bfloat16: the encoder is fully frozen, so there are no updates for bf16
  # to quantise away, and the memory goes to batch size.
  encoder_dtype: bfloat16

  # The LoRA measurements below were taken on Qwen3.5-2B (hybrid
  # linear-attention). Qwen3 has none of its DeltaNet modules, so all-linear
  # here covers attention and MLP; the alpha, dropout and rank reasoning
  # carries over, the per-module numbers do not.
  use_lora: true
  lora_rank: 64
  # 64, i.e. alpha/r = 1.0. Measured on a scale-2.0 (alpha 128) adapter
  # (2026-09-20) by reconstructing (alpha/r)*B@A per module and taking
  # ||dW||_F / ||W_base||_F against Qwen3.5-2B:
  #
  #     ALL 186 adapted matrices   mean 18.39%   max 55.46%
  #     linear_attn.in_proj_b      mean 27.93%   max 55.46%
  #     mlp.up_proj                mean 21.04%
  #     self_attn.v_proj           mean 11.27%   (smallest)
  #
  # The decisive comparison: FULLY FINE-TUNING this decoder (1.37B trainable)
  # moved it 13.31% over a complete run. A 67M-param adapter at scale 2.0
  # perturbed the base model HARDER than unfreezing all of it did, and it
  # oscillated: 123 units of path for 50 units of net displacement, with
  # cos(seg, prev) running -0.09 to -0.17 from step 10,000. Steps too large,
  # overshoot, thrash. Scale 1.0 halves the expected perturbation to ~9.2%,
  # under full fine-tuning and in the neighbourhood of Granite Speech 3.3
  # (scale 0.5, the closest published frozen-base + LoRA analogue).
  #
  # RANK STAYS AT 64 -- checked, not assumed. Singular spectrum of the same
  # updates: rank needed for 90% of update energy is 41.8-46.5 on gate/up/
  # down/o/out_proj, so rank 32 would clip over half the modules. (Stable
  # rank reads 7.6-14.2, but that metric is dominated by the leading singular
  # value and understates usable capacity.)
  lora_alpha: 64
  # 0.0. Surveyed against the published frozen-base + LoRA speech recipes
  # (2026-09-21) rather than assumed:
  #
  #     Granite Speech 3.3 (adapter_config)   r=64   alpha=32   dropout 0.0    q,v
  #     Canary-Qwen-2.5B   (config.json)      r=128  alpha=256  dropout 0.01   q,v
  #     Phi-4-multimodal   (speech_lora)      r=320  alpha=640  dropout 0.01   qkv,o,gate_up,down
  #     Fun-ASR-Nano       (lora_conf, off)   r=16   alpha=32   dropout 0.05   q,v
  #     SLAM-LLM           (peft default)     r=8    alpha=32   dropout 0.05   q,v
  #     Ultravox                              no LoRA (r=0); unfreezes modules instead
  #
  # The large-data recipes (Granite, Canary-Qwen, Phi-4: 10^4-10^5 hours) sit
  # at 0.0-0.01; the 0.05s are small-data academic defaults. This run sees
  # ~2.7M unique utterances once, with 3% of the model trainable and a flat
  # train/eval gap on record, so there is nothing for dropout to regularise.
  # Revisit only if the gap opens.
  lora_dropout: 0.0
  # all-linear, verified against a trained adapter (2026-09-20). Per-layer
  # mean ||dW||_F/||W||_F across all 186 adapted matrices runs 14.60% (layer
  # 23) to 21.78% (layer 0) with no concentration at any depth; the 6
  # full-attention layers sit slightly cooler than the 18 linear-attention
  # layers. Nothing is inert, so there is no depth slice for
  # `layers_to_transform` and no family to drop.
  #
  # Narrowing toward the published analogue would be a mistake on THIS
  # architecture: Granite Speech 3.3 adapts q_proj/v_proj only, but Qwen3.5 is
  # hybrid and full attention exists in just a quarter of its layers, so the
  # literal translation leaves most layers unadapted.
  #
  # No per-module rank override on the DeltaNet gates (`in_proj_a` /
  # `in_proj_b`): at r=64 they are over-parameterised (geometry caps the
  # realised update at their 16 output rows) but not mis-scaled, since alpha/r
  # = 1.0 holds for every matrix. Over-parameterised LoRA is harmless; a wrong
  # scale is not. If the gates ever need attention, drop them from
  # `lora_target_modules` rather than tuning their rank.
  lora_target_modules: all-linear

  # Generation settings
  max_new_tokens: 256

# Hydra output directories
hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  job:
    chdir: true
