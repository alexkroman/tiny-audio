# @package _global_
# v3: v2 with the mined pauses cleaned by an LLM completeness label.
#
# v2 halved mid-sentence false fires (25% -> 10%), but the rest were mostly
# prefixes that ARE complete sentences ("Yes, that's right.") which the mining
# heuristic had labelled holds -- while the source labels such interior
# boundaries fires (chunk_cut). That contradiction capped accuracy.
# `ta turn-aware label-pauses` had Claude judge each prefix; v3 keeps only the
# ones judged `incomplete`. Everything else is v2, for a clean comparison.
pool:
  extra_labels: [incomplete]
data:
  pool_dir: data/turn_aware_v3
training:
  output_dir: outputs/turn_aware/v3
  run_name: turn-aware-qwen3-asr-0.6b-v3
hub_model_id: mazesmazes/tiny-audio-turn-aware-qwen3-asr-v3
