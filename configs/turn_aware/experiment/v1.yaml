# @package _global_
# v1: the recipe behind mazesmazes/tiny-audio-turn-aware-qwen3-asr, as shipped.
# Dataset observations only, one silenced copy per hold, base-model targets
# verbatim. Kept runnable as the control for every later recipe.
#
# Result (test, full): recall 0.996, holds 0.923, payload_cut 0.861,
# word_cut 0.894; fires at 25.1% of mined mid-sentence pauses (validation).
pool:
  extra: null
  hold_copies:
    payload_cut: 1
    word_cut: 1
  strip_hold_punct: false
data:
  pool_dir: data/turn_aware
training:
  output_dir: outputs/turn_aware/v1
  run_name: turn-aware-qwen3-asr-0.6b-v1
hub_model_id: mazesmazes/tiny-audio-turn-aware-qwen3-asr
