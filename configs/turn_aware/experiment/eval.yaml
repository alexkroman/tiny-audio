# @package _global_
# eval: a recipe-neutral pool for scoring ANY model (`ta runpod eval-turn-aware`
# builds its split with this). One copy per hold so no kind is over-weighted,
# targets verbatim so text_wer reads drift from the base, and the mined
# mid-sentence pauses included so acc_kind/mid_sentence_pause is reported.
pool:
  hold_copies:
    payload_cut: 1
    word_cut: 1
  strip_hold_punct: false
data:
  pool_dir: data/turn_aware_eval
hub_model_id: null
