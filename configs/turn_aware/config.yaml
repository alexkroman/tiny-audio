# TURN-AWARE ASR on Qwen3-ASR-0.6B.
#
#   Qwen/Qwen3-ASR-0.6B-hf   audio tower + projector + Qwen3 decoder, all FROZEN
#   + LoRA r=32 on decoder q/k/v/o          (9.18M, lr 2e-4)
#   + one trainable <END_OF_TURN> row       (tied: embedding AND lm_head logit)
#
# The model keeps transcribing and appends <END_OF_TURN> when the speaker is
# done AND >=0.3 s of silence has been heard; holding is the absence of the
# token. One greedy decode yields both the transcript and the endpoint.
#
# A run is this file plus one preset from experiment/ (v1, v2a, v2, eval);
# the SAME overrides drive the data and the training, so they cannot drift:
#
#   poetry run ta turn-aware build-pool +experiment=v2              # builds data.pool_dir
#   poetry run python -m scripts.turn_aware.train +experiment=v2
#   ta runpod train-turn-aware <host> <port> +experiment=v2        # both, on a pod
#   poetry run ta turn-aware evaluate -m outputs/turn_aware/v2/final
#
# Without a preset you get the v2 recipe under a scratch identity (pool
# data/turn_aware_dev, no Hub push) -- presets own pool_dir, output_dir,
# run_name and hub_model_id so two recipes never share a pool or a repo.
#
# Standalone config tree (configs/turn_aware/, NOT configs/experiments/):
# scripts/train.py builds ASRModel, and Qwen3-ASR is not an encoder + fresh
# projector + LLM stack. Nothing here inherits from configs/config.yaml.
#
# WHY THIS SHAPE
#
# - LoRA on attention only, decoder only. The marker is a decision about the
#   decoded text plus the audio tail, read through attention; the MLPs and the
#   audio tower are where transcription quality lives, and freezing them is
#   the cheapest insurance against WER drift. alpha/r = 2 at r=32 is 9.18M
#   params: generous for one new decision, small enough to not re-learn ASR.
#
# - Self-distilled targets (pool.target_text: self, the default). The
#   transcript part of every label is the base model's own greedy output, so
#   ~all the loss that is not the marker is already near zero at step 0 and
#   the gradient concentrates on WHEN to emit the marker. `eval_markers/text_wer`
#   is WER against those same targets: it reads drift from the base, and it
#   should stay near 0.
#
# - weight_decay 0.0. PEFT trains only a delta for the marker row, not the
#   whole 151,936-row embedding, so decay could only ever touch LoRA and that
#   delta. Pulling the delta toward zero pulls the marker back toward its
#   mean-embedding init, which is a bias against ever firing. 0.0 is also
#   standard LoRA practice and leaves alpha as the only magnitude control.
#
# - One pass. v1's ~80k train observations expanded to ~119k examples (~3.7k
#   steps at batch 32); v2's mined pauses and hold copies take it to ~145k
#   (~4.5k steps). Cosine to 5% of peak. Watch eval_markers/fire_f1 and
#   text_wer together: F1 still rising at the end is the case for a 2nd epoch.

# How `ta turn-aware build-pool` turns dataset observations into training
# examples (scripts/turn_aware/data.py:PoolConfig documents each knob). The
# resolved section is written next to the manifests as pool_config.json;
# build-pool skips a split whose manifest already matches it, and training
# refuses a pool built with different settings.
pool:
  # Transcripts in every target come from this BASE model (self-distillation),
  # even when model.model_id continues from a turn-aware checkpoint.
  target_model: Qwen/Qwen3-ASR-0.6B-hf
  # self: target_model's own transcript; dataset: the observation's `text`.
  target_text: self
  # Mined mid-sentence pauses (`ta turn-aware mine-pauses`) merged as holds:
  # a Hub dataset or a local dir of {split}.parquet. null = none.
  extra: mazesmazes/turn-end-detection-mined-pauses
  # Keep only extra rows whose `completeness` (`ta turn-aware label-pauses`)
  # is one of these; null keeps every row (v2's behavior, before labels).
  extra_labels: null
  # transcripts-{split}.jsonl shared by every pool (keyed by observation, so
  # only valid for one target_model). v1's pool dir already holds ~80k.
  transcript_cache: data/turn_aware
  seed: 0
  fire_tail_s: [0.3, 1.2]
  hold_tail_s: [0.3, 2.0]
  long_tail_s: [2.0, 4.0]
  long_tail_prob: 0.1
  nosil_prob: 0.6
  lead_sil_s: [0.5, 2.0]
  lead_sil_prob: 0.15
  silence_only_frac: 0.02
  silence_only_s: [0.5, 4.0]
  ctx_prob: 0.5
  max_audio_s: 30.0
  # Silenced copies per label-0 observation, by kind (unlisted kinds: 1).
  # Add a kind with a leading +: `+pool.hold_copies.trailing_frag=2`.
  hold_copies:
    payload_cut: 3
    word_cut: 2
  strip_hold_punct: true

model:
  model_id: Qwen/Qwen3-ASR-0.6B-hf
  # bfloat16 base on CUDA; LoRA factors are kept fp32 by PEFT's adapter
  # autocast. On a Mac use `model.dtype=float32` if MPS bf16 misbehaves.
  dtype: bfloat16
  lora_rank: 32
  lora_alpha: 64
  lora_dropout: 0.05
  # Decode-time confidence bar for the marker, written into the saved
  # generation_config.json as sequence_bias = -tau on <END_OF_TURN>, so plain
  # generate() fires only when logit(marker) - logit(<|im_end|>) > tau. 0 is
  # plain greedy. Pick it from `ta turn-aware evaluate`'s threshold sweep on
  # VALIDATION; `ta turn-aware set-threshold` updates an existing checkpoint.
  end_of_turn_threshold: 0.0

data:
  dataset_id: mazesmazes/turn-end-detection
  # Written by `ta turn-aware build-pool`: {split}.parquet + pool_config.json.
  # Each preset sets its own.
  pool_dir: data/turn_aware_dev
  # Manifest + turns split names. A local smoke can point both at a small
  # validation pool and skip the ~9 GB train split entirely.
  train_split: train
  eval_split: validation
  # Teacher-forced eval/loss subset (balanced across schemas).
  eval_samples: 2000
  # Greedy-decoded subset for eval_markers/* (fire P/R/F1, per-kind accuracy,
  # text drift), stratified across the 5 schemas (~400 each). 2000, not the
  # v1 run's 600: at 600 payload_cut had ~17 rows, so one row moved it 6
  # points and the curves could not say whether training had converged --
  # which is what decides a second epoch. Costs ~1-2 min per eval on an A100.
  marker_eval_samples: 2000

resume_from_checkpoint: null
# The MERGED final model is pushed here after training (null = keep local).
# Deliberately outside `training`: Trainer's own push_to_hub would upload raw
# PEFT checkpoints at every save. Smoke runs should pass `hub_model_id=null`,
# or a 30-step model overwrites the real one.
hub_model_id: null  # presets set their own repo

training:
  output_dir: outputs/turn_aware/dev
  seed: 0
  num_train_epochs: 1
  max_steps: -1
  per_device_train_batch_size: 32
  per_device_eval_batch_size: 32
  gradient_accumulation_steps: 1
  learning_rate: 2e-4
  lr_scheduler_type: cosine_with_min_lr
  lr_scheduler_kwargs:
    min_lr_rate: 0.05
  warmup_steps: 100
  weight_decay: 0.0
  max_grad_norm: 1.0
  bf16: true
  logging_steps: 20
  eval_strategy: steps
  eval_steps: 500
  save_strategy: steps
  save_steps: 500
  save_total_limit: 3
  dataloader_num_workers: 8
  report_to: wandb
  run_name: turn-aware-dev

hydra:
  run:
    dir: outputs/turn_aware/hydra/${now:%Y-%m-%d}/${now:%H-%M-%S}
  job:
    chdir: false
