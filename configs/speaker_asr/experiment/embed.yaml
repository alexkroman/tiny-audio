# @package _global_
# embed: the context recipe plus a speaker-embedding head, warm-started from
# the trained context checkpoint (the best long-form labeller) so labelling
# stays anchored while the head learns. Each decoded turn gets a vector from
# the decoder's hidden states (scripts/speaker_asr/embedding.py), trained with
# a within-meeting contrastive loss and distilled from ECAPA-TDNN on the turn's
# clean headset audio. Long-form linking clusters these vectors instead of
# running a separate embedding model over aligned audio.
#
# Extra eval: eval_embed/auc -- same vs different speaker, turn pairs from
# different windows of one meeting.
model:
  model_id: mazesmazes/tiny-audio-speaker-asr-qwen3-asr-context
context:
  enabled: true
embedding:
  enabled: true
  distill_weight: 1.0
pool:
  hub_repo: mazesmazes/speaker-asr-pool
data:
  pool_dir: data/speaker_asr
training:
  output_dir: outputs/speaker_asr/embed
  run_name: speaker-asr-qwen3-asr-0.6b-embed
  num_train_epochs: 1
  learning_rate: 1e-4
  # Context rows run to ~80 s of audio (as experiment/context).
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 4
hub_model_id: mazesmazes/tiny-audio-speaker-asr-qwen3-asr-embed
