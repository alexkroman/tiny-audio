# @package _global_
# short: retrain the labeller on what clustered long-form decoding feeds it --
# 3-8 s slices of the real meeting timeline cut at quiet points, targets from
# word-aligned utterances (scripts/speaker_asr/chunks.py). Warm-started from
# the context checkpoint (the best long-form labeller; decoding keeps its
# empty-memory <CONTINUE> prompt), with 15% of its context rows as rehearsal,
# speaker-token loss x3 and busy chunks oversampled.
#
# Extra eval: eval_short/* decodes held-out short validation chunks.
# Checkpoint choice: the clustered long-form validation harness, not window cpWER.
model:
  model_id: mazesmazes/tiny-audio-speaker-asr-qwen3-asr-context
context:
  enabled: true
short_chunks:
  enabled: true
pool:
  hub_repo: mazesmazes/speaker-asr-pool
data:
  pool_dir: data/speaker_asr
training:
  output_dir: outputs/speaker_asr/short
  run_name: speaker-asr-qwen3-asr-0.6b-short
  num_train_epochs: 1
  learning_rate: 1e-4
  # Rehearsal rows are context rows (~80 s of audio): batch 8 like experiment/context,
  # same effective batch of 32.
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 4
hub_model_id: mazesmazes/tiny-audio-speaker-asr-qwen3-asr-short
