# SPEAKER-ATTRIBUTED ASR on Qwen3-ASR-0.6B (diarization by decoding).
#
#   Qwen/Qwen3-ASR-0.6B-hf   audio tower + projector + Qwen3 decoder, all FROZEN
#   + LoRA on decoder attention + MLP        (lr 2e-4)
#   + trainable <SPK_1> .. <SPK_4> rows      (tied: embedding AND lm_head logit)
#
# The model transcribes a multi-speaker window and opens every speaker turn
# with a speaker token, numbered by order of first appearance:
#
#   <SPK_1>So what do we think about the remote?<SPK_2>I like the yellow one.<SPK_1>Yeah.
#
# One greedy decode yields "who spoke when, and what" for the window -- the
# serialized-output-training (SOT) target of Kanda et al. 2020, on a frozen
# ASR model. Labels are relative ("first voice", "second voice"), so no
# speaker inventory is needed and the metric is permutation-free (cpWER).
#
# Long recordings (experiment/context): the model is also trained to read a
# labelled CONTEXT PREFIX -- one voice sample per speaker heard so far plus
# the previous chunk's tail -- and keep those speakers' labels, so chunked
# decoding links speakers across an hour (scripts/speaker_asr/context.py,
# longform.py; `ta speaker-asr transcribe-long | evaluate-long`).
#
# Junction windows (experiment/junction) instead teach the labeller to VERIFY:
# utterances minutes apart in one window, same voice or not, so long-form
# decoding can link chunks by asking the model itself whether two clips share
# a speaker (scripts/speaker_asr/junction.py).
#
# A run is this file plus one preset from experiment/ (v1, tower, context, junction); the SAME
# overrides drive the data and the training, so they cannot drift:
#
#   poetry run ta speaker-asr build-pool +experiment=v1          # builds + pushes the pool
#   poetry run python -m scripts.speaker_asr.train +experiment=v1
#   ta runpod train-speaker-asr <host> <port> +experiment=v1    # pulls that pool, trains
#   poetry run ta speaker-asr evaluate -m outputs/speaker_asr/v1/final
#
# Standalone config tree, like configs/turn_aware/: scripts/train.py builds
# ASRModel, and Qwen3-ASR is not an encoder + fresh projector + LLM stack.
#
# WHY THIS SHAPE
#
# - AMI individual-headset (ihm) segments re-mixed on their REAL meeting
#   timeline. Each segment is one speaker's close-talk mic, so summing the
#   segments of a window reproduces the meeting's turn-taking, backchannels
#   and overlaps with clean per-speaker supervision -- what a mixed recording
#   cannot give without forced alignment. Long silences are squeezed to
#   pool.max_gap_s so a 30 s window holds conversation, not dead air.
#
# - Self-distilled transcripts (pool.target_text: self). AMI's references are
#   UPPERCASE without punctuation; training on them would teach the model to
#   stop casing and punctuating. Every utterance's text is instead the base
#   model's own transcript of that utterance alone, so the only new behaviour
#   the adapter learns is WHERE the speaker tokens go and WHICH one.
#   `eval_speakers/wer` against those targets reads transcription drift.
#
# - LoRA on decoder attention AND MLP (unlike turn-aware's attention-only).
#   Telling voices apart is a comparison across the whole audio, not one
#   binary decision at the tail; it needs more capacity than one marker. The
#   audio tower stays frozen in v1 -- the `tower` preset tests whether its
#   features carry enough speaker identity without adapting it.
#
# - weight_decay 0.0 for the same reason as turn-aware: decay on the trainable
#   token deltas pulls the speaker rows back to their mean-embedding init.

pool:
  # Transcripts in every target come from this BASE model (self-distillation).
  target_model: Qwen/Qwen3-ASR-0.6B-hf
  # self: target_model's transcript of each utterance; dataset: the `text` column.
  target_text: self
  # transcripts-{split}.jsonl, keyed by utterance id. null = data.pool_dir.
  transcript_cache: null
  # Public Hub dataset publishing built pools (manifests + transcripts, no audio):
  # build-pool pulls a split built with the same settings instead of
  # rebuilding, and pushes what it builds. Presets set it; null = local only.
  hub_repo: null
  seed: 0
  # Window length is drawn uniformly per window, so the pool spans quick
  # exchanges and long multi-turn stretches. Hard cap: Qwen3-ASR's 30 s.
  window_s: [8.0, 30.0]
  max_audio_s: 30.0
  # Silence before the first utterance and after the last.
  lead_s: [0.0, 0.5]
  tail_s: [0.0, 0.5]
  # Real gaps longer than this are shortened to it (seconds).
  max_gap_s: 1.5
  # Keep real overlaps (summed audio, first-in-first-out target order). false
  # pushes each utterance to start min_gap_s after the previous one ends.
  overlap: true
  min_gap_s: 0.1
  # A window closes before admitting a speaker beyond this many; also the
  # number of speaker tokens.
  max_speakers: 4
  # Utterances shorter than this (s) are left out of the audio AND the target:
  # AMI's "MM"/"YEAH" fragments of <0.2 s are mostly breath.
  min_utt_s: 0.2

model:
  model_id: Qwen/Qwen3-ASR-0.6B-hf
  dtype: bfloat16
  lora_rank: 32
  lora_alpha: 64
  lora_dropout: 0.05
  # Regex over module names. The audio tower also names its projections
  # q_proj/k_proj/..., so decoder-only patterns anchor on `language_model`.
  lora_target_modules: .*language_model.*\.(q_proj|k_proj|v_proj|o_proj|gate_proj|up_proj|down_proj)
  # Decode budget per window: ~100 words of fast speech in 30 s + markers.
  max_new_tokens: 320

data:
  dataset_id: edinburghcstr/ami
  # Parquet shards for one split ({split} is substituted).
  data_files: ihm/{split}-*.parquet
  # Column names in that dataset.
  columns:
    id: audio_id
    group: meeting_id
    speaker: speaker_id
    start: begin_time
    end: end_time
    text: text
  pool_dir: data/speaker_asr_dev
  train_split: train
  eval_split: validation
  # Teacher-forced eval/loss subset.
  eval_samples: 1000
  # Greedy-decoded subset for eval_speakers/* (cpWER, WER, speaker count).
  decode_eval_samples: 400

# Context prefixes (training rows + long-form decoding). Built from the pool
# at load time, so this section is NOT part of the pool signature: every
# preset shares one published pool. Fields mirror
# scripts/speaker_asr/context.py:ContextConfig, which documents them.
context:
  enabled: false
  # Speaker tokens to register: labels in a context prefix are numbered over
  # the whole recording so far, not just one window.
  max_speakers_total: 8
  memory_s: [2.0, 6.0]
  memory_gap_s: 0.4
  max_memory: 6
  carry_s: 8.0
  carry_prob: 0.8
  live_gap_s: 0.3
  max_audio_s: 90.0
  min_chunk_s: 10.0
  chunk_s: 25.0

# Junction windows (experiment/junction): whole utterances drawn minutes
# apart in one meeting, half continuing a speaker already in the window and
# half opening a new one, so the labeller learns to tell whether a voice was
# heard before -- the decision long-form linking asks it to make. Built from
# the utterance index at load time, so NOT part of the pool signature. Fields
# mirror scripts/speaker_asr/junction.py:JunctionConfig, which documents them.
junction:
  enabled: false
  ratio: 0.35
  clips: [2, 4]
  clip_s: [2.0, 6.0]
  gap_s: [0.3, 1.0]
  min_separation_s: 60.0
  same_prob: 0.5
  eval_rows: 200

# Speaker-embedding head (experiment/embed): one vector per decoded turn from
# the decoder's own hidden states, trained so a person's vector stays put
# across chunks (within-meeting contrastive loss) and, optionally, distilled
# from ECAPA-TDNN embeddings of the turn's clean headset audio. Long-form
# decoding then links chunks by clustering these vectors. Fields mirror
# scripts/speaker_asr/embedding.py:EmbeddingConfig, which documents them.
embedding:
  enabled: false
  dim: 256
  weight: 0.1
  temperature: 0.1
  distill_weight: 0.0
  meetings_per_batch: 2
  eval_rows: 200

# Short real-timeline chunks (experiment/short): meetings mixed at their real
# timeline and cut with the SAME quiet-point chunking clustered long-form decoding
# uses (3-8 s), targets from word-aligned utterances. Built once per split and
# cached in the pool dir (words-<split>.jsonl, short-<split>.parquet). Fields
# mirror scripts/speaker_asr/chunks.py:ShortChunkConfig, which documents them.
short_chunks:
  enabled: false
  min_s: [2.5, 3.5]
  max_s: [6.5, 9.0]
  edge_keep: 0.5
  min_aligned: 0.8
  rehearsal: 0.15
  speaker_loss_weight: 3.0
  busy_oversample: 2.0
  eval_rows: 400
  augment_prob: 0.3
  # Keep word-less chunks with an EMPTY target: a model never shown one hallucinates a
  # word into every quiet chunk (the first short run wrote "yeah" into ~1/4 of them).
  keep_empty: true
  # Segments shorter than this use AMI's human transcript (isolated short clips are
  # where self-transcription is wrong: "mm-hmm" -> "Yeah."). 0 = self-transcripts only.
  human_text_below_s: 1.0

# NOTSOFAR-1 far-field meetings as extra short chunks (needs short_chunks.enabled).
# Real room audio -- reverb, distance, crosstalk, real overlap -- and unscripted
# office meetings, where AMI rows are summed headset clips of mostly role-played
# design meetings. CC BY 4.0 (cite Vinnikov et al., Interspeech 2024); fields mirror
# scripts/speaker_asr/notsofar.py:NotsofarConfig.
notsofar:
  enabled: false
  repo_id: microsoft/NOTSOFAR
  # 72 meetings, 7.4 h, 4-8 speakers each; every single-channel device is a recording.
  train_version: train_set/240825.1_train
  # Held-out decode eval (eval_notsofar/*): speakers disjoint from train. null = none.
  # Never dev_set/240415.2_dev: Dev-set-2 is licensed for the challenge only.
  eval_version: eval_set/240629.1_eval_small_with_GT
  # Transcripts + sc_*/ch0.wav only (~4 GB for train), fetched on first use.
  local_dir: data/notsofar
  devices: sc_*
  eval_rows: 400

resume_from_checkpoint: null
# The MERGED final model is pushed here after training (null = keep local).
hub_model_id: null

training:
  output_dir: outputs/speaker_asr/dev
  seed: 0
  num_train_epochs: 2
  max_steps: -1
  per_device_train_batch_size: 16
  per_device_eval_batch_size: 16
  gradient_accumulation_steps: 2
  learning_rate: 2e-4
  lr_scheduler_type: cosine_with_min_lr
  lr_scheduler_kwargs:
    min_lr_rate: 0.05
  warmup_steps: 100
  weight_decay: 0.0
  max_grad_norm: 1.0
  bf16: true
  logging_steps: 20
  eval_strategy: steps
  eval_steps: 250
  save_strategy: steps
  save_steps: 250
  save_total_limit: 3
  dataloader_num_workers: 8
  report_to: wandb
  run_name: speaker-asr-dev

hydra:
  run:
    dir: outputs/speaker_asr/hydra/${now:%Y-%m-%d}/${now:%H-%M-%S}
  job:
    chdir: false
