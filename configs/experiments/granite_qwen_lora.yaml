# @package _global_
# CAPACITY REALLOCATION EXPERIMENT
#
#   ibm-granite/granite-speech-5.0-470m-turboctc  (FROZEN)
#     -> MLP projector (fresh init, 12.6M, lr 1e-3)
#     -> Qwen/Qwen3.5-2B, base weights FROZEN + LoRA all-linear r=64 (67.3M, lr 2e-4)
#
# Trainable drops 1.3859B -> 0.0799B (5.8%). Everything else is held at the
# granite_qwen values so the comparison is single-variable.
#
#   poetry run python scripts/train.py +experiments=granite_qwen_lora
#
# ---------------------------------------------------------------------------
# WHY: the decoder's 1.37B trainable params are not earning their WER.
#
# Measured by running the frozen encoder's OWN CTC head over the same 100
# samples/dataset with the same normalizer:
#
#   pooled, all 12 sets      CTC-only 7.56   full stack 7.00   decoder +0.56
#   pooled, minus TEDLIUM    CTC-only 7.29   full stack 7.62   decoder -0.33
#
# The encoder ALONE beats the full stack on 7 of 12 datasets. The decoder's
# entire net WER contribution is TEDLIUM (+6.18) and a little SPGISpeech
# (+1.22); it is negative on peoples (-3.52), ami-sdm (-1.76), ami (-1.06)
# and loquacious (-0.60).
#
# The decoder is NOT useless -- it is what produces formatting, which WER is
# blind to because the eval normalizer lowercases and strips punctuation from
# both sides. On the 270 cased+punctuated eval samples (scripts/eval/formatting.py):
#
#                       ours     universal-3-5-pro
#   orthographic WER    10.14          14.65
#   case error rate      1.43%          2.52%
#   punctuation F1      77.07          72.86
#
# A CTC head would score ~100% orthographic WER -- it emits neither. So the
# goal is to KEEP the decoder's formatting ability while paying far less for
# it, which is what LoRA over frozen base weights does.
#
# Precedent: nvidia/canary-qwen-2.5b reaches 4.43 on the Open ASR Leaderboard
# with a FROZEN Qwen3-1.7B + LoRA and a TRAINABLE encoder -- the inverse of
# this repo's allocation. Its config.json, read directly:
#   freeze_params: ['^llm\..+$', '^embed_tokens\..+$']
#   prevent_freeze_params: ['^.+\.lora_.+$']
#   lora: {r: 128, alpha: 256, target_modules: [q_proj, v_proj]}
# NOTE its leaderboard number is NOT comparable to ours: different protocol
# (cleaned dataset variants, unweighted macro-average, full test sets).
# ---------------------------------------------------------------------------

defaults:
  - override /data: multiasr

model:
  audio_model_id: ibm-granite/granite-speech-5.0-470m-turboctc
  text_model_id: Qwen/Qwen3.5-2B
  projector_type: mlp
  attn_implementation: sdpa
  projector_pool_stride: 1
  encoder_conv_layers: [[0, 2, 2], [0, 2, 2]]
  projector_hidden_dim: 4096
  # CAVEAT, measured rather than assumed. Two separate claims live behind this
  # one word, and only the first holds:
  #
  #   1. The auto-resolved TARGET is correct. It logs 0.015010; the actual RMS
  #      of Qwen3.5-2B's embed_tokens table [248320, 2048], computed in float64
  #      from the safetensors, is 0.015008. Not garbage.
  #   2. The MECHANISM does not hold that target through training. `output_scale`
  #      is a fixed, non-learnable buffer (0.076075 in the shipped checkpoint),
  #      so it pins the output to 1.0x embed RMS AT INIT ONLY. The projector's
  #      weights then grow -- ||linear_1|| 157.5, ||linear_2|| 186.5 -- and the
  #      output drifts with them. Probing the trained checkpoint at the repo's
  #      own geometry: output RMS 0.8350, i.e. **55.6x embed RMS** against a
  #      design target of 1.0x. An independent probe using the repo's
  #      measure_output_rms() got 48.6x; different probe, same conclusion.
  #
  # So the audio prefix ends the run ~4x HOTTER than the 13.1x that motivated
  # adding output_scale in the first place (1/0.076075 = 13.1x, which this
  # measurement also confirms). Corroborating weight evidence from the
  # completed run: MLP drift and post_attention_layernorm drift are both
  # sharply front-loaded (layers 0-2 at ~20-21% MLP and 8.2%/6.1% norm, against
  # 14.8-17.4% and 0.5-0.7% at layers 20-23), which is what the first few
  # decoder layers renormalising a hot prefix looks like.
  #
  # Left as `auto` for this run anyway, deliberately:
  #   - It is not a regression. The same drift happened under the previous
  #     recipe, so keeping it holds the comparison single-variable.
  #   - The fix is not obvious. A trailing weightless RMSNorm times the fixed
  #     scale would pin it every forward (Gemma3n does exactly this in
  #     Gemma3nMultimodalEmbedder), but the author built `_maybe_probe_scale_
  #     gradient` precisely to test whether the loss WANTS the hot scale, and
  #     its sign is wandb-only. Check `scale_grad` before "fixing" this.
  #   - Note this run frets less about it than the last one: the decoder base
  #     is frozen, so the compensation that layers 0-2 were doing now has to
  #     come from LoRA instead. If the hot prefix is genuinely costly, this run
  #     is where it shows up most clearly.
  projector_output_rms: auto
  transcribe_prompt: "Transcribe the speech with proper punctuation and capitalization"
  label_smoothing: 0.0
  max_new_tokens: 256

  # bfloat16, NOT the fp32 master weights granite_qwen needs. That requirement
  # came from decoder_learning_rate=2e-5: Adam's step at 2e-5 on weights of
  # ~0.015-0.02 is ~1e-3 relative, below bfloat16's 2^-8 = 3.9e-3 ULP, so
  # every decoder update would round to zero. LoRA removes the problem from
  # both directions -- the B matrix starts at zero (so updates are large
  # relative to the weight, not to a pretrained magnitude) and the LR is 10x
  # higher. The projector stays fp32 regardless; it is the one module that
  # must not lose precision.
  #
  # This is most of why the run is cheap: no fp32 master copy of a 1.88B
  # decoder, and optimizer state over 80M params instead of 1.386B.
  model_dtype: bfloat16
  projector_dtype: float32
  # REQUIRED by encoder_trainable_top_layers > 0 below, not a preference.
  # Granite's weights have RMS 0.0868, where one bfloat16 ULP is 4.88e-4;
  # Adam's step at encoder_learning_rate=1e-5 is ~1e-5, i.e. 49x below a single
  # ULP, so every encoder update would round to zero and the unfreeze would be
  # a silent no-op paying full optimizer state. fp32 for the whole 472.9M
  # encoder costs +0.95 GB over bfloat16; the decoder stays bfloat16.
  encoder_dtype: float32

  use_lora: true
  # r=64 with alpha=128 (scale 2.0). Canary-Qwen uses r=128/alpha=256 on a
  # much narrower target set; spreading over all-linear at r=64 lands at a
  # comparable parameter budget with broader coverage.
  lora_rank: 64
  lora_alpha: 128
  lora_dropout: 0.0

  # "all-linear" rather than a hand-written list, and NOT Canary-Qwen's
  # [q_proj, v_proj]. Two independent reasons:
  #
  # 1. Qwen3.5 is HYBRID. Only 6 of its 24 layers are full_attention; the
  #    other 18 are linear-attention (gated delta-net) with entirely
  #    different projection names. Copying [q_proj, v_proj] verbatim adapts
  #    12 matrices in 6 layers and leaves 18 layers completely frozen --
  #    measured: 3.34M trainable, 0.18% of the decoder.
  #
  # 2. More importantly, q/v is the WRONG PLACE even on a dense model. Drift
  #    of the completed granite_qwen run vs base Qwen3.5-2B, by projection:
  #      mlp.down_proj        24 matrices   19.30%   <- largest
  #      mlp.up_proj          24            18.39%
  #      linear_attn.in_proj_b 18           18.07%
  #      self_attn.k_proj      6            16.23%
  #      mlp.gate_proj        24            15.01%
  #      linear_attn.out_proj 18            14.45%
  #      self_attn.q_proj      6            13.62%   <- NVIDIA's target
  #      self_attn.v_proj      6            10.12%   <- NVIDIA's target
  #      ALL decoder weights 319            13.31%
  #    The MLP is both the largest adaptation site and ~906M of the 1.37B
  #    trainable params. q/v sit near the bottom of the major projections.
  #
  # Verified against peft 0.20.0 on the real checkpoint: "all-linear" resolves
  # to 186 matrices covering mlp.{gate,up,down}_proj (24 each),
  # linear_attn.{in_proj_a,in_proj_b,in_proj_qkv,in_proj_z,out_proj} (18 each)
  # and self_attn.{q,k,v,o}_proj (6 each) = 67.28M trainable, 3.58% of base,
  # and it correctly does NOT adapt lm_head (which matters -- lm_head is tied
  # to the frozen embed_tokens).
  lora_target_modules: all-linear

training:
  hub_model_id: "mazesmazes/tiny-audio-granite-qwen-lora"

  # Base decoder weights frozen; only the LoRA tensors take gradients. This is
  # the same shape as Canary-Qwen's freeze_params + prevent_freeze_params pair.
  freeze_language_model: true
  freeze_projector: false
  freeze_text_embed_tokens: true

  # ENCODER STAYS FROZEN FOR THIS RUN -- deliberately, and this is the main
  # open decision in the experiment.
  #
  # The substitution-dominated error profile (pooled S 3.30 / D 2.12 / I 1.57
  # against the baseline's 3.17 / 2.70 / 1.90 -- we win on coverage and lose
  # on word choice) points at acoustic discrimination, i.e. the encoder. And
  # the CTC control shows the encoder alone already beats the full stack on
  # 7/12 sets. So unfreezing its top blocks is the intervention most likely to
  # IMPROVE WER, not merely to make the run cheaper.
  #
  # It is held back anyway, for three reasons:
  #   - Attribution. The baseline is 7.00 with a full-FT decoder. Change the
  #     decoder's trainable surface AND the encoder's in one run and a WER
  #     delta cannot be assigned to either.
  #   - Sequencing. If LoRA at 67M matches full-FT at 1.37B, the decoder
  #     capacity was genuinely unnecessary and the freed budget is available
  #     for the encoder against a clean, directly comparable baseline. If it
  #     does NOT match, the decoder capacity was load-bearing -- which
  #     contradicts the CTC reading and is worth knowing BEFORE spending on an
  #     encoder unfreeze.
  #   - Risk asymmetry. Unfreezing 88-198M encoder params on ~7.6k hours risks
  #     damaging a model IBM trained on ~60k hours. Verified budgets on the
  #     real encoder: top 2 -> 88.45M (18.7%), top 4 -> 143.33M (30.3%),
  #     top 6 -> 198.21M (41.9%), each including `out`/`out_mid` and never
  #     `input_linear`.
  #
  # FULL ENCODER. All 16 blocks plus input_linear and out/out_mid -- 472.9M,
  # not a top-N slice.
  #
  # This replaces an earlier top-4 selection (143.33M, then 109.76M with
  # out/out_mid suppressed) that was chosen from a per-block gradient profile
  # measured on LibriSpeech-clean. Two things overturned it:
  #
  #   1. PRECEDENT. Neither of the two closest published recipes does a
  #      partial encoder unfreeze. fixie-ai/ultravox-v0_5-llama-3_2-1b ships
  #      audio_tower + projector and NO language_model at all -- its LLM loads
  #      unmodified from meta-llama/Llama-3.2-1B-Instruct. nvidia/
  #      canary-qwen-2.5b freezes only ['^llm\..+$', '^embed_tokens\..+$'].
  #      Both train the whole encoder.
  #
  #   2. THE PROFILE POINTED THE WRONG WAY. Ultravox's encoder drift against
  #      openai/whisper-large-v3-turbo is 14.74% overall, and it peaks in the
  #      MIDDLE of the stack -- layer 12 at 49.4%, layers 8-16 all above 44%,
  #      against 28-38% at the top. A top-N selection would have frozen
  #      exactly the region that moved most. Our own profile rose toward the
  #      top, but that was an instantaneous gradient on the easiest dataset in
  #      the suite; Ultravox's is the endpoint of a completed run.
  #
  # `encoder_trainable_top_layers` and `encoder_trainable_post_projections`
  # are both inert while freeze_audio_encoder is false -- those fields only
  # ever re-enable layers the freeze path turned off. Left unset rather than
  # set to misleading values.
  #
  # NOTE this puts the encoder into TRAIN mode during training (see
  # _apply_train_mode), so Granite's 16 BatchNorm1d modules now use batch
  # statistics and update their running stats -- unlike the partial-unfreeze
  # path, which kept them frozen. That is handled: save_pretrained serializes
  # the full encoder state_dict including those buffers when it is fully
  # unfrozen (verified: 550 tensors, 48 of them BN buffers), so they
  # round-trip. Inference still needs model.eval(), which LocalEvaluator now
  # calls explicitly.
  freeze_audio_encoder: false
  # 1e-4, matching granite_qwen_encoder.yaml exactly. Holding the encoder
  # settings identical across the two files is the point: they are meant to
  # isolate ONE variable -- LoRA decoder here vs fully frozen decoder there --
  # and a different encoder LR would confound that.
  #
  # Raised from the 1e-5 the top-4 selection used, which was deliberately
  # conservative for a cautious partial unfreeze. Sized against the target:
  # 0.357% drift measured at 2,000 steps with lr 1e-5 on 4 blocks, scaled 10x
  # in LR and 15x in steps, gives ~14% under a diffusive walk -- Ultravox's
  # measured 14.74% endpoint. Check the drift at the 2k checkpoint: ~3.6% is
  # on track, materially above ~6% means the walk is linear rather than
  # diffusive and this should drop to 3e-5.
  encoder_learning_rate: 1e-4

  # Projector unchanged at 1e-3 (fresh init, same job as before). LoRA lowered
  # from 2e-4 to 1e-4 -- the measurement this comment used to ask for has now
  # been taken.
  #
  # ||dW||/||W|| of the adapter at step 2,000 (6.7% of the schedule), including
  # peft's alpha/r = 2.0 scaling, against the completed full-FT run's drift:
  #
  #                  LoRA @2k (6.7%)   full-FT @32.9k (100%)
  #   in_proj_b           35.86%              18.07%
  #   k_proj              23.55%              16.23%
  #   up_proj             22.40%              18.39%
  #   gate_proj           21.60%              15.01%
  #   q_proj              21.31%              13.62%
  #   down_proj           19.73%              19.30%
  #   ALL adapted         19.58%              13.31% (all 319 matrices)
  #
  # At 6.7% of training LoRA had already perturbed the decoder 1.47x more than
  # the full fine-tune managed over an ENTIRE run, and on every matched module
  # without exception -- with B initialised at zero, so still climbing. That
  # contradicts the premise of this file: the point is to keep the decoder's
  # formatting ability while paying less for it, and a perturbation larger than
  # full-FT's is not the gentler intervention the parameter count suggests.
  # Trainable params and perturbation size are independent knobs; cutting
  # params 17x while raising the LR 10x moved them in opposite directions.
  #
  # 1e-4 is still inside the standard 1e-4..3e-4 LoRA band, at the low end
  # where a preservation experiment belongs. Watch the ratio again at 2k: the
  # target is to land near full-FT's 13.31% by the END of the run, not at 7%.
  # Note in_proj_b is the worst offender and is the delta-net GATE, whose dW is
  # rank-capped at 16 by its (16, 2048) shape -- the most destabilising place
  # to put a large relative change.
  # Must be set HERE, not only under `model:`. attn_implementation is the
  # first entry in scripts/train.py's TRAINING_MODEL_PARAMS, and that merge
  # copies every one of those names from `training:` over `model:`. With only
  # the `model:` line, production.yaml's flash_attention_2 silently won and
  # this experiment's sdpa choice never reached ASRConfig -- the same way it
  # was overridden for the whole granite_qwen run. train.py now warns when the
  # two disagree; keep them in sync.
  #
  # sdpa is still right on an A100: at T~320 the QK^T + AV work FA2 optimizes
  # is a low single-digit fraction of decoder FLOPs (18 of 24 Qwen3.5 layers
  # are linear_attention and never touch it), and it drops the flash-attn
  # source build from the critical path.
  attn_implementation: sdpa

  learning_rate: 1e-3
  decoder_learning_rate: 1e-4

  label_smoothing_factor: 0.0
  weight_decay: 0.01
  # Restored to granite_qwen's 0.01 from the 0.0 this file shipped with. The
  # projector is the ONLY group where decoupled AdamW's decay does measurable
  # work -- it shrinks by exp(-steps * lr * mean_lr_factor * wd), which over
  # this schedule is 15.9% at lr 1e-3 against 0.34% for the decoder at 2e-5.
  #
  # The reason to want that brake is now measured rather than assumed. Probing
  # the step-2000 checkpoint on real audio with a scalar knob `c` on the
  # projector output:
  #
  #   dL/d(log c) at c=1, per batch:
  #     +0.0278 +0.0057 +0.0262 -0.0188 +0.0052 -0.0430
  #     mean +0.0005, sd 0.0273, |t| = 0.05
  #
  # i.e. the loss is statistically indifferent to the audio prefix's scale.
  # A line search agrees: loss is 0.2394 / 0.2350 / 0.2622 at 3.81x / 7.62x /
  # 15.24x embed RMS -- a flat basin roughly 2x-8x wide, turning sharply bad
  # outside it (0.4756 at 30.5x).
  #
  # Zero gradient plus a flat basin means the output scale is a locally FREE
  # parameter with no restoring force, which is exactly the condition under
  # which Adam's weight-norm growth wanders: the per-parameter step is ~lr
  # regardless of gradient, so linear_2 grows and drags the scale along. That
  # is the 1x -> 48x drift the previous run logged, and it is a random walk up
  # a flat valley floor rather than the loss expressing a preference. Weight
  # decay is the only force opposing it, and since the loss is indifferent it
  # costs nothing in loss terms.
  #
  # NOT a reason to pin the scale directly (a trailing weightless RMSNorm, as
  # Gemma3nMultimodalEmbedder does). The same line search shows reverting to
  # the 1.0x design target costs +0.0468 loss, ~20% relative, because the
  # weights co-adapt to whatever scale they grew into. Control linear_2's norm
  # growth, do not clamp its output.
  projector_weight_decay: 0.01
  warmup_steps: 700
  lr_scheduler_type: cosine_with_min_lr
  lr_scheduler_kwargs:
    min_lr_rate: 0.05
  max_grad_norm: 2.5
  seed: 44

  auto_find_batch_size: false
  # 48 x 2 = 96. Same EFFECTIVE batch as granite_qwen, so the projector LR
  # transfers unchanged and the comparison holds -- but the per-device batch
  # is maximised for the card instead of inherited from a recipe that had to
  # carry fp32 master weights and 1.386B of optimizer state.
  #
  # 48 is the largest divisor of 96 that fits. Sized for an A100 80GB
  # (79.15 GiB usable) with the calibrated estimator in scripts/deploy/plan.py:
  #   32 x 3   42.17 GiB   53%
  #   48 x 2   60.10 GiB   76%   <- here
  #   96 x 1  ~113    GiB   over the card (activations are ~1.12 GiB/sample)
  #
  # 76% is not the edge, and the benchmark for that claim is empirical rather
  # than a safety factor: granite_qwen itself ran 32 x 3 at ~65 GiB, 82% of an
  # 80 GB card, for all 32,922 steps without OOM. This recipe asks for LESS
  # than that run already survived on the same amount of VRAM. Note the
  # planner's "recommended (x1.25)" line is margin stacked on top of an
  # activation term that is already calibrated to a measured peak (nvidia-smi
  # reserved, i.e. a high-water mark including allocator caching) -- reading
  # that 75 GiB figure as the requirement double-counts conservatism.
  #
  # The win is throughput, not capacity: a third fewer micro-batches per
  # optimizer step and larger GEMMs, which matters on an A100 (~1935 GB/s
  # against an H100 SXM's ~3350) where this run is bandwidth-bound and already
  # looking at ~4.5-5 days.
  #
  # Padding does not degrade at 48. granite_qwen.yaml's analysis applies: the
  # collator pads each batch to its own longest row within an [0.8s, 19s]
  # window, and multiasr puts enough mass near the ceiling that most 32-row
  # batches already contain a near-ceiling row -- so E[max duration] is
  # already saturated and per-sample cost stays flat rather than creeping up.
  # 32 x 3 = 96, NOT the 48 x 2 this file shipped with. 48 OOMed on an 80 GB
  # card: the process reached 79.16 GiB of 79.25 and died asking for 190 MiB.
  #
  # The cause was an activation term nobody was counting. While the encoder is
  # frozen ASRModel.forward runs it under no_grad and retains nothing; unfreeze
  # it and 16 conformer blocks at ~237 frames x 1024 dims keep their full tape.
  # Backing it out of the observed peak: 79.4 GiB needed - 12.5 static = ~66.9
  # GiB of activations at batch 48, i.e. ~1.39 GiB/sample against the ~1.12
  # the frozen-encoder recipe measured. scripts/deploy/plan.py models this now
  # (it reported 61.78 GiB for the frozen version and reports 83.88 here).
  #
  # Scaling the measured peak: 32 -> ~57 GiB (72%), 24 -> ~46 GiB (58%).
  # 32 keeps the effective batch at 96 with one extra micro-step and lands at
  # the utilization granite_qwen already survived a full run at (82%). Drop to
  # 24 x 4 if it OOMs again; gradient_checkpointing: true is the other lever
  # and now reaches the encoder too, at ~30% wall-clock.
  per_device_train_batch_size: 32
  # Tracks the train batch. Eval runs under prediction_loss_only and therefore
  # no_grad, so no activation tape is retained and memory is ~static plus one
  # layer; 48 is comfortable either way, and with ASRModel.forward now passing
  # skip_logits on eval the (B,T,248320) logits never materialise.
  per_device_eval_batch_size: 32
  gradient_accumulation_steps: 3

  # ONE epoch, matching granite_qwen, so this is a like-for-like comparison.
  #
  # The weight analysis says the previous run was mildly under-trained:
  # eval-best landed at step 32,000 of 32,922 (97.2% through), the 12-dataset
  # mean WER was still falling (8.997 -> 8.973 -> 8.868), and the train/eval
  # gap was dead flat at 0.189 +/- 0.004 across all 17 evals, i.e. zero
  # overfitting. So 2-3 epochs is very likely the right call -- and it is now
  # affordable. But changing epochs AND the capacity allocation in the same
  # run is the same attribution mistake as unfreezing the encoder here. Get
  # the single-variable number first.
  num_train_epochs: 1
  save_steps: 2000
  eval_steps: 2000

  dataloader_num_workers: 16
  dataloader_prefetch_factor: 8
  torch_compile: false

  # SUCCESS CRITERIA, written down in advance so the result is not
  # rationalised after the fact:
  #   PASS  corpus WER within ~0.3 of granite_qwen's 7.00 AND orthographic WER
  #         within ~0.5 of 10.14. Decoder capacity was not load-bearing; spend
  #         the freed budget on epochs and the encoder unfreeze.
  #   FAIL  WER regresses >1.0, or orthographic WER regresses >1.5. The
  #         decoder's full-FT capacity WAS doing work -- most likely on
  #         formatting, which plain WER cannot see. Re-check per-dataset
  #         before concluding; TEDLIUM is where the decoder demonstrably earns
  #         its keep (+6.18 over the CTC head) and is the first place a
  #         capacity loss should show.
  # Either way, re-run the frozen-encoder CTC baseline (7.56 pooled) as the
  # floor: a stack that does not clearly beat it is not earning its params.
