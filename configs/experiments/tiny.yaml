# @package _global_
# The free run: a scaled-down version of the default recipe that learns to
# transcribe on a laptop.
#
#   poetry run ta train asr -e tiny
#
# It trains on LibriSpeech dev-clean (2,703 clips, 5.4 hours, a ~340 MB
# download) instead of the ten-corpus mix. Watch the loss: it sits near 4
# while the projector is still noise to the decoder, then drops below 1
# somewhere around step 400-650 as the decoder starts reading the audio.
# Measured on an M4 Max: ~30 minutes, 16% WER on 100 unseen test-clean clips.
#
# The model is the published recipe at laptop size: the Granite Speech 470M
# encoder, its projector settings and the default LoRA setup, with
# Qwen3.5-0.8B, the smallest Qwen3.5, as the decoder. The default recipe
# moved to Qwen3-ASR-1.7B's encoder + SmolLM3-3B on 2026-10-20; this preset
# keeps the encoder the numbers above were measured with.
#
# Peak GPU memory is 8-10 GB, so it fits a 16 GB Mac. Runs on Apple Silicon,
# a CUDA GPU (including a free Colab T4), or slowly on CPU. The trained
# checkpoint lands in outputs/tiny/:
#
#   poetry run ta eval -m outputs/tiny --local-code -d librispeech -n 20

---
defaults:
  - override /data: librispeech_dev

model:
  audio_model_id: ibm-granite/granite-speech-5.0-470m-turboctc-nc
  # Granite's ~M/4 conv subsampling, not Whisper's ~M/2: the collator sizes
  # the <audio> placeholders from this, and a mismatch with what the
  # projector emits fails _assert_audio_token_counts at step 0.
  encoder_conv_layers: [[0, 2, 2], [0, 2, 2]]
  # Granite already emits 12.5 Hz; its top layers were CTC-trained there.
  projector_pool_stride: 1
  text_model_id: Qwen/Qwen3.5-0.8B
  # LoRA on a frozen decoder, pinned here since the default recipe moved to
  # a full fine-tune (2026-10-21): fully fine-tuning 0.8B does not fit the
  # 8-10 GB this preset was measured at.
  use_lora: true
  # bf16 storage is right for a frozen, LoRA-adapted decoder (the default's
  # float32 is for its full fine-tune) and keeps this preset in its budget.
  model_dtype: bfloat16
  # Trained on the collator's default 19 s clips (librispeech_dev sets no
  # max_audio_seconds), so it keeps the matching 18 s inference chunks rather
  # than the default recipe's 28.
  inference_chunk_seconds: 18.0

data:
  num_proc: 1

training:
  # The LoRA recipe's freeze policy and LR (the default is a full fine-tune).
  freeze_language_model: true
  freeze_text_embed_tokens: true
  decoder_learning_rate: 1e-4
  weight_decay: 0.0
  # 3,200 clips, ~1.2 passes over dev-clean. 73 clips (librispeech_dummy)
  # is too few: the LoRA'd decoder memorizes the sentences and ignores the
  # audio, reaching near-zero loss and >100% WER on unseen speech.
  max_steps: 800
  warmup_steps: 80
  # Effective batch 4. Batch 4 in one pass peaks above 10 GB on 19 s clips.
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 2
  per_device_eval_batch_size: 2
  logging_steps: 10

  # Portable settings. The production config assumes a recent NVIDIA card:
  # fused AdamW and tf32 are CUDA-only, and bf16 autocast refuses to start
  # on a T4. The frozen weights are still stored in bf16; only autocast is off.
  optim: adamw_torch
  bf16: false
  tf32: false
  dataloader_num_workers: 0
  dataloader_persistent_workers: false
  dataloader_prefetch_factor: null
  dataloader_pin_memory: false
  # liger is linux-only. Without its fused cross-entropy, ASRModel.forward
  # projects only the transcript positions through lm_head, which keeps the
  # logits tensor small.
  allow_unfused_ce: true

  # Nothing leaves the machine: no W&B, no Hub, no mid-run checkpoints.
  report_to: "none"
  eval_strategy: "no"
  save_strategy: "no"
  push_to_hub: false
  output_dir: ${hydra:runtime.cwd}/outputs/tiny
