# @package _global_
# granite_qwen_frozen on the CURRENT multiasr mix, back on the 2B decoder.
#
#   poetry run python scripts/train.py +experiments=granite_qwen_frozen_2b
#
# Inherits everything from granite_qwen_frozen.yaml and reverts only what #90
# changed for the 4B decoder. This is the data A/B frozen-2 was meant to be
# (its CV/GS uncap never reached the pod): same recipe as y1tulo4j
# (mazesmazes/tiny-audio-granite-qwen-frozen), new data:
#
#   y1tulo4j (frozen)            this file
#   ~2.68M rows, Big-3 @ 600K    ~3.68M rows, all uncapped
#   no Peoples                   Peoples clean_sa (~311K)
#
# Sized for one A100 80GB. frozen-3 (4B, same new mix) beat frozen but not
# by enough to pay for 2x the decoder. If this run lands near frozen-3, the
# gain was the data. ~3.68M rows at batch 64 is ~57.5k steps, ~1.3x frozen's.
#
# Two non-data differences from y1tulo4j are unavoidable on current code:
# #87 removed the projector output-scale calibration (eval CE +0.0056 on an
# otherwise identical run), and the inference prompt is now pinned
# (inherited). Neither is a training-mix change.
#
# WATCH: AMI / ami-sdm. Read speech is 67.5% of the mix (LibriHeavy uncap adds
# ~285K audiobook rows) and AMI fell 5.5% -> 4.0%; every earlier read-speech
# increase regressed them. If they slip, re-capping LibriHeavy at 600K is the
# first thing to undo.

defaults:
  - granite_qwen_frozen

model:
  text_model_id: Qwen/Qwen3.5-2B

training:
  hub_model_id: "mazesmazes/tiny-audio-granite-qwen-frozen-4"

  # Sized for an A100 80GB: 64 x 1, exactly y1tulo4j's shape, so lr 1e-3 /
  # 1e-4 and clip 1.0 mean what they meant there. Measured on this stack, not
  # planned: es1p5srq (2B, batch 64, A100 80GB) peaked at 76.4 GiB of 80.0
  # (95.5%, median 68.6). The mix change does not move that peak: batches pad
  # to their longest row and a random 64-row draw nearly always contains one
  # near the collator's 19.0s cap, so peak memory is batch x 19s either way.
  #
  # Do NOT reuse this on an H100. It reports ~79.6 GiB, which puts the same
  # peak at 96%, and the seeded data order means an OOM replays on resume.
  # Use 32 x 2 there (same effective batch, throughput cost only).
  per_device_train_batch_size: 64
  per_device_eval_batch_size: 64
  gradient_accumulation_steps: 1
