# @package _global_
# FROZEN ENCODER + PROJECTOR + LoRA, one epoch.
#
#   ibm-granite/granite-speech-5.0-470m-turboctc   FULLY FROZEN (0 trainable)
#   -> MLP projector (fresh init, 14.7M, lr 1e-3)
#   -> Qwen/Qwen3.5-4B, base FROZEN + LoRA all-linear r=64 (129.9M, lr 1e-4)
#
# Trainable: 144.5M of 4.82B (3.0%). Sized for one H100 80GB (see the batch
# size note under `training`).
#
#   poetry run python scripts/train.py +experiments=granite_qwen_frozen
#
# ---------------------------------------------------------------------------
# WHY THIS FILE EXISTS
#
# There is no completed frozen-encoder run on this architecture, and as of
# 2026-09-20 there is no way to infer one. Two things forced it:
#
# 1. THE TOP-4 ENCODER NEVER LEARNED. Drift of blocks 12-15 ran 0.366% ->
#    0.954% over 2k->20k steps and gained 0.012pp in the last 2,000 (measured
#    again today directly against the base IBM weights: 0.9959%). Successive
#    4,000-step displacement vectors are orthogonal -- cos(seg, prev) fell
#    0.118 -> 0.004 -- and net displacement is 0.48x the path travelled,
#    against 1/sqrt(5)=0.447 for a pure random walk. Growth over a 10x step
#    increase was 2.61x where free diffusion predicts sqrt(10)=3.16x, i.e.
#    SUB-diffusive: a restoring force. That force is decoupled AdamW's decay,
#    lr*wd = 1e-5 * 0.01 = 1e-7/step, ~0.2% pull toward the origin over 20k
#    steps against 0.95% of observed displacement. The encoder random-walked
#    to its weight-decay equilibrium radius and stopped. For reference,
#    Ultravox's comparable top-4 slice moved 31.8% -- 33x further.
#
# 2. YOU CANNOT REMOVE IT AFTER THE FACT. Inference ablation on the shipped
#    top4 checkpoint (n=100, paired rows, model verified bit-deterministic
#    across processes), reverting blocks 12-15 to the base IBM weights and
#    changing nothing else:
#
#                        full      base encoder
#      peoples          21.09          34.82
#      ami-sdm          20.39          36.16
#
#    A 0.996% weight change costs 14-16 WER points. That is NOT evidence the
#    encoder training learned something useful -- the drift statistics above
#    say it learned nothing directional. It is evidence of CO-ADAPTATION: the
#    freshly-initialised projector and the LoRA adapters trained against that
#    specific random endpoint and cannot read the base encoder's output.
#    (Same asymmetry, larger, for the adapters: disabling LoRA on the same
#    rows gave peoples 160.83 / ami-sdm 378.87.)
#
# So the frozen-encoder baseline cannot be recovered by ablation and has to be
# TRAINED. That is this file. It is the control every other recipe in this
# repo has been implicitly compared against without ever being run.
#
# What a result here means:
#   - Within noise of top4  -> the encoder unfreeze was never doing work, and
#     the 109.76M params + fp32 master weights it cost are free to reclaim.
#   - Clearly worse         -> the unfreeze mattered after all, by a mechanism
#     the drift statistics do not capture, and granite_qwen_full_encoder
#     becomes the priority.
#   - Clearly better        -> the random walk was actively corrosive, which
#     is the expected sign of displacing a converged pretrained encoder in a
#     direction with no gradient signal.
#
# ONE EPOCH, and where the extra training comes from. Every run on this stack
# that got far enough to say anything ended with eval/loss still descending:
# granite_qwen reached eval-best at step 32,000 of 32,922 (97.2% through)
# with the 12-set mean still falling 8.997 -> 8.973 -> 8.868, and the long
# top4 run (jscyrgkt) was still falling when it stopped at 20,000 of
# ~27,400. Nobody has observed the end of a training curve here.
#
# This file used to answer that with a second pass over the data. It now
# stays at ONE pass (data.epoch_expansion: 1, num_train_epochs: 1) and takes
# the extra optimisation from the same pass instead: gradient accumulation
# drops 2 -> 1, so the identical set of forward/backward passes yields ~2x
# the optimizer steps (~44.6k against top4's ~27.4k) at identical GPU cost.
# See `gradient_accumulation_steps` for the argument and its failure mode.
# A second pass is still one line away if this run also ends mid-descent:
# `data.epoch_expansion: 2`, documented at that key.
# ---------------------------------------------------------------------------

defaults:
  - override /data: multiasr

data:
  # ONE physical pass, exactly the rows the mix table in multiasr.yaml
  # describes (~2.85M loader rows, ~2.68M after the collator's drops).
  #
  # Set to 2 for a second pass. It is the right way to get one -- NOT
  # `num_train_epochs: 2`: _resample_to_target runs once inside
  # DatasetLoader.load(), so a Trainer epoch replays the identical 600K
  # subsets while ~285K eligible LibriHeavy rows and ~338K CommonVoice rows
  # are never touched. With expansion=2 each capped source targets 1.2M,
  # draws every eligible row first and repeat-pads only the shortfall;
  # uncapped sources are repeated 2x, as a second epoch would have. Per-step
  # mix share is unchanged. The loader raises if both are set.
  epoch_expansion: 1

model:
  audio_model_id: ibm-granite/granite-speech-5.0-470m-turboctc

  # Everything from here to `encoder_dtype` was previously UNSET and silently
  # inherited from configs/config.yaml -- which is the GLM-ASR + Qwen3-0.6B
  # recipe, not this one. Hydra experiments inherit from config.yaml only,
  # never from a sibling experiment, so "same as granite_qwen_lora" has to be
  # written out. Same failure class as the three step-0 bugs in f001a061.
  #
  # What the inherited defaults actually did:
  #   text_model_id         Qwen3-0.6B, not the Qwen3.5-2B this recipe is
  #                         built around and measures dW against (line 122)
  #   encoder_conv_layers   Whisper's [(1,3,1),(1,3,2)] (~M/2) instead of
  #                         Granite's ~M/4, so the collator wrote 2x the
  #                         <audio> placeholders the projector emits and
  #                         _assert_audio_token_counts raised at step 0
  #   projector_pool_stride 4, on top of Granite's own 4x conv subsampling
  #   projector_hidden_dim  1024 instead of 4096
  #   model_dtype           float32 instead of bfloat16
  #
  # Values copied from granite_qwen_lora (closest recipe: same encoder, same
  # LoRA-on-frozen-decoder shape). The deliberate divergences from it --
  # encoder_dtype, lora_rank, lora_alpha -- are documented at their own keys.
  text_model_id: Qwen/Qwen3.5-4B
  projector_type: mlp
  projector_pool_stride: 1
  encoder_conv_layers: [[0, 2, 2], [0, 2, 2]]
  projector_hidden_dim: 4096
  model_dtype: bfloat16
  projector_dtype: float32

  # PROJECTOR, surveyed against transformers 5.17 (2026-09-21) and left
  # alone. The shape here -- RMSNorm(in) -> Linear(1024, 4096) -> GELU ->
  # Linear(4096, 2048) with biases, a fixed output scale, no dropout, no
  # trailing norm -- is the tree's majority design: GLM-ASR is exactly
  # Linear(enc, 2*llm) -> GELU -> Linear(2*llm, llm); Voxtral, AudioFlamingo3
  # and Qwen3-ASR are two-layer GELU MLPs; Qwen2-Audio and Canary-Qwen use a
  # single linear; Granite Speech uses a 2-layer Q-Former and Fun-ASR-Nano a
  # 2-layer Transformer adaptor, both heavier with no evidence they buy WER
  # on a frozen LLM. Nothing in the tree puts dropout in the projector.
  #
  # Frame rate stays at Granite's native 12.5 Hz (`projector_pool_stride: 1`,
  # ~237 tokens for a 19s clip). That is Canary-Qwen's rate (80 ms) and
  # Phi-4-MM's (8x on 100 Hz); Ultravox goes to 6.25 Hz. Stride 2 would
  # halve the decoder's audio tokens and cut per-step decoder cost by
  # roughly a third, but Granite's top layers were CTC-trained at 12.5 Hz so
  # a frame is already ~one BPE unit; merging pairs is a quality bet, not an
  # efficiency freebie, and it would make the top4 comparison unreadable.
  # It is the next efficiency experiment after this one, not part of it.

  # Two more keys the sweep above missed, both confirmed against the shipped
  # granite-qwen-frozen config.json rather than assumed.
  #
  # label_smoothing: config.yaml defaults it to 0.1, and every sibling granite
  # recipe sets 0.0. asr_modeling.py:1863 gates it on `self.training`, so it
  # rides train/loss and is zeroed for eval -- which is why run zrvrjt5l logs
  # train/loss 1.78 against eval/loss 0.50, a 3.5x inversion. The offset is
  # eps*mean_k(-log p_k), floored at 0.1*log(248192) = 1.24 nats; measured gap
  # is ~1.33. It is not only a reporting artifact: the smoothing is in the
  # gradient, so the frozen run was carrying a regularizer top4 and
  # granite_qwen did not, which contaminates the eval/loss comparison this
  # file exists to make. stage_1.yaml:74 already retired 0.1 -> 0.0 on this
  # stack after qmzim6ia/84w5zjhj.
  label_smoothing: 0.0
  # INFERENCE prompt only. Training picks the prompt per row from
  # `text_punct` (scripts/train.py _build_sample), so the plain default
  # ("Transcribe the speech to text") is only ever trained on TEDLIUM + AMI,
  # ~12% of the mix. Leaving this unset makes inference borrow their style.
  # Measured on frozen-2 (2026-09-24, same weights, CV n=300): plain 9.50 vs
  # this prompt 7.38. The plain prompt drops all terminal punctuation and
  # prefixes "Laughter" on 15% of CV rows.
  transcribe_prompt: "Transcribe the speech with proper punctuation and capitalization"

  # bfloat16, NOT the float32 the top4 recipe uses. That fp32 choice existed
  # for exactly one reason -- an Adam step of ~1e-5 at encoder lr 1e-5 is 49x
  # below a single bf16 ULP at Granite's 0.0868 weight RMS, so updates were
  # being quantised away. With zero trainable encoder params there are no
  # updates to lose, and the rationale evaporates. Reclaims the +0.95 GB the
  # top4 comment attributes to it, which is spent on batch size below.
  encoder_dtype: bfloat16

  use_lora: true
  lora_rank: 64
  # 64, i.e. alpha/r = 1.0, DOWN from top4's 128. Measured on the shipped
  # top4 adapter (2026-09-20) by reconstructing (alpha/r)*B@A per module and
  # taking ||dW||_F / ||W_base||_F against Qwen3.5-2B:
  #
  #     ALL 186 adapted matrices   mean 18.39%   max 55.46%
  #     linear_attn.in_proj_b      mean 27.93%   max 55.46%
  #     mlp.up_proj                mean 21.04%
  #     self_attn.v_proj           mean 11.27%   (smallest)
  #
  # The decisive comparison: FULLY FINE-TUNING this decoder (granite_qwen,
  # 1.37B trainable) moved it 13.31% over a complete run. A 67M-param adapter
  # at scale 2.0 perturbs the base model HARDER than unfreezing all of it did.
  # That inverts the premise of LoRA as a light-touch method. It corroborates
  # the independently-logged adapter norm of 17.16% at step 20,000, and it
  # explains jscyrgkt's oscillation: 123 units of path for 50 units of net
  # displacement, with cos(seg, prev) running -0.09 to -0.17 from step 10,000
  # -- roughly 60% of the decoder-side optimizer work spent going back and
  # forth. Steps too large, overshoot, thrash.
  #
  # top4's own comment nominated this as "the first knob to try if the drift
  # check comes back hot". It came back hot. Scale 1.0 halves the expected
  # perturbation to ~9.2%, under full fine-tuning's 13.31% and in the
  # neighbourhood of Granite Speech 3.3 (scale 0.5, the closest published
  # frozen-base + LoRA analogue). This run takes ~2.2x the optimizer steps
  # that produced 18.39% in two-thirds of one epoch, so this is the wrong
  # run to leave it hot on.
  #
  # RANK STAYS AT 64 -- checked, not assumed. Singular spectrum of the same
  # updates: rank needed for 90% of update energy is 41.8-46.5 on gate/up/
  # down/o/out_proj, so rank 32 would clip over half the modules. (Stable
  # rank reads 7.6-14.2, but that metric is dominated by the leading singular
  # value and understates usable capacity.) The exception is the DeltaNet
  # gates below, which need ~4.
  lora_alpha: 64
  # 0.0. Surveyed against the published frozen-base + LoRA speech recipes
  # (2026-09-21) rather than assumed:
  #
  #     Granite Speech 3.3 (adapter_config)   r=64   alpha=32   dropout 0.0    q,v
  #     Canary-Qwen-2.5B   (config.json)      r=128  alpha=256  dropout 0.01   q,v
  #     Phi-4-multimodal   (speech_lora)      r=320  alpha=640  dropout 0.01   qkv,o,gate_up,down
  #     Fun-ASR-Nano       (lora_conf, off)   r=16   alpha=32   dropout 0.05   q,v
  #     SLAM-LLM           (peft default)     r=8    alpha=32   dropout 0.05   q,v
  #     Ultravox                              no LoRA (r=0); unfreezes modules instead
  #
  # The large-data recipes (Granite, Canary-Qwen, Phi-4: 10^4-10^5 hours) sit
  # at 0.0-0.01; the 0.05s are small-data academic defaults. This run sees
  # ~2.7M unique utterances once, with 3.3% of the model trainable and a flat
  # train/eval gap on record (top4: 0.199 +/- 0.005), so there is nothing for
  # dropout to regularise yet. 0.0 also keeps the adapter identical in shape
  # and noise to top4, which is what the WER comparison needs. Revisit only
  # if the gap opens.
  #
  # Same survey on scale: alpha/r runs 0.5 (Granite) to 2.0 (Canary-Qwen,
  # Phi-4), so top4's 2.0 was mainstream; the 1.0 above is not a convention
  # call but the ||dW||/||W|| measurement on the shipped top4 adapter.
  lora_dropout: 0.0
  # all-linear, VERIFIED against the shipped top4 adapter (2026-09-20) rather
  # than inherited. Per-layer mean ||dW||_F/||W||_F across all 186 adapted
  # matrices runs 14.60% (layer 23) to 21.78% (layer 0) with no concentration
  # at any depth; the 6 full-attention layers (3,7,11,15,19,23) sit slightly
  # cooler at 14.6-17.5 than the 18 linear-attention layers at 17.8-21.8. The
  # quietest module family is self_attn.v_proj at 11.27%. Nothing is inert, so
  # there is no depth slice for `layers_to_transform` and no family to drop.
  #
  # Narrowing toward the published analogue would be a mistake on THIS
  # architecture: Granite Speech 3.3 adapts q_proj/v_proj only, but Qwen3.5 is
  # hybrid and full attention exists in just 6 of 24 layers, so the literal
  # translation covers 24 of 186 matrices and leaves 18 layers unadapted.
  #
  # CAVEAT, and the reason to re-check: this shows every module MOVED, not
  # that every module was USEFUL. A uniform ~18% profile is equally the
  # signature of an over-driven adapter, which the alpha note above documents.
  # Re-measure the profile at this run's final checkpoint, where scale 1.0
  # should put the mean near 9%. Flat and uniform there confirms all-linear on
  # a well-conditioned adapter; families collapsing toward zero would be the
  # first honest evidence for narrowing the target set.
  lora_target_modules: all-linear

  # NO per-module rank override on the DeltaNet gates (`in_proj_a` /
  # `in_proj_b`, shape (16, 2048)). Earlier revisions of this file carried
  # `lora_rank_pattern` / `lora_alpha_pattern` for them at 16, then 8, then
  # 12 -- three values in three revisions, none measured. Costed honestly,
  # the override does not earn its keep:
  #
  #   saves    3.86M adapter params (5.7% of 67.3M), ~62 MB of fp32 master +
  #            Adam state, and no measurable step time (36 matrices with 16
  #            output rows, against 150 that are 2048-6144 wide)
  #   costs    two config keys that must be kept equal or PEFT silently
  #            rescales the hottest modules in the adapter (see
  #            ASRConfig.lora_rank_pattern), ~90 lines of rationale, and one
  #            more uncontrolled difference from the top4 adapter this run is
  #            scored against
  #
  # At r=64 the gates are over-parameterised (geometry caps the realised
  # update at rank 16) but not mis-scaled: alpha/r = 1.0 holds for every one
  # of the 186 matrices. Over-parameterised LoRA is harmless; a wrong scale
  # is not. So the adapter goes back to top4's shape and the only decoder-
  # side change left is alpha 128 -> 64. If the gates ever need attention,
  # the cheaper experiment is dropping them from `lora_target_modules`
  # entirely, not tuning their rank.

  # Off. With the encoder frozen and 3.1% of the model training, the
  # overfitting surface is the smallest of any recipe here, and the top4 run
  # showed a flat train/eval gap with eval/loss still descending -- there is
  # nothing to regularise yet. Revisit only if the train/eval gap opens.
  apply_spec_augment: false

training:
  hub_model_id: "mazesmazes/tiny-audio-granite-qwen-frozen-3"

  attn_implementation: sdpa

  freeze_language_model: true
  freeze_projector: false
  freeze_text_embed_tokens: true

  # THE POINT OF THIS FILE. `freeze_audio_encoder: true` with
  # `encoder_trainable_top_layers: 0` is a total freeze -- 0 of 472.9M encoder
  # params train. asr_modeling.py defaults top_n to 0, so the explicit 0 is
  # documentation rather than strictly required; keep it explicit so the
  # difference from top4 is one readable line.
  #
  # Two things follow that are worth having. Backward never enters the encoder
  # at all (top-4 forced backprop through blocks 12-15), and _apply_train_mode
  # keeps the encoder's 16 BatchNorm1d modules in eval mode, which is the
  # failure that once cost 25 WER points on Earnings22 when the encoder was
  # put in train mode at construction. A frozen encoder also keeps its own CTC
  # head valid as a mid-run sanity check -- that check dies the moment any
  # encoder block unfreezes.
  freeze_audio_encoder: true
  encoder_trainable_top_layers: 0
  encoder_trainable_post_projections: false

  learning_rate: 1e-3
  decoder_learning_rate: 1e-4
  # INERT under a total freeze: the encoder param group resolves to an empty
  # parameter list, which fused AdamW accepts (verified). Kept so a future
  # partial unfreeze does not silently inherit `learning_rate` (1e-3) as its
  # encoder LR, which would be 100x the value any recipe here has used.
  encoder_learning_rate: 1e-5

  label_smoothing_factor: 0.0
  # 0.0, DOWN from 0.01, and this key is effectively "the LoRA weight decay".
  # scripts/train.py:1113 hardcodes `dec_wd = base_wd` -- there is no
  # `decoder_weight_decay` knob the way there is for the encoder and the
  # projector -- and LoRA tensors are named `language_model.base_model...`, so
  # they route to the decoder group and survive every no-decay filter (not a
  # bias, not a *Norm* gain, not SSM, not an nn.Embedding). The other two
  # groups set their decay explicitly below, so this change isolates cleanly
  # to the 67.3M adapter.
  #
  # Two reasons. Standard LoRA practice is 0.0 (QLoRA, the HF alignment
  # handbook, PEFT's own examples), because decoupled decay hits BOTH factors
  # of B@A and the pull on the realised dW is roughly 2x nominal. And this
  # file's own header argues that decay at lr*wd = 1e-5 * 0.01 = 1e-7/step
  # pinned the encoder at a "weight-decay equilibrium radius" and stopped it
  # learning -- the LoRA group was running at 1e-4 * 0.01 = 1e-6/step, TEN
  # TIMES that force, which the header never applied to the adapter it is
  # trying to hold at ~9% perturbation. Success criterion #3 would have been
  # reading a number weight decay was partly setting.
  #
  # This makes alpha the only thing controlling adapter magnitude, which is
  # the point of criterion #3. If dW comes back hot anyway, the levers are
  # decoder_learning_rate 1e-4 -> 5e-5 (already nominated) or wiring up a real
  # `decoder_weight_decay` -- not putting this back silently.
  weight_decay: 0.0
  # The projector is now the ONLY group carrying decay (the decoder is 0.0
  # above, the encoder 0.0 below and inert under the freeze). ~15% shrink over
  # this schedule at lr 1e-3, and it is the only force opposing the
  # projector's output-scale growth -- which reached ~48x embed_tokens RMS by
  # step 13k on the top4 run (~66x measured on real encoder output) and
  # plateaued. That drift has no measured loss cost and is no longer logged.
  projector_weight_decay: 0.01
  encoder_weight_decay: 0.0

  warmup_steps: 1000
  # Plain cosine to ZERO. Dropping min_lr_rate: 0.05 also means dropping
  # `cosine_with_min_lr`, which exists only to consume that kwarg -- with no
  # floor the two schedulers differ solely in the tail, so `cosine` is the
  # honest name for what now runs.
  #
  # The 5% floor was never measured here; it kept ~5e-5 on the projector and
  # ~5e-6 on the decoder running through the final steps. Annealing to zero
  # lets the run actually settle, which matters more than usual because this
  # is the first recipe expected to reach the end of its schedule rather than
  # being cut off mid-descent.
  lr_scheduler_type: cosine
  # Explicitly nulled, not just omitted. configs/training/production.yaml sets
  # `lr_scheduler_kwargs: {min_lr_rate: 0.1}`, and Hydra MERGES that in -- an
  # omitted key here inherits it, and plain `cosine` does not accept
  # min_lr_rate, so get_scheduler() would raise at construction.
  lr_scheduler_kwargs: null
  # 1.0, the HF Trainer default, DOWN from the 2.5 every sibling recipe
  # carries. 2.5 was derived on a full-decoder run (xxy2327u: median 1.18 /
  # p99 2.19) where 1.0 clipped 90% of steps; this stack is different --
  # top4's post-warmup grad norm ran median 0.634 / max 2.268 at batch 96,
  # so 1.0 clips the tail here, not the median, and at effective batch 64
  # (below) the noisier per-step gradient is exactly where a tighter cap
  # earns its keep. 1.0 is also what the LoRA recipes surveyed above run or
  # inherit (Trainer/TRL default); Fun-ASR is the outlier at 5. Read the
  # clip fraction off `grad_norm` over the first 2k post-warmup steps: if
  # the MEDIAN sits above 1.0 the cap is scaling the signal, not the spikes,
  # and 2.5 was right for this batch.
  max_grad_norm: 1.0

  seed: 44
  # Deliberately false. HF's auto_find_batch_size halves
  # per_device_train_batch_size on OOM WITHOUT touching
  # gradient_accumulation_steps, so it silently changes the effective batch
  # and makes the run non-comparable to anything.
  auto_find_batch_size: false

  # 28 per device x 2 accumulation, sized for Qwen3.5-4B on an H100 80GB.
  # The H100 is FASTER than the A100 80GB the 2B run used, not bigger:
  # nvidia-smi reports ~79.6 GiB against the A100's 80.0.
  #
  # Anchor: `ta runpod plan` predicted 77.3 GiB for the 2B run at batch 64,
  # and W&B es1p5srq measured a 76.4 GiB peak (95.5% of the card, median
  # 68.6). The planner is calibrated to within ~1 GiB here, so its 4B
  # numbers are used as-is:
  #     static      10.9 GiB  (decoder bf16 8.7G, LoRA 129.9M fp32 + Adam)
  #     activations  2.09 GiB per sample (32 layers x 2560 hidden against
  #                  24 x 2048: ~1.87x the 2B run's 1.12)
  #     batch 32 -> 77.8 GiB (~98%)  no headroom for all-19s batches
  #     batch 30 -> 73.6 GiB (~92%)
  #     batch 28 -> 69.5 GiB (~87%)  <- this file
  #
  # MEASURED (W&B rjid9zj6, H100 80GB HBM3, batch 30): the planner undershoots
  # the 4B stack by ~5%. The training peak hit 97.3% (77.5 GiB) by step 2,000
  # and was still rising (96.1% at step 1,600), with expandable_segments
  # already on, so this is real peak demand, not fragmentation. Eval dips to
  # ~17% and is not the constraint. 28 scales to ~73.5 GiB (~92%). Step down
  # BEFORE a run, not after an OOM: the data order is seeded, so resuming at
  # the same batch replays the batch that failed, and resuming at a new batch
  # breaks the step-indexed LR schedule and data skip.
  #
  # No gradient checkpointing. With the base frozen, backward is ~1x forward,
  # so recompute costs ~+50% per sample. That is a worse trade than a smaller
  # batch, and 28 x ~260 tokens already keeps an H100 busy.
  #
  # Eval runs under no_grad but still materialises 248K-vocab logits, so it
  # halves with the train batch.
  per_device_train_batch_size: 28
  per_device_eval_batch_size: 32
  # 2, so the effective batch is 56, close to the 64 this recipe was tuned
  # and measured at (max_grad_norm 1.0, lr 1e-3 / 1e-4). The frozen run
  # showed samples, not optimizer steps, are the currency: eval CE for
  # y1tulo4j overlaid top4 (jscyrgkt) at matched samples despite ~1.6x the
  # steps. Halving the batch to 28 without accumulation would only add
  # gradient noise.
  gradient_accumulation_steps: 2

  # ONE pass. `data.epoch_expansion` stays 1; the loader raises if both it
  # and this are >1, because they compound.
  #
  # ~3.68M loader rows (multiasr, all sources uncapped + Peoples) at
  # effective batch 56 is ~66k optimizer steps without showing any row
  # twice. Warmup 1,000 is ~1.5%
  # of the schedule and the modal published value for this architecture
  # class (Granite Speech 1000, Canary-Qwen 1000, SLAM-ASR 1000; Ultravox's
  # default is 0, not the 1000 this file used to cite); 700 was not measured
  # here and nothing was broken at it.
  num_train_epochs: 1
  save_steps: 2000
  eval_steps: 2000

  # THE REMAINING EFFICIENCY LEVER IS NOT IN THIS FILE. Batches are drawn at
  # random from a 0.8-19.0s duration range and padded to the longest row, so
  # a large share of encoder and decoder compute goes to padding. Length-
  # grouped batching (`group_by_length` over a duration column) was wired in
  # #47 and removed in #72 with the config-unreachable code; Fun-ASR's
  # token-bucketed `sort_size` sampler is the same idea. Bringing it back is
  # a loader change, not a recipe change, and is the next thing to do for
  # throughput once this run has a number.
  dataloader_num_workers: 16
  dataloader_prefetch_factor: 8
  torch_compile: false

  # SUCCESS CRITERIA
  #
  # 1. PRIMARY: pooled WER against granite_qwen_top4 on a SAMPLE-MATCHED
  #    n=500 sweep. Every cross-date comparison in outputs/ to date has been
  #    unmatched -- the 2026-09-18 and 2026-09-21 sweeps share only 1-9 rows
  #    per 100 -- so score both models in the same sweep or the number is
  #    meaningless. The model is bit-deterministic once the checkpoint is
  #    pinned (verified: 400 samples, 4 datasets, 0 prediction differences
  #    across processes), so n=100 is usable for large effects PROVIDED the
  #    snapshot SHA is fixed; run-to-run variation previously attributed to
  #    nondeterminism was 13 different checkpoints being published in a day.
  #
  # 2. DOES THE STEP COUNT PAY? The optimisation-side change from top4 is
  #    ~44.6k steps of batch 64 against ~27.4k of batch 96 over the same
  #    data. Compare eval/loss against the top4 curve at MATCHED STEP (the
  #    W&B x-axis), not matched epoch fraction: lower at 10k/20k means the
  #    smaller batch is converting the pass into more learning; flat or
  #    rising while train/loss falls means it is fitting noise, and
  #    `gradient_accumulation_steps: 2` is the one-line revert.
  #
  # 3. LoRA PERTURBATION: re-run the ||dW||/||W|| measurement at the final
  #    checkpoint. Target is ~9-10% mean (half of top4's 18.39%) and clearly
  #    under full fine-tuning's 13.31%. If it lands near 18% again despite
  #    scale 1.0, the driver is decoder_learning_rate rather than alpha and
  #    1e-4 -> 5e-5 is the next lever. Also re-check path-vs-displacement: if
  #    the adapter still travels ~2.5x its net displacement with negative
  #    step-to-step cosine, the step size is still too large.
