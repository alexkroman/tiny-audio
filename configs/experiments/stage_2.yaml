# @package _global_
# Continued training of mazesmazes/tiny-audio-next:
#   GLM-ASR-Nano-2512 encoder (frozen) + MLP projector (warm-started) +
#   Qwen3-0.6B decoder (warm-started), one more multiasr epoch under
#   stage_1's LR pair. Pushes to a separate Hub repo so the stage_1
#   baseline checkpoint is preserved.
#
# Why the LR pair stays at stage_1's (1e-3 / 1e-5):
#   scripts/debug/probe_stage2_lrs.py against tiny-audio-next reports
#   ||grad_projector||≈1.84 and ||grad_decoder||≈114. Of the candidate
#   pairs in the sweep, only (1e-3 / 1e-5) keeps the SGD-style
#   projector/decoder update ratio in the 0.5–2.0 balanced band (1.6×).
#   Bumping the decoder LR to 5e-5+ tilts updates ~3× toward the
#   decoder. The fresh-init "projector grad O(1e3)" regime quoted in
#   stage_1.yaml is gone (the projector has converged out of noise),
#   but the 100× decoder gap still encodes the right balance: in Adam
#   steady state the per-param step compresses toward lr × sign(grad),
#   so the LR *ratio* (not the absolute scale) governs which side
#   dominates updates.
#
# Why warmup_steps stays at 500:
#   model.pretrained_model_path loads weights only — optimizer state
#   (Adam m / v) restarts from zero. The "fresh-init projector grad"
#   rationale is gone, but warmup is still load-bearing to let Adam's
#   variance estimate settle before peak LR. 500 steps mirrors stage_1.
#
# Why seed bumps 43 → 44:
#   DatasetLoader seeds the post-concat shuffle from training.seed
#   (scripts/train.py:403 — concatenate_datasets(...).shuffle(seed=…)).
#   Reusing stage_1's seed would replay stage_1's example order on
#   resume, wasting the new epoch on already-seen ordering. 44 is the
#   smallest change that re-shuffles without touching anything else.
#
# Usage:
#   poetry run python scripts/train.py +experiments=stage_2

defaults:
  - override /data: multiasr

model:
  projector_type: mlp
  projector_pool_stride: 4
  projector_hidden_dim: 1024
  audio_model_id: zai-org/GLM-ASR-Nano-2512
  # Qwen3-0.6B ships with a chat_template, which DataCollatorForChatML requires.
  text_model_id: Qwen/Qwen3-0.6B
  # Load projector + decoder weights from the stage_1 checkpoint.
  # ASRModel.from_pretrained overlays both via load_state_dict
  # (scripts/train.py:757–758). Encoder stays frozen by default.
  pretrained_model_path: mazesmazes/tiny-audio-next

training:
  # Push to a new repo so mazesmazes/tiny-audio-next is preserved as the
  # load checkpoint for rollback / A-B comparison.
  hub_model_id: "mazesmazes/tiny-audio-next-s2"
  group_by_length: false  # Disabled: multiasr has inconsistent duration columns

  # Joint training continues — both projector and decoder remain trainable.
  freeze_language_model: false
  freeze_projector: false

  # See header note for the probe-derived rationale.
  learning_rate: 1e-3
  decoder_learning_rate: 1e-5

  # WD knobs unchanged from stage_1:
  #   0.01 (vs HF default 0.0) damps unbounded rare-token embedding drift
  #   under tie_word_embeddings=True. ASRTrainer.create_optimizer routes
  #   WD to non-norm params only (Qwen3RMSNorm + LlamaRMSNorm added to
  #   the forbidden-layers set so RMSNorm gains land in the no-decay
  #   group). Projector overrides base WD to 0.0 — rare-token drift only
  #   affects the decoder's tied embedding matrix; pulling projector
  #   linear weights toward zero would just bias projection magnitude.
  weight_decay: 0.01
  projector_weight_decay: 0.0

  # See header note: optimizer state restarts fresh on resume, so the
  # 500-step warmup remains load-bearing.
  warmup_steps: 500

  # Same scheduler shape as stage_1. Peak LR at the start of the resume
  # epoch, decaying to 10% floor (1e-4 / 1e-6) by end of epoch.
  # min_lr_rate=0.1 keeps late-stage tied-embedding rare-token refinement
  # productive — plain cosine→0 would effectively halt that refinement
  # in the final ~5% of training.
  lr_scheduler_type: cosine_with_min_lr
  lr_scheduler_kwargs:
    min_lr_rate: 0.1

  # Decoder ||grad||≈114 on the probe — stage_1's 5.0 clip is still in
  # the right range. 1.0 would clip ~99% of the decoder gradient and
  # defeat the point of unfreezing.
  max_grad_norm: 5.0

  # Seed bumped from stage_1's 43 to re-shuffle the training set.
  seed: 44
  auto_find_batch_size: false
  per_device_train_batch_size: 48
  per_device_eval_batch_size: 48
  gradient_accumulation_steps: 2
  num_train_epochs: 1
  save_steps: 1000
  eval_steps: 1000

  # Same dataloader / runtime knobs as stage_1 — Blackwell + AMD EPYC 9355
  # sizing (16 workers + prefetch 8 keep up with batch=48 + ftfy / truecase
  # label normalization).
  dataloader_num_workers: 16
  dataloader_prefetch_factor: 8

  # SDPA (PyTorch-native, cuDNN flash backend on Blackwell) — avoids the
  # slow flash-attn source build on RunPod and is fast enough at our
  # seq lengths.
  attn_implementation: sdpa

  torch_compile: true
