# @package _global_
# The default recipe plus three changes aimed at the Open ASR leaderboard's
# conversational and noisy sets, none of which needs new data:
#
#   poetry run ta runpod train <host> <port> -e verbatim_noise
#
# 1. Verbatim prompts. AMI, TEDLIUM, People's Speech, NOTSOFAR and EdAcc label
#    word-for-word (repeats, false starts, "yeah" not "yes"). They train under
#    "Transcribe the speech verbatim" (or its punctuated form, NOTSOFAR), so the
#    style is asked for by name. Serve with model.transcribe_prompt set to the
#    verbatim prompt to get it at inference; the shipped prompt is unchanged.
# 2. Rebalanced mix. More weight on the word-for-word conversational sources,
#    less on GigaSpeech M, whose labels collapse repeated words (0.9 repeats per
#    1k words against 6.1 in the leaderboard's references). The weights roughly
#    cancel in row count (AMI ~148K x2, TEDLIUM ~195K x1.5, NOTSOFAR x2, Giga M
#    ~657K x0.5). An earlier reweighting of this mix (the "tilt") was rolled
#    back for cross-eval regressions, so read every set, not just the targets.
# 3. Degradation matched to URGENT 2024 (scripts/train_augment.py), from the
#    noisy-vs-clean analysis of 2026-10-17: SNR is uniform -5..20 dB there and
#    SNR < 0 is 66% of the excess errors; 34% of clips are clipped (median 3.7%
#    of samples, 0.7-9%); 23% are band-limited below 8 kHz, mostly at 4 kHz.
#    Noise comes from MUSAN's noise set (not one of URGENT's noise sources, so
#    no test noise leaks in), synthetic broadband noise, or batch babble.
#
# Baseline to beat (2026-10-17, granite-qwen-frozen-nc, leaderboard
# normalizer): mean of 9 = 5.711, #28/56. AMI 8.01, E22 8.37, Giga 7.86,
# LS 1.37/2.64, SPGI 1.64, URGENT 13.09, Monsoon 4.53, VoxPopuli 3.87.

---
data:
  verbatim_sources:
    - edinburghcstr/ami
    - sanchit-gandhi/tedlium-data
    - MLCommons/peoples_speech
    - mazesmazes/notsofar-train
    # Also word-for-word; untagged it would be the plain prompt's only source.
    - edinburghcstr/edacc
  source_weights:
    "edinburghcstr/ami": 2.0
    "sanchit-gandhi/tedlium-data": 1.5
    "mazesmazes/notsofar-train": 2.0
    "speechcolab/gigaspeech:m": 0.5
  noise_prob: 0.35
  noise_snr_db: [-5.0, 20.0]
  noise_corpus: FluidInference/musan
  noise_corpus_glob: "noise/**/*.wav"
  bandlimit_prob: 0.2
  # Uniform over the list: 4 kHz three times matches its share of URGENT's
  # sub-8 kHz cutoffs (121 at 4 kHz, 16 at 5 kHz, 51 at 7 kHz).
  bandlimit_hz: [4000, 4000, 4000, 5512, 7000]
  clip_prob: 0.15
  clip_fraction: [0.007, 0.09]

training:
  hub_model_id: "mazesmazes/tiny-audio-granite-qwen-frozen-nc-verbatim"
