# @package _global_
# Local MPS / CPU smoke test on the 73-sample librispeech dummy dataset.
# Validates the full train loop end-to-end without GPU-only deps, including
# the joint full-decoder fine-tuning path (the same shape used by the
# default production recipe).
#
# Usage:
#   poetry run python scripts/train.py +experiments=mps_smoke

defaults:
  - override /data: librispeech_dummy

data:
  num_proc: 1

training:
  max_steps: 10
  logging_steps: 1
  # Batch size 1 — full Qwen3-0.6B fine-tuning in float32 adds ~7 GB of
  # gradient + AdamW state on top of the frozen-LM smoke test footprint.
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  # Trade compute for memory so this fits comfortably in unified memory.
  gradient_checkpointing: true

  # MPS / CPU compatibility: production uses adamw_torch_fused (CUDA-only),
  # bf16 + tf32 + flash_attention_2, persistent workers, etc.
  decoder_learning_rate: 1e-5
  optim: adamw_torch
  bf16: false
  tf32: false
  attn_implementation: sdpa
  dataloader_num_workers: 0
  dataloader_persistent_workers: false
  dataloader_prefetch_factor: null
  dataloader_pin_memory: false

  report_to: "none"
  save_strategy: "no"
  eval_strategy: "no"
  push_to_hub: false
  output_dir: ./outputs/mps_smoke
