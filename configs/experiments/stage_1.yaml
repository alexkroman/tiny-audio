# @package _global_
# Joint from-scratch training of tiny-audio-embedded:
#   GLM-ASR-Nano-2512 encoder (frozen) + MLP projector (fresh init, trained) +
#   Qwen3-0.6B decoder (base weights, fully fine-tuned).
#
# Single-stage replacement for the prior projector-only → joint two-stage
# recipe. The decoder is unfrozen from step 0 and trained jointly with the
# projector. Audio→text via Whisper-style encoders is a narrow enough semantic
# gap that the LLaVA-style projector-warmup stage isn't load-bearing; the
# joint gradient signal is what actually moves eval/loss after the first
# few hundred steps.
#
# Usage:
#   poetry run python scripts/train.py +experiments=stage_1

defaults:
  - override /data: multiasr

model:
  projector_type: mlp
  projector_pool_stride: 4
  projector_hidden_dim: 1024
  # Projector dropout removed (was 0.1). Part of a broader regularization
  # rollback for this recipe: weight_decay → 0.0, freeze_text_embed_tokens
  # → false. The intent is a cleaner test of "does the unfrozen embedding +
  # joint-trained projector + decoder stack actually saturate on this
  # data?" without dropout masking the signal. label_smoothing=0.1
  # (routed through liger fused CE) remains the only active regularizer.
  # If end-of-run eval shows overfit signature (train CE diverging from
  # eval CE faster than label-smoothing's natural offset of ~1.19),
  # reintroduce at 0.05 — half the prior value, since the run is also
  # half as long.
  #
  # REVISED: projector_dropout restored to 0.1 after run 4j97atjp
  # observed the predicted overfit signature: 0.167 train/eval gap that
  # didn't close across the run's second half (eval plateaued ~step 36k
  # while train continued descending). Literature analog: NEFTune-style
  # noise on projector output is the closest published intervention
  # (SpeechMapper reports dropout=0.1 helps; Disordered Speech LLM finds
  # 0.05 optimal on audio embeddings). 0.1 picks the higher end since the
  # mix also grew (Peoples 311K → 1M, +Emilia-YODAS 228K, +WHAM 265K).
  projector_dropout: 0.1
  audio_model_id: zai-org/GLM-ASR-Nano-2512
  # Qwen3-0.6B ships with a chat_template, which DataCollatorForChatML requires.
  text_model_id: Qwen/Qwen3-0.6B
  # Label smoothing off — completes the regularization rollback alongside
  # projector_dropout: 0.0 and weight_decay: 0.0. This is a deliberate
  # zero-regularizer recipe over a single epoch: the only remaining
  # protections against overfit are the frozen encoder (635M params, ~50%
  # of total), max_grad_norm: 1.0, and the cosine LR decay to 5% floor.
  #
  # Side effects to expect:
  # - train_loss and eval_loss become directly comparable (both raw CE).
  #   The prior recipe's ~1.19 train/eval gap from the LS uniform-target
  #   penalty disappears. A healthy run should now show train_loss
  #   slightly above eval_loss late in training (typical fine-tune); a
  #   widening gap (train << eval) is the clearest overfit signature.
  # - Removes the LS-induced confidence ceiling. The model can now put
  #   probability ≫(1-α) on correct tokens. Net effect on argmax is
  #   typically positive for ASR (sharper greedy decode), but it also
  #   means the per-token confidence metric we just added is no longer
  #   bounded by 1-α ≈ 0.9 — expect mean_top1_logprob to land closer to
  #   0 (i.e., P(correct) → 1) for confident positions.
  # - Removes the (B,T,V) fp32 log_softmax materialization risk that the
  #   LabelSmoother path required, but liger fused CE already avoided
  #   that — net no-op here, just keeping HF Trainer's
  #   label_smoothing_factor at 0 (below) defensively.
  #
  # REVISED: label_smoothing turned off (0.1 → 0.0) after qmzim6ia/84w5zjhj
  # showed LS=0.1 was net-negative under this architecture. Train/eval gap
  # was structurally locked at ~0.16 regardless of LS (compare run
  # 4j97atjp's 0.167 raw-CE gap vs qmzim's 0.162 LS-corrected gap — LS
  # closed 0). Meanwhile WER regressed across most evals (AMI +8,
  # ami-sdm +9, CV +1.5, etc.) with a textbook LS-induced loose-
  # generation signature in eval outputs: 41% over-generation ratio,
  # hallucinated word fusions ("threesight", "satahidi"), reduced
  # empty-prediction rate. Net: LS was loosening generation without
  # closing the gap it was supposed to address — paying cost, getting
  # no benefit.
  label_smoothing: 0.0

training:
  hub_model_id: "mazesmazes/tiny-audio-next-sat"
  group_by_length: false  # Disabled: multi-dataset configs have inconsistent duration columns

  # Joint training: projector trains from fresh init, decoder fine-tunes from
  # Qwen3-0.6B base weights. Encoder stays frozen via the default in asr_modeling.
  freeze_language_model: false
  freeze_projector: false
  # Embedding table unfrozen. Tested against run ppbo0oqn (frozen baseline)
  # which hit an eval-loss floor of ~0.458 at step 44k and could not push
  # below it despite the cosine tail; the "frozen-embedding ceiling" was a
  # candidate explanation. This run lets the embed table refine to test
  # that hypothesis.
  #
  # KNOWN RISK: this re-enables the failure mode that motivated the freeze
  # in the first place. Mechanism (observed in the published mazesmazes/
  # tiny-audio recipe, which drifted embed_tokens by 1.18× base norm):
  #   - Common tokens appear in batches → get task gradients (refinement).
  #   - Rare tokens (CJK / Unicode tail / code syntax) never appear → get
  #     only the WD=0.01 pull → embed rows shrink toward zero.
  #   - tie_word_embeddings=True propagates the damage to lm_head, hurting
  #     rare-vocab prediction at decode time.
  # Two protections vs the prior bad outcome are still in place: the
  # decoder LR is 50× lower (2e-5 vs 1e-4), reducing per-step update
  # magnitude on common tokens; and weight_decay is 0.01 vs the prior 0.0,
  # which is mostly a wash here (WD on never-updated tokens is exactly the
  # corruption mechanism, so this doesn't help rare-token preservation).
  # If rare-token drift dominates again at end of training, the next lever
  # is to add embed_tokens to ASRTrainer's no-decay group (similar to the
  # existing RMSNorm routing) — keeps the unfreeze for common tokens but
  # zeroes the WD pull on the rare-token tail.
  #
  # Verification: at end of this run, compare `embed_tokens` drift vs base
  # via scripts/debug/analyze_weights.py. Healthy: drift concentrated on
  # common tokens, rare-Unicode token IDs (90k+) preserved. Unhealthy: max
  # drift dominates mean by >100× (rare-token-drift signature).
  freeze_text_embed_tokens: false

  # Asymmetric LR for joint from-scratch training (~33× gap):
  #   - Projector (fresh init): 1e-3. Needs the high LR to converge quickly
  #     through warmup; observed ||grad_proj|| starts at ~9 and stabilizes
  #     around 0.4–0.6 once the bridge function is learned. Still actively
  #     pushing (std growing through step 50k) at end of run ppbo0oqn —
  #     keep peak unchanged.
  #   - Decoder (Qwen3-0.6B base): 3e-5. Raised from 2e-5 to compensate
  #     for two recipe shifts that reduce integrated LR:
  #     (a) num_train_epochs: 2 → 1 halves total steps;
  #     (b) min_lr_rate: 0.1 → 0.05 halves the cosine floor.
  #     Combined integrated-LR is ~45–50% of the prior recipe. Run
  #     ppbo0oqn at 2e-5 saturated attn-27 drift at ~13% by step 50k with
  #     growth-rate halving every snapshot — projection at the new shorter
  #     recipe at 2e-5 would land at 6–8%, slipping out of the 8–18%
  #     "right zone." 3e-5 brings it back to mid-zone (10–13%). The prior
  #     freeze-embed-protection rationale for keeping decoder LR low is
  #     gone with freeze_text_embed_tokens: false above. max_grad_norm: 1.0
  #     (below) provides adaptive damping: high-gradient steps get clipped
  #     to update≈prior magnitude, low-gradient steps get the full LR
  #     increase.
  #
  # REVISED: decoder_learning_rate 3e-5 → 2e-5. The 3e-5 rationale above
  # was for the OLD recipe with ~44K steps + LS=0.1. Three subsequent
  # shifts raise effective integrated LR significantly:
  #   (1) Mix grew Peoples 311K → 1M + Emilia-YODAS 228K + Earnings22 11K
  #       → ~50K steps per epoch vs OLD's 44K (+14% steps).
  #   (2) WHAM removed and max_audio: 30s → 20s recover some headroom on
  #       step count but the net is still ~50K steps.
  #   (3) label_smoothing: 0.1 → 0.0 raises effective gradient on the
  #       correct-token row by ~10% (LS no longer scales it by 0.9×).
  # At 3e-5 over 50K steps with LS=0, integrated LR ≈ 0.788 vs OLD's
  # 0.462 (1.71× OLD). Empirical: qmzim6ia at 3e-5 / LS=0.1 hit peak
  # attn drift 11.67% at step 20K; 84w5zjhj at 2e-5 / LS=0.1 hit 8.47%
  # at step 22K — confirms scaling. Projecting 3e-5 / LS=0 to step 50K
  # lands peak drift at ~17–20% (at/over the 18% ceiling). At 2e-5,
  # integrated LR = 0.525 (1.14× OLD) → projected drift ~13–14%, mid-
  # zone with modest headroom for the bigger mix's added breadth.
  learning_rate: 1e-3
  decoder_learning_rate: 2e-5

  # Label smoothing is routed through model.label_smoothing (above) so it
  # rides liger's fused linear CE and is automatically disabled on eval.
  # Keep HF Trainer's label_smoothing_factor at 0 — setting it >0 would
  # cause HF to pop labels before the forward pass and apply its own
  # Python-level LabelSmoother, which (a) double-smooths on top of the
  # model-internal smoothing and (b) materializes a (B,T,V) fp32 log_softmax
  # tensor (~15GB at B=50/V=152k) that capped batch size on the prior run.
  label_smoothing_factor: 0.0

  # Weight decay removed entirely. Reasoning given the recipe now also has
  # freeze_text_embed_tokens: false (above):
  #
  # - For the embed table: WD=0.01 was originally added to "damp unbounded
  #   rare-token drift," but the published mazesmazes/tiny-audio failure
  #   mode (rare CJK / Unicode token drift) happened *with* WD=0 in that
  #   run — the drift came from asymmetric "you're wrong" gradients on
  #   rare tokens via tied lm_head, not from WD. Adding WD on top adds a
  #   second downward pull on never-task-touched rows, compounding the
  #   problem rather than fixing it. With WD=0, rare-token rows now have
  #   neither task gradient nor WD pull — they stay near their pretrained
  #   values, achieving "selective freeze on rare tokens" without code.
  #
  # - For linear weights (attn / mlp): WD=0.01 damping over 44.5k steps at
  #   decoder_lr=3e-5 amounts to ~1.3% cumulative weight reduction —
  #   modest. Removing it gives the decoder slightly more headroom to
  #   adapt. label_smoothing=0.1 + max_grad_norm=1.0 are the other
  #   regularizers in this recipe; LS in particular is a stronger
  #   per-token regularizer than WD for ASR-fine-tune.
  #
  # - Matches the LLaVA-1.5 (WD=0) and LoRA-fine-tune (typically WD=0)
  #   convention. Qwen-Audio uses WD=0.05 but on a longer training horizon
  #   with different parameter masking.
  #
  # If end-of-run weight analysis shows runaway linear-weight growth
  # (Xavier ratio >10× on decoder layers, vs the current 3–6× range),
  # reintroduce WD=0.01 with embed_tokens explicitly routed to the
  # no-decay group via ASRTrainer.create_optimizer.
  #
  # REVISED: wd=0.01 restored to address eval-train gap (~0.17 at step
  # 28k of run 4j97atjp with wd=0). The rationale block above argued for
  # wd=0 to avoid compounding rare-token drift via the WD pull on
  # never-task-touched embed_tokens rows; if that drift signature
  # re-emerges, route embed_tokens to ASRTrainer's no-decay group rather
  # than reverting global WD.
  weight_decay: 0.01
  # Now redundant (matches base WD=0.0) but kept explicit to document
  # intent: projector weights should never be pulled toward zero.
  projector_weight_decay: 0.0

  # Warmup tuned from the prior run's (zot1zdu9, 5000-step warmup) early
  # trajectory:
  #   - Projector noise→signal transition completes at step 488 (loss
  #     drops 3.49 → 0.88 in one log window as the projector finds its
  #     basic audio-token → text-token mapping).
  #   - Loss plateaus at 0.39 by step ~1500 and stays flat through end
  #     of warmup (0.39 at step 1952, 0.39 at step 4979, 0.38 at step
  #     5955). The last 3500 warmup steps in the prior run did not move
  #     the loss curve.
  #   - grad_norm settles into the 1.5–2.5 operating range by step ~2000
  #     and is statistically identical at step 5000 (2.36 vs 2.18).
  #     Adam's variance estimator is well-calibrated by step 2000.
  # The 5000-step warmup was originally protective for the (1e-3 / 1e-4)
  # decoder LR — hitting peak with the decoder still in its high-grad
  # regime (||grad_dec||≈87 at step 2000) risked destabilizing Qwen3.
  # That concern collapses under the new (1e-3 / 1e-5) recipe: peak
  # decoder update is 1e-5 × 87 ≈ 8.7e-4, small enough that warmup tail
  # protection is no longer load-bearing. 2000 steps is 2.4% of the
  # 85k-step run — in the standard 1–5% pretraining-warmup range.
  warmup_steps: 2000

  # Cosine-with-min-lr: peak LR while projector is actively learning, decay
  # to 5% floor so late-stage tied-embedding rare-token refinement stays
  # productive while the back-half of training anneals more aggressively.
  # Halved from the prior 0.1 floor to compensate for the shortened 1-epoch
  # schedule (below): run ppbo0oqn hit eval-best at the epoch boundary
  # (step 44k of 89k), with eval bouncing around 0.467 ± 0.005 after that
  # while train kept descending — the classic overfit signature. A more
  # aggressive cosine tail closes that gap by reducing the LR magnitude
  # available for memorization at the same step count where the prior run
  # plateaued. 0.05 still leaves a non-trivial LR (~5e-5 projector, ~1e-6
  # decoder) for final refinement — far from a plain cosine→0 anneal.
  lr_scheduler_type: cosine_with_min_lr
  lr_scheduler_kwargs:
    min_lr_rate: 0.05

  # Tightened from 2.5 → 1.0 alongside two recipe changes that add gradient
  # risk: (a) decoder_learning_rate: 2e-5 → 3e-5 (above), and (b)
  # freeze_text_embed_tokens: false (above), which adds ~150M trainable
  # embed parameters as a new gradient source. Setting the cap at the
  # median observed grad_norm gives adaptive damping rather than a flat LR
  # bump: steps where grad_norm < 1 see the full LR=3e-5 update, steps
  # where grad_norm > 1 get clipped to update magnitude ≈ the prior recipe.
  # Run ppbo0oqn at 2.5 cap saw median grad_norm 0.91 (post-warmup) and 0%
  # clipping; same gradient distribution against a 1.0 cap would clip the
  # upper ~40% of steps, exactly the steps where the LR increase is most
  # risky. If grad_norm trends well below 1.0 throughout the new run, the
  # cap can be raised back to 2.5 in a follow-up; this is the conservative
  # default while we're combining two LR-loosening changes.
  max_grad_norm: 1.0

  seed: 44
  auto_find_batch_size: false
  per_device_train_batch_size: 100
  per_device_eval_batch_size: 100
  gradient_accumulation_steps: 1
  # Single-epoch recipe. Run ppbo0oqn (2-epoch baseline) hit best eval/loss
  # exactly at step 44k = end of epoch 1 = 0.4583; eval bounced around 0.467
  # for all 6k+ steps after that while train continued descending smoothly
  # (overfit signature on the second pass). The second epoch paid B200 time
  # for ~0 eval improvement at best, mild regression at worst. One epoch
  # matches where the recipe actually saturates on this data + recipe stack.
  #
  # Kept at 1 epoch under the new recipe: data mix grew (Peoples clean
  # 311K → 1.5M, plus Emilia-YODAS 616h adds 228K), so 1 epoch over the
  # larger mix already covers more total steps than the prior 1-epoch
  # baseline. Re-evaluate going to 2 epochs only if eval/loss is still
  # improving smoothly at end of this longer 1-epoch schedule.
  num_train_epochs: 1
  save_steps: 2000
  eval_steps: 2000

  # Keep the Blackwell fed; audio decode + mel extraction is the bottleneck
  # at this batch size. AMD EPYC 9355 has 32 cores / 64 threads — leave a
  # handful free for the main process, GPU sync, and tokenizer threads.
  # 16 workers + prefetch 8 keep up with batch_size=64 (ftfy + truecase
  # label normalization is the dominant per-row cost). 16 workers /
  # 32 physical cores leaves 16 cores for the main process, GPU sync,
  # tokenizer thread pool, and OS page cache.
  dataloader_num_workers: 16
  dataloader_prefetch_factor: 8

  # Inductor's decompose_triton_kernel_wrapper_functional post-grad pass
  # asserts on liger's wrapped triton kernels (RMSNorm/SwiGLU/RoPE/fused
  # linear CE). liger's wins don't depend on torch.compile, so disable it
  # rather than lose liger. Re-enable when liger v0.9+ improves Inductor
  # compat. (Also disabled in configs/training/production.yaml — repeating
  # here because this experiment file overrides the training base.)
  torch_compile: false
