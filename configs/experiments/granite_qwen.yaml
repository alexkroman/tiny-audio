# @package _global_
# Joint fine-tune of a frozen Conformer encoder into an unfrozen Qwen decoder:
#   ibm-granite/granite-speech-5.0-470m-turboctc (frozen)
#     -> MLP projector (fresh init, trained)
#     -> Qwen/Qwen3.5-2B (base weights, fully fine-tuned)
#
# This is stage_1's joint recipe (not granite_gemma's LLaVA-style projector-
# only setup) pointed at the Granite encoder. The decoder trains from step 0,
# so the projector does not have to carry the whole audio->text adaptation on
# its own and every drift/LR consideration from stage_1 applies here.
#
# Usage:
#   poetry run python scripts/train.py +experiments=granite_qwen

defaults:
  # Same single-source Loquacious `medium` as granite_gemma: 2,500h / 1.07M
  # rows, ~233 GB of parquet against multiasr's ~1.2 TiB. Note the label
  # caveat in that file -- transcripts are ALL-CAPS/no-punct, so labels here
  # end up cased-but-unpunctuated after truecase.
  - override /data: loquacious_medium

model:
  # Granite Speech 5.0 TurboCTC, encoder-only Conformer (472.9M params, d=1024),
  # Apache-2.0. Verified in isolation on this stack: running its own CTC head
  # over our exact feature-extraction path decodes LibriSpeech near-perfectly,
  # so the features, padding mask and time-major layout are all correct before
  # the projector ever sees them.
  audio_model_id: ibm-granite/granite-speech-5.0-470m-turboctc
  # Qwen3.5-2B. Three properties that matter to this repo:
  #   - The checkpoint is Qwen3_5ForConditionalGeneration (vision + video), but
  #     AutoModelForCausalLM maps `qwen3_5` straight to Qwen3_5ForCausalLM and
  #     loads it with 0 missing / 0 unexpected / 0 mismatched keys. No
  #     text-only transplant is needed -- contrast Gemma 4, where the causal-LM
  #     class silently random-initializes every tensor and needs
  #     _gemma_text_only.
  #   - It ships a chat_template, which DataCollatorForChatML requires. Turns
  #     close with "<|im_end|>", which _derive_turn_end_token_id picks up, so
  #     generation stops where training supervises.
  #   - hidden_size is 2048 and the vocab is 248,320 with tie_word_embeddings.
  text_model_id: Qwen/Qwen3.5-2B
  system_prompt: ""
  projector_type: mlp

  # sdpa, overriding ASRConfig's flash_attention_2 default. FA2 earns that
  # default on a dense decoder like stage_1's Qwen3-0.6B, but Qwen3.5 is hybrid
  # and the arithmetic does not carry over: only 6 of 24 layers are
  # full_attention, and at this recipe's sequence length (237 audio tokens for
  # 19s plus prompt and transcript, so T ~ 320) the QK^T + AV work FA2
  # optimizes is 0.7% of decoder FLOPs against 78% in the MLP. Even at T=4096
  # it is 8%. Doubling 0.7% is not worth a dependency.
  #
  # Two things it buys instead. The decoder holds float32 master weights (see
  # model_dtype below), and transformers' load-time check reads config.dtype,
  # so FA2 logs "only supports torch.float16 and torch.bfloat16 dtypes" on
  # every run -- harmless, since bf16 autocast feeds it bf16 and
  # get_target_dtype casts anything that slips through, but permanent noise in
  # the logs. It also drops this experiment's reliance on the flash-attn source
  # build, which the repo already documents as routinely failing on RunPod
  # images.
  attn_implementation: sdpa

  # Granite's feature extractor stacks mel pairs (100 Hz -> 50 Hz, 320-dim) and
  # the encoder subsamples 4x, so encoder output is already 12.5 Hz. Frame
  # stacking would be redundant and pool_stride must stay 1; at 4 the sequence
  # collapses to 3.1 Hz and starves the decoder.
  projector_pool_stride: 1
  # Matches Granite's two floor(L/2) subsample layers. Verified against the
  # real encoder at 1/2/5/10/19s -- predicted token count equals actual output
  # length exactly at every duration.
  encoder_conv_layers: [[0, 2, 2], [0, 2, 2]]

  # Bridges Granite's 1024 into Qwen's 2048. With pool_stride=1 the input is
  # 1024 (not 1024*k), so 4096 puts the projector at 1024*4096 + 4096*2048 =
  # 12.6M params -- the ~12M this repo's projectors have historically used.
  # granite_gemma needed 4096 because the projector was the only trainable
  # module; here it is a size choice rather than a necessity, since the decoder
  # also trains.
  projector_hidden_dim: 4096
  # Kept at stage_1's revised value. That run restored dropout to 0.1 after
  # observing a 0.167 train/eval gap that did not close in the second half.
  projector_dropout: 0.1

  # float32 master weights, with TrainingArguments bf16: true providing
  # autocast. This is stage_1's setting, and it is load-bearing whenever the
  # decoder trains -- granite_gemma can afford bfloat16 only because its
  # decoder is frozen.
  #
  # The reason is representability, not caution. Adam's step is ~lr in
  # magnitude (m/sqrt(v) is O(1)), so at decoder_learning_rate=2e-5 against
  # Qwen3.5 weights of ~0.015-0.02 the relative update is ~1e-3. bfloat16
  # keeps 8 bits of mantissa, a relative ULP of 2^-8 = 3.9e-3 -- roughly 4x
  # coarser than the update. Round-to-nearest then discards it. Simulated:
  # 1000 consecutive same-sign 2e-5 steps on a bf16 weight at 0.02 move it
  # +2e-5 (rounding noise, wrong sign) instead of -2e-2. A bfloat16 decoder
  # at this LR would barely train at all.
  #
  # Costs ~15 GB of static memory (weights + grads + Adam state) against the
  # bfloat16 layout. Activations are unaffected because autocast still runs
  # the math in bf16.
  model_dtype: float32

  # Off, matching stage_1's finding that LS=0.1 was net-negative on this stack:
  # it failed to close the train/eval gap while regressing WER across most
  # evals with a loose-generation signature.
  label_smoothing: 0.0

  max_new_tokens: 256

training:
  hub_model_id: "mazesmazes/tiny-audio-granite-qwen"
  # On, unlike stage_1 and granite_gemma. Those disable it because a
  # multi-dataset mix has inconsistent duration columns; that reason does not
  # apply to a single source. configs/data/loquacious_medium.yaml ships
  # `duration_column: duration` and says so itself: group_by_length is "free
  # if it is ever turned on."
  #
  # Worth having because the collator admits 0.8s-19s clips, so a randomly
  # drawn batch pads every row out to its longest member and the padded
  # positions cost full attention and MLP work. Length bucketing removes most
  # of that.
  #
  # One consequence to size the batch against: bucketing makes the all-long
  # batches consistently long, so peak activation memory goes UP even as mean
  # work goes down. That is the right trade here given the headroom below, but
  # it is why the batch is not pushed to the limit.
  group_by_length: true

  # Joint training: projector from fresh init, decoder fine-tuned from base.
  # The encoder stays frozen via the default in asr_modeling.
  freeze_language_model: false
  freeze_projector: false
  # Unfrozen, matching stage_1 and every decoder-training run this repo has
  # shipped (tiny-audio, -next-sat, -next-thurs all ran with it False).
  #
  # An earlier draft of this file froze it, reasoning from stage_1's KNOWN RISK
  # block: with tie_word_embeddings=True, tokens absent from every batch get
  # only the weight-decay pull, so their rows shrink toward zero and drag the
  # tied lm_head column with them. Measuring the shipped checkpoint retired
  # that concern. embed_tokens in tiny-audio-next-sat against base Qwen3-0.6B:
  #
  #   token ids      0-1k    1k-10k   50k-90k   130k-152k
  #   rel drift      0.090    0.091     0.067      0.029
  #   norm ratio     0.986    0.987     0.989      0.994
  #   max/mean drift 12.2x  (the documented unhealthy signature is >100x)
  #
  # Drift concentrates on COMMON tokens and the rare tail is the best
  # preserved -- the healthy pattern, not the corruption one. The rare-band
  # shrink of 0.65% is just decoupled weight decay: lr*wd*steps =
  # 2e-5*0.01*44000 = 0.88% predicted. For this run's 11,189 steps the same
  # arithmetic gives 0.22%, so the exposure here is smaller still.
  #
  # Freezing is not the free choice it looks like, either. One tensor backs
  # both the input table and lm_head, so freezing it would also freeze the
  # output projection -- a joint fine-tune that cannot adapt its output
  # distribution at all. Costs ~5.7 GB (508.6M params of fp32 grad + Adam
  # state), which the observed headroom covers.
  #
  # Side effect worth knowing: this also unfreezes the "<audio>" row added by
  # _init_tokenizer, since Qwen3.5 ships image/video tokens but no audio
  # placeholder (vocab resized 248,077 -> 248,078). The row is never read --
  # the projector's output is scattered over those positions -- so the only
  # consequence is that the tied lm_head column for "<audio>" can now move.
  # Labels never contain it, so it receives only negative evidence and should
  # drift away from ever being predicted.
  freeze_text_embed_tokens: false

  # Asymmetric LR, same split as stage_1:
  #   - Projector (fresh init): 1e-3. It has to learn the whole bridge function
  #     during warmup and is the only module starting from noise.
  #   - Decoder (pretrained): 2e-5. stage_1 settled here after 3e-5 projected
  #     attention drift to ~17-20%, at or over its 18% ceiling.
  # UNCALIBRATED for this pairing: stage_1's numbers were fitted to a 0.6B
  # decoder behind a GLM encoder. Read grad_norm and decoder drift over the
  # first few thousand steps before trusting either value.
  learning_rate: 1e-3
  decoder_learning_rate: 2e-5

  # See stage_1: smoothing rides model.label_smoothing (liger fused CE) when
  # enabled at all. Trainer's own factor stays 0 so it never pops labels and
  # applies a second, unfused LabelSmoother -- which at V=248k would
  # materialize a (B,T,V) fp32 log_softmax.
  label_smoothing_factor: 0.0

  weight_decay: 0.01
  # Never pull projector weights toward zero: that biases the projection
  # magnitude away from the scale the decoder expects.
  projector_weight_decay: 0.0

  warmup_steps: 2000
  lr_scheduler_type: cosine_with_min_lr
  lr_scheduler_kwargs:
    min_lr_rate: 0.05

  # stage_1's joint-training value rather than production's 2.5. Two trainable
  # modules with a ~50x LR gap between them makes a tighter cap the safer
  # default; loosen toward 2.5 if observed grad_norm sits well below 1.0.
  max_grad_norm: 1.0

  seed: 44
  auto_find_batch_size: false
  # Effective batch stays 96 so the LR schedule above transfers from stage_1
  # unchanged; only the split between device batch and accumulation changes.
  #
  # Raised 16 -> 32 (accumulation 6 -> 3) off an observed 34% VRAM at 78% GPU
  # utilization on the first run. At bs=16 the static cost (weights + grads +
  # Adam) is ~15 GB in the old bfloat16 layout, so activations were only
  # ~12 GB of an 80 GB card. The float32 switch above adds ~15 GB of static,
  # which this headroom absorbs: ~42 GB, a bit over half the card.
  #
  # Deliberately short of the ~50 the arithmetic allows. Three reasons to keep
  # margin: the activation estimate is extrapolated from one data point,
  # group_by_length now concentrates the long samples into the same batches
  # (raising peak), and granite_gemma has a documented history of sitting at
  # 99% VRAM and then dying. Re-measure and push further if it sits low.
  #
  # If it does run hot, prefer gradient_checkpointing: true over cutting the
  # batch -- activations across 24 trainable layers are the elastic term.
  per_device_train_batch_size: 32
  per_device_eval_batch_size: 32
  gradient_accumulation_steps: 3

  num_train_epochs: 1
  save_steps: 2000
  eval_steps: 2000

  dataloader_num_workers: 16
  dataloader_prefetch_factor: 8

  # Inductor's decompose_triton_kernel_wrapper_functional pass asserts on
  # liger's wrapped triton kernels. Qwen3.5 is additionally a hybrid model
  # (linear_attention layers with full_attention every 4th, SSM state held in
  # fp32), which is a further compile risk worth not taking on run one.
  torch_compile: false

  # THROUGHPUT -- Qwen3.5 is hybrid: three of every four layers are
  # `linear_attention` (gated delta rule + a causal depthwise conv), so the
  # fast path for most of the decoder lives outside core transformers. Without
  # the kernels, both the forward and the decode step log fallbacks:
  #   `chunk_gated_delta_rule` / `fused_recurrent_gated_delta_rule` ...
  #     because `flash-linear-attention` is not installed
  #   `causal_conv1d_fn` / `causal_conv1d_update` ...
  #     because `causal_conv1d` is not installed
  # Numerics are unaffected -- transformers calls the fallbacks "correct but
  # much slower" -- so this costs wall-clock, not quality.
  #
  # flash-linear-attention is now a regular linux dependency, so `poetry
  # install` covers it. causal-conv1d is an nvcc source build (sdist only) and
  # sits in an optional group; add it on a pod that has the CUDA toolkit:
  #   poetry install --with hybrid-kernels
