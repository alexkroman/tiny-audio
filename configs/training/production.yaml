# Production training configuration
output_dir: ./outputs/production_model

# Optimizer
optim: adamw_torch_fused
learning_rate: 1e-3
max_grad_norm: 1.0
warmup_steps: 2000
lr_scheduler_type: cosine
# bf16 training: Adam's `1 / sqrt(v_hat + eps)` denominator can underflow
# at the bf16 default eps=1e-8 when second moments get small. Lifting eps
# to 1e-6 stays well within bf16's ~7-bit mantissa precision range and
# avoids numerical instability on the rare-token / low-gradient params.
# Matches LLaMA / Mistral / Qwen pretraining convention for bf16.
adam_epsilon: 1e-6

# Training
max_steps: -1
num_train_epochs: 1
seed: 42
per_device_train_batch_size: 6
per_device_eval_batch_size: 6
gradient_accumulation_steps: 3
eval_accumulation_steps: 3

# Logging
logging_steps: 50
logging_first_step: true
logging_nan_inf_filter: false
report_to: wandb
wandb_project: tiny-audio

# Evaluation
eval_strategy: steps
eval_steps: 1000

# Saving
save_strategy: steps
save_steps: 500
save_total_limit: 5
load_best_model_at_end: false
metric_for_best_model: eval_loss
greater_is_better: false
save_safetensors: true

# Hub
push_to_hub: true
hub_model_id: "mazesmazes/tiny-audio"
hub_strategy: every_save
hub_token: null
hub_private_repo: false

# Performance
fp16: false
bf16: true
tf32: true
# torch.compile disabled: Inductor's post-grad
# decompose_triton_kernel_wrapper_functional pass asserts on liger's wrapped
# triton kernels (RMSNorm / SwiGLU / RoPE / fused-linear-CE), crashing the
# compile step. liger's kernels don't need torch.compile to deliver their
# wins — the fused linear CE (the load-bearing one for label_smoothing
# memory) is invoked directly from Qwen3ForCausalLM.forward after
# apply_liger_kernel_to_qwen3 patches it. Re-enable once liger v0.9+ ships
# improved Inductor compat.
torch_compile: false
attn_implementation: flash_attention_2

# Data loading
dataloader_num_workers: 24
dataloader_prefetch_factor: 2
dataloader_pin_memory: true
dataloader_persistent_workers: true
dataloader_drop_last: true
group_by_length: true
length_column_name: duration

# Misc
disable_tqdm: false
log_level: info
ignore_data_skip: false
resume_from_checkpoint: null

# Required by HF Trainer
remove_unused_columns: false
label_names:
  - labels
