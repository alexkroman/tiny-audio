# Production training configuration.
#
# Encoder fully frozen, fresh MLP projector, Qwen3-0.6B fully fine-tuned
# (2026-10-21; was LoRA on a frozen decoder), one pass over the data on one
# RTX PRO 6000 96GB.

---
output_dir: ./outputs/production_model

# Freeze policy. `freeze_audio_encoder: true` with
# `encoder_trainable_top_layers: 0` is a total freeze -- 0 of 472.9M encoder
# params train. Backward never enters the encoder, and _apply_train_mode keeps
# the encoder's 16 BatchNorm1d modules in eval mode (the failure that once cost
# 25 WER points on Earnings22 when the encoder was put in train mode at
# construction). A frozen encoder also keeps its own CTC head valid as a
# mid-run sanity check.
#
# Why frozen: a top-4 partial unfreeze random-walked to its weight-decay
# equilibrium radius (0.95% drift, orthogonal successive displacements) and
# learned nothing directional, while the projector and LoRA co-adapted to
# that random endpoint.
#
# The decoder is FULLY fine-tuned (2026-10-21), embeddings included: the old
# stage_1 recipe's Qwen3-0.6B settings. Its runs found a frozen embedding
# table capped eval loss (ppbo0oqn floored at ~0.458), so it trains, at a
# decoder LR low enough (2e-5, below) to keep rare-token rows from drifting.
# Verify at the end: per-row embed_tokens drift should concentrate on common
# tokens; max drift >100x mean is the rare-token-drift signature.
freeze_language_model: false
freeze_projector: false
freeze_text_embed_tokens: false
freeze_audio_encoder: true
encoder_trainable_top_layers: 0
encoder_trainable_post_projections: false

# Optimizer
optim: adamw_torch_fused
# Projector (fresh init) at 1e-3; the fully fine-tuned decoder at 2e-5.
# stage_1's value for Qwen3-0.6B, chosen from attention-weight drift: 3e-5
# reached 11.67% at step 20K (qmzim6ia) and projected past the 18% ceiling
# over a full run; 2e-5 (84w5zjhj) reached 8.47% at step 22K and projects to
# ~13-14%, mid-zone. (The LoRA recipe used 1e-4.)
learning_rate: 1e-3
decoder_learning_rate: 2e-5
# INERT under a total freeze: the encoder param group resolves to an empty
# parameter list, which fused AdamW accepts. Kept so a future partial unfreeze
# does not silently inherit `learning_rate` (1e-3) as its encoder LR.
encoder_learning_rate: 1e-5

# 0.0 (2026-10-22, was 0.01): this key is the DECODER group's weight decay
# (scripts/train.py sets `dec_wd = base_wd`). At decoder lr 2e-5, AdamW's
# decoupled decay of 0.01 shrinks the weights by lr x wd = 2e-7 per step,
# ~0.2% over a one-pass cosine schedule: too weak to regularize, and it pulls
# toward zero rather than toward the pretrained weights. 0.0 is the HF Trainer
# and TRL default. stage_1 once ran 0.01 after 0.0 opened a ~0.17 eval-train
# gap by step 28k (run 4j97atjp), but decay this weak is an unlikely cause of
# a gap that size; one pass (num_train_epochs below) is what holds the gap
# now. If eval-train opens up again, look there first. embed_tokens/lm_head sit
# in the no-decay group either way (decay_parameter_ids).
weight_decay: 0.0
# 0.0 (2026-10-22, was 0.01): no group carries decay now. At lr 1e-3, 0.01
# shrank the projector ~9% over a one-pass schedule, the only force opposing
# its output-scale growth. That growth (~48x embed_tokens RMS by step 13k on
# an earlier run) plateaued with no measured loss cost, so the decay was
# guarding against nothing observed. Check the projector output RMS over
# embed_tokens RMS on the final weights (no longer logged during training): if
# it climbed far past ~48x instead of plateauing, this is the lever to restore.
projector_weight_decay: 0.0
encoder_weight_decay: 0.0

# Adam eps 1e-8 (2026-10-22, was 1e-6): the PyTorch/HF default and the usual
# fine-tuning value. The old 1e-6 guarded against bf16 underflow, but the
# trained weights and AdamW state here are float32 (model_dtype: float32), so
# that risk does not apply. 1e-6 did damp updates for parameters whose
# gradient RMS sits near 1e-6 (rarely seen embed_tokens rows); if the
# rare-token-drift signature appears, this is one lever to revisit.
adam_epsilon: 1e-8

# 1.0, the HF Trainer default and stage_1's full fine-tune cap. Post-warmup
# grad norm on the LoRA stack ran median 0.634 / max 2.268 at batch 96, so
# 1.0 clips the tail, not the median, and at
# effective batch 64 the noisier per-step gradient is where a tighter cap earns
# its keep. 1.0 is also what the surveyed LoRA recipes run (Trainer/TRL
# default). Read the clip fraction off `grad_norm` over the first 2k
# post-warmup steps: if the MEDIAN sits above 1.0 the cap is scaling the
# signal, not the spikes.
max_grad_norm: 1.0

# ~1.5% of the schedule and the modal published value for this architecture
# class (Granite Speech 1000, Canary-Qwen 1000, SLAM-ASR 1000).
warmup_steps: 1000
# Plain cosine to ZERO. This is a recipe expected to reach the end of its
# schedule rather than being cut off mid-descent, so annealing to zero lets the
# run actually settle.
lr_scheduler_type: cosine

# Training
max_steps: -1
# ONE pass (2026-10-22; two for a day). `data.epoch_expansion`
# (configs/data/multiasr.yaml) stays 1; the loader raises if both it and this
# are >1, because they compound.
#
# MEASURED: one pass is ~18.2k optimizer steps at effective batch 256
# (s8jyxw2i), not the ~14k first estimated.
#
# Why one: the 2-epoch run s8jyxw2i (granite NC + Qwen3-0.6B full fine-tune)
# hit its best eval loss, 0.3998, at step 18k (epoch 0.99). At the boundary
# train loss stepped 0.26 -> 0.24 within 50 steps, and eval loss rose at every
# checkpoint after it, to 0.4213 at 30k. Grad norm held ~0.85 throughout, so
# this is memorization of replayed rows, not instability. stage_1's 2-epoch
# run (ppbo0oqn) showed the same signature. Every source in the mix is
# uncapped, so a second pass is an exact replay, and the meeting x4 / EdAcc x3
# source_weights already repeat those rows within one pass. For more compute,
# add unique data rather than passes.
num_train_epochs: 1
seed: 44

# 64 per device x 1 accumulation, sized for Qwen3.5-2B on an RTX PRO 6000
# Blackwell 96GB (2026-10-16). This is exactly the shape the published 2B
# model trained at (granite-qwen-frozen-4, from #99's 2B variant), so lr
# 1e-3 / 1e-4 and max_grad_norm 1.0 mean what they meant there and the run
# compares cleanly against it.
#
# QWEN3-0.6B FULL FINE-TUNE: 304 x 1 (2026-10-22, was 256). MEASURED at
# 256 x 1 over the whole of W&B s8jyxw2i (RTX PRO 6000, 95.6 GiB): peak
# 73.4 GiB (77%), median 70-73 GiB every hour, and the peak came in a
# training step, not eval. Peak sits only ~2.5 GiB over median: packing makes
# memory follow a batch's total tokens, and 256-clip batches average out.
# With the 64 x 1 reading (~27%, ~26 GiB) that fits ~10 GiB static + ~0.25
# GiB per clip, so 304 projects to ~86 GiB peak (~90%), and 320 to ~90 GiB
# (~94%), too close for an OOM the seeded order would replay on resume.
# Record the 304 peak here; if it OOMs, step down to 288 BEFORE rerunning.
# The GPU was already saturated at 256 (98% util, 95% SM active), so expect
# fewer optimizer steps per pass (~15.3k vs 18.2k), not more samples/sec.
#
# SMOLLM3-3B (2026-10-20): 64 x 1 OOMed on the RTX PRO 6000 (93.6 GiB in
# use, 92.7 allocated by PyTorch, failing a 1.39 GiB allocation). Its 36
# layers x 2048 hidden scale the 2B's measured ~1.12 GiB of activations per
# sample to ~1.7 GiB, so 48 would sit near 89 GiB (~94%) and 32 near 62 GiB.
# Now 32 x 2: the same effective batch of 64, so LR, warmup and schedule keep
# their meaning; the cost is throughput only. Under padding-free packing
# (FA2) decoder memory follows a batch's TOTAL tokens, not 32 x its longest
# row, so the 30 s clip cap (data.max_audio_seconds) raises the mean, not
# the worst case, and 32 should have headroom; 64 x 1 may fit again. NOT yet measured -- record the
# W&B peak here once a run has passed a few hundred steps.
#
# MEASURED, not planned: W&B es1p5srq (2B, batch 64, A100 80GB) peaked at
# 76.4 GiB (95.5% of the card, median 68.6); `ta runpod plan` predicted
# 77.3. Peak is batch x the collator's 19.0s cap regardless of mix: batches
# pad to their longest row, and a random 64-row draw nearly always contains
# one near 19s. On the RTX PRO 6000 (~95 GiB usable) that is ~80%.
#
# Do NOT reuse 64 x 1 on an 80 GB H100: it reports ~79.6 GiB, which puts
# the same peak at 96%, and the seeded data order means an OOM replays on
# resume. Use 32 x 2 there (same effective batch, throughput cost only).
# Step down BEFORE a run, not after an OOM: resuming at a new batch breaks
# the step-indexed LR schedule and data skip.
#
# No gradient checkpointing. With the base frozen, backward is ~1x forward,
# so recompute costs ~+50% per sample -- a worse trade than a smaller batch.
#
# 4B history (#90 -> 2026-10-16), kept for a future decoder swap: the 4B
# stack needs ~2.09 GiB activations per sample (32 layers x 2560 hidden,
# ~1.87x the 2B's 1.12) plus 10.9 GiB static; W&B rjid9zj6 (H100, batch 30)
# peaked at 97.3% and the planner undershoots it by ~5%. It ran 28 x 2 on
# an H100 and was planned at 32 x 2 on the RTX PRO 6000.
per_device_train_batch_size: 304
# Half of train: eval holds no activations for backward, but shares the card
# with the full training state.
per_device_eval_batch_size: 128
# 1: effective batch 304 (2026-10-22; 256 on 2026-10-21, and 64 before that,
# the batch every LR here was tuned at). LRs are UNCHANGED: the frozen run
# found samples seen, not steps, to be the currency (eval CE overlaid at
# matched samples despite ~1.6x the steps), so ~4.75x fewer, larger steps are
# expected to track at matched samples. Warmup stays 1000 STEPS, which is now
# ~4.75x more samples. If loss lags the batch-64 curves at matched samples,
# sqrt-scale the LRs (~x2.2).
# The frozen run showed samples, not optimizer steps, are the currency:
# eval CE for y1tulo4j overlaid top4 (jscyrgkt) at matched samples despite
# ~1.6x the steps.
gradient_accumulation_steps: 1
eval_accumulation_steps: 3
# Deliberately false. HF's auto_find_batch_size halves
# per_device_train_batch_size on OOM WITHOUT touching
# gradient_accumulation_steps, so it silently changes the effective batch.
auto_find_batch_size: false

# Logging
logging_steps: 50
logging_first_step: true
logging_nan_inf_filter: false
report_to: wandb
wandb_project: tiny-audio

# Evaluation
eval_strategy: steps
eval_steps: 2000

# Saving
save_strategy: steps
save_steps: 2000
save_total_limit: 5
load_best_model_at_end: false
metric_for_best_model: eval_loss
greater_is_better: false

# Hub
push_to_hub: true
# Named for the recipe it receives: Granite NC + fully fine-tuned Qwen3-0.6B
# (2026-10-21). Never point it at an existing model's repo; every save pushes,
# so a mismatched default overwrites that model (it once pointed at
# granite-qwen-frozen-nc after the recipe had moved on).
hub_model_id: "mazesmazes/tiny-audio-granite-qwen3-0.6b"
# `end`, not `every_save`: scripts/train.py's PushToHubCallback already pushes
# on every save via ASRModel.push_to_hub, which is the push that matters -- it
# ships preprocessor_config.json and the custom modeling code, which Trainer's
# own push (an upload_folder of output_dir) omits. Under `every_save`,
# Trainer._push_from_checkpoint uploaded the same multi-GB weights a second
# time on every save; `end` makes it return early. The final push is
# unaffected: train.py calls save_model(_internal_call=True), which skips
# Trainer's push regardless of hub_strategy, then pushes via ASRModel.
hub_strategy: end
hub_token: null
hub_private_repo: false

# Performance
fp16: false
bf16: true
tf32: true
# torch.compile disabled: Inductor's post-grad
# decompose_triton_kernel_wrapper_functional pass asserts on liger's wrapped
# triton kernels (RMSNorm / SwiGLU / RoPE / fused-linear-CE), crashing the
# compile step. liger's kernels don't need torch.compile to deliver their
# wins.
torch_compile: false
# flash_attention_2 (2026-10-20, was sdpa since #149 with no measurement on
# record): padding-free packing (tiny_audio/asr_packing.py) needs FA2's varlen
# kernels, and Qwen3-ASR's encoder runs its 8 s windows as one varlen call
# instead of an sdpa loop. resolve_attn_implementation falls back to sdpa,
# with a warning, when flash-attn is missing or its kernels fail on the card;
# packing then switches itself off.
attn_implementation: flash_attention_2

# Load-bearing, and NOT the same knob as the decoder's training-time cache.
# transformers' Trainer.__init__ does
#     self.model.config.use_cache = self.args.use_cache
# with TrainingArguments.use_cache defaulting to False, and for ASRModel
# `model.config` IS the ASRConfig. Trainer.__init__ runs AFTER scripts/train.py
# clears use_cache, so without this line the default re-stamps
# `use_cache: false` onto every checkpoint and every model pushed to the Hub --
# exactly the regression train.py's own comment says it fixed. The reload path
# then decodes with no KV cache, i.e. quadratic.
#
# Setting it True here does not re-enable the cache during training: the
# training forward is governed by model.language_model.config.use_cache, which
# Trainer never touches, and ASRModel.forward passes use_cache explicitly.
use_cache: true

# Data loading. EPYC 9355 has 32 cores / 64 threads; 16 workers + prefetch 8
# keep up with the loader (ftfy + truecase label normalization is the dominant
# per-row cost) while leaving cores for the main process, GPU sync, tokenizer
# thread pool, and OS page cache.
#
# The remaining throughput lever is length-grouped batching: batches are drawn
# at random from a 0.8-19.0s duration range and padded to the longest row, so
# a large share of compute goes to padding. That is a loader change, not a
# recipe change.
dataloader_num_workers: 16
# Batches buffered PER WORKER. 8 x 16 workers was 128 batches; at 256 clips of
# up to ~2 MB of Granite features each, that is tens of GB of host RAM.
# 2 x 16 = 32 batches is still far ahead of the GPU.
dataloader_prefetch_factor: 2
dataloader_pin_memory: true
dataloader_persistent_workers: true
dataloader_drop_last: true

# Misc
disable_tqdm: false
log_level: info
ignore_data_skip: false
resume_from_checkpoint: null

# Required by HF Trainer
remove_unused_columns: false
label_names:
  - labels
