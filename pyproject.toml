[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "tiny-audio"
version = "0.1.0"
description = "Learn ASR by Building One - A minimal speech recognition model combining a GLM-ASR encoder with Qwen3-0.6B"
authors = [{name = "Alex Kroman", email = "alex@alexkroman.com"}]
license = "MIT"
readme = "README.md"
keywords = ["speech-recognition", "asr", "glm-asr", "qwen3", "transformers", "deep-learning", "education"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.12,<3.13"
# Poetry fills deps in from [tool.poetry.dependencies] below. A static
# `dependencies = [...]` here would override that list (PEP 621 takes
# precedence over Poetry's section when both exist); leave it dynamic.
dynamic = ["dependencies"]

[project.urls]
Homepage = "https://github.com/alexkroman/tiny-audio"
Repository = "https://github.com/alexkroman/tiny-audio"
Documentation = "https://github.com/alexkroman/tiny-audio#readme"
"Bug Tracker" = "https://github.com/alexkroman/tiny-audio/issues"

[project.scripts]
# Unified CLI entry points
tiny-audio = "scripts.cli:app"
ta = "scripts.cli:app"

[tool.poetry]
packages = [
    {include = "tiny_audio"},
    {include = "scripts"},
]
include = ["configs/**/*.yaml"]

[[tool.poetry.source]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
priority = "supplemental"

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
# torch - Poetry will pull from pytorch-cu128 source on Linux when available.
# Pinned to 2.8.x for the local/CI env. NOTE: the default deploy image is now
# runpod/pytorch:1.0.3-cu1281-torch291-ubuntu2404 (torch 2.9.1 on python3.12);
# scripts/deploy/runpod.py strips `torch==` from the exported requirements, so
# the pod keeps the image's torch and this pin only governs local installs.
torch = "~2.8.0"
soundfile = ">=0.12.1"
librosa = ">=0.10.0"
transformers = ">=5.0.0"
datasets = {extras = ["audio"], version = ">=3.0.0,<4.0.0"}
jiwer = "*"
attrs = "*"
rich = "*"
wandb = "*"
numpy = "*"
hydra-core = "*"
omegaconf = "*"
ninja = "*"
gradio = "*"
assemblyai = "*"
deepgram-sdk = "*"
typer = ">=0.19.2"
trl = ">=0.26.0"
peft = ">=0.13.0"  # LoRA adapters for Stage 2 fine-tuning
torchaudio = "~2.8.0"  # torchaudio's major.minor must match torch's
torchvision = ">=0.23.0,<0.24.0"  # Pairs with torch 2.8.x
pyannote-core = ">=6.0.0"  # For DER metric calculation
pyannote-metrics = ">=4.0.0"  # For DER metric calculation
bitsandbytes = {version = "*", markers = "sys_platform == 'linux'"}
liger-kernel = {version = ">=0.5.0", markers = "sys_platform == 'linux'"}
# Hub kernels: the supported way to get Qwen3.5's linear-attention fast path
# without the nvcc source builds the `hybrid-kernels` group documents below.
# transformers 5.17 ships default mappings for exactly the four functions that
# otherwise fall back (integrations/hub_kernels.py):
#     chunk_gated_delta_rule, fused_recurrent_gated_delta_rule
#         -> kernels-community/fla
#     causal_conv1d_fn, causal_conv1d_update
#         -> kernels-community/mamba-ssm
# and modeling_qwen3_5.py decorates the torch reference impls with
# @use_kernel_func_from_hub_with_fallback, whose priority is
# hub kernels -> original package -> torch reference. Upstream's own warning
# quantifies the stake: "for chunk_gated_delta_rule the gap is more than an
# order of magnitude on an H100", and 18 of Qwen3.5-2B's 24 layers are on that
# path. Prebuilt binaries, so no nvcc and no tilelang.
#
# Pure-Python loader, safe to install everywhere; it only does anything when a
# model is loaded with use_kernels=True on a supported device. Restricted to
# the `kernels-community` org by default (ALLOW_ALL_KERNELS = False).
kernels = ">=0.6.0"
# NOTE: the Qwen3.5 linear-attention fast path (flash-linear-attention +
# tilelang + causal-conv1d) is deliberately NOT a main dependency -- see the
# `hybrid-kernels` group below for why installing it unconditionally can turn a
# slow run into a crashed one. `kernels` above is the lower-risk route to the
# same speedup and should be preferred; the group remains for pods that
# already have nvcc or want the upstream packages specifically.
pyobjc-framework-Speech = {version = "*", markers = "sys_platform == 'darwin'"}
fabric = ">=3.0.0"
pipecat-ai = {extras = ["openai", "silero"], version = "^0.0.98"}
spacy = "^3.8.11"
# spaCy ships the library on PyPI but not its pipelines, so `spacy` alone
# resolves fine and `spacy.load("en_core_web_sm")` still raises E050 (the NER
# model behind `ta analysis extract-entities`). `python -m spacy download` fixes
# one machine and nothing else; the release wheel keeps it in the lock file.
# Model minor must track spacy's -- en_core_web_sm 3.8.0 requires spacy <3.9.
en-core-web-sm = {url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl"}
ten-vad = ">=1.0.6"
speechbrain = {git = "https://github.com/speechbrain/speechbrain.git"}
pytz = "*"
truecase = ">=0.0.14"  # Statistical re-casing for ASR label normalization
ftfy = ">=6.0"  # Unicode cleanup (mojibake, smart quotes) + NFKC before normalize
# nltk 3.10 tokenizes a leading apostrophe as its own token ("'em" -> "'", "em"),
# and truecase's TreebankWordDetokenizer re-glues that bare "'" onto the PREVIOUS
# word. Training labels from mono-case corpora then come out as "get' em" and
# "in' 99" instead of "get 'em" / "in '99" (tests/test_label_normalization.py).
# Transitive via truecase (unbounded) and pipecat-ai (>=3.9.1,<4); pinned here
# because nothing in this repo needs 3.10. Revisit if truecase gains a fix.
nltk = "<3.10"

[project.optional-dependencies]
local = ["pyaudio>=0.2.14"]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"
pytest-cov = ">=4.0.0"
black = ">=2.3.0"
ruff = ">=0.1.0"
mypy = ">=1.5.0"
pyright = ">=1.1.0"
mdformat = ">=0.7.0"
yamllint = ">=1.35.0"
taplo = ">=0.9.0"
pre-commit = ">=3.0.0"
bandit = ">=1.7.0"
vulture = ">=2.10"
interrogate = ">=1.5.0"
pytest-mock = "^3.15.1"
pytest-asyncio = ">=1.0.0"
elevenlabs = "^2.31.0"
# Apple SFSpeechRecognizer eval backend (scripts/eval/evaluators/asr.py).
# Already a runtime dep on macOS, but pinning it in dev too so the dev env
# doesn't fail-import when running tests/CLI flows that touch the backend.
pyobjc-framework-Speech = {version = "*", markers = "sys_platform == 'darwin'"}
torchcodec = ">=0.5.0,<0.8"  # 0.7.x is the last line built against torch 2.8 ABI; 0.8+ requires torch 2.9+

[tool.poetry.group.pipecat]
optional = true

[tool.poetry.group.pipecat.dependencies]
pipecat-ai = {extras = ["silero", "openai"], version = ">=0.0.40"}

# Optional fast path for Qwen3.5's hybrid linear-attention layers (three of
# every four). Without these, transformers logs `causal_conv1d_fn` and
# `chunk_gated_delta_rule` falling back to reference implementations --
# correct, just slower.
#
# Optional, not main, for two separate reasons:
#
#   - causal-conv1d publishes an sdist only, so it compiles against nvcc and
#     fails on any image without the CUDA toolkit. Same failure mode this repo
#     already documents for flash_attn in _resolve_attn_implementation.
#   - flash-linear-attention is worse than useless when half-installed. On
#     Hopper with Triton >=3.4.0 and <3.7.1 its Triton kernel for gated
#     chunk_bwd_dqkwg is known-wrong (fla-org/flash-linear-attention#640), so
#     fla *raises* rather than compute bad gradients. Its TileLang backend is
#     auto-enabled on exactly that combination, but only if the `tilelang`
#     package and a usable nvcc are both present -- otherwise dispatch falls
#     through to the Triton path and training dies at the first backward.
#     Installing fla without tilelang therefore converts a slow run into a
#     crashed one, which is why it must never be an unconditional dependency.
#     scripts/deploy/runpod.py installs the pair and verifies the combination,
#     removing fla if the gated path would raise.
#
# Opt in on a pod that has nvcc:
#   poetry install --with hybrid-kernels
[tool.poetry.group.hybrid-kernels]
optional = true

[tool.poetry.group.hybrid-kernels.dependencies]
causal-conv1d = {version = ">=1.4.0", markers = "sys_platform == 'linux'"}
flash-linear-attention = {version = ">=0.5.0", markers = "sys_platform == 'linux'"}
tilelang = {version = ">=0.1.9", markers = "sys_platform == 'linux'"}

[tool.black]
line-length = 100
# Must agree with `requires-python` above and `[tool.ruff] target-version`.
target-version = ["py312"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = true
# Ignore specific error codes that are library-related
disable_error_code = ["assignment", "override", "call-overload", "arg-type", "index", "union-attr", "call-arg", "misc", "operator", "attr-defined"]

[[tool.mypy.overrides]]
module = "transformers.*"
ignore_errors = true

[tool.pyright]
include = ["tiny_audio"]
exclude = ["**/node_modules", "**/__pycache__", "outputs", ".venv", "venv"]
ignore = [
    "tiny_audio/asr_pipeline.py",
    "tiny_audio/integrations/pipecat_stt.py",
]
typeCheckingMode = "basic"
reportPrivateImportUsage = false
reportOptionalMemberAccess = false
reportOptionalIterable = false
reportOptionalCall = false
reportGeneralTypeIssues = false
reportIncompatibleMethodOverride = false
# PyTorch models have dynamic attributes
reportAttributeAccessIssue = false
reportCallIssue = false
reportIndexIssue = false
# Ignore assignment type issues for PyTorch configs
reportAssignmentType = false
reportArgumentType = false
reportOperatorIssue = false
reportReturnType = false

[tool.pytest.ini_options]
# Test discovery patterns
python_files = "test_*.py *_test.py"
python_classes = "Test*"
python_functions = "test_*"

# Default options. `--strict-markers` rejects typos in @pytest.mark.<name>
# (an unregistered marker is otherwise a silent no-op that never deselects
# anything); `--strict-config` turns unknown ini keys into errors instead of
# warnings, so a misspelled option can't quietly disable itself.
addopts = "-v -s --tb=short --strict-markers --strict-config"

# An @xfail test that unexpectedly passes is a stale expectation; fail it so
# the marker gets removed rather than masking a later regression.
xfail_strict = true

# Test paths
testpaths = ["tests"]

# Ignore directories
norecursedirs = ["outputs", ".venv", "venv", ".git", "__pycache__", "*.egg-info"]

# Markers for test categorization
markers = ["slow: marks tests as slow (deselected by default)"]

# Filter out third-party warnings
filterwarnings = [
    "ignore::DeprecationWarning:onnxruntime.*",
    "ignore:builtin type.*has no __module__ attribute:DeprecationWarning",
    "ignore:Specified provider.*is not in available provider names:UserWarning",
]

[tool.ruff]
line-length = 100
# Must agree with `requires-python`: a lower target hides every pyupgrade
# rewrite the real interpreter already supports (PEP 604 unions, PEP 585
# generics) and lets code that only runs on 3.12 pass as if it were portable.
target-version = "py312"
extend-exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "build",
    "dist",
    "*.egg-info",
    ".mypy_cache",
    ".pytest_cache",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "N",  # pep8-naming
    "UP", # pyupgrade
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "DTZ", # flake8-datetimez
    "T10", # flake8-debugger
    "ISC", # flake8-implicit-str-concat
    "RET", # flake8-return
    "SIM", # flake8-simplify
    "PTH", # flake8-use-pathlib
    "A",   # flake8-builtins (shadowed builtins)
    "PIE", # flake8-pie (misc. lints: duplicate class fields, redundant startswith chains)
    "PT",  # flake8-pytest-style
    "RSE", # flake8-raise
    "TID", # flake8-tidy-imports
    "Q",   # flake8-quotes (agrees with black/ruff-format)
    "G",   # flake8-logging-format
    "LOG", # flake8-logging
    "TRY", # tryceratops (exception-handling anti-patterns)
    "FLY", # flynt (static string joins)
    "PERF", # perflint
    "PGH", # pygrep-hooks (blanket noqa / type: ignore)
    "PLC", # pylint conventions
    "PLE", # pylint errors
    "PLW", # pylint warnings
    "FURB", # refurb (modernization)
    "RUF", # ruff-specific rules
]
extend-ignore = [
    "E203",  # whitespace before ':'
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "B905",  # zip() without an explicit strict= parameter
    # Lazy imports are deliberate throughout: `ta` defers every heavy import
    # (torch, transformers, gradio) to the command that needs it so that
    # `ta dev lint` doesn't pay ~4.5s of import time per invocation.
    "PLC0415",  # import-outside-top-level
    # Long f-string messages inside raise are the house style; moving each one
    # into an exception subclass buys nothing here.
    "TRY003",  # raise-vanilla-args
    # En dashes, arrows and other typographic characters are used on purpose in
    # user-facing strings, ITN regexes and comments.
    "RUF001", "RUF002", "RUF003",  # ambiguous-unicode-character-*
    # A loop with a guard and a side effect is often clearer than an
    # `extend(...)` over a comprehension; the perf difference is negligible here.
    "PERF401",  # manual-list-comprehension
]

[tool.ruff.lint.per-file-ignores]
# Mathematical notation (A, B, W, S for matrices) is conventional in LoRA analysis
"scripts/debug/analyze_lora.py" = ["N806"]
# `test` here is a typer command (`ta dev handler`), not a pytest test; its
# defaulted parameters are CLI options.
"scripts/deploy/handler_local.py" = ["PT028"]

[tool.mdformat]
wrap = 100
number = false
# Exclude files with YAML front matter (mdformat mangles `---` delimiters)
exclude = ["MODEL_CARD.md", "demo/README.md"]

[tool.coverage.run]
branch = true
source = ["tiny_audio", "scripts"]
omit = [
    # One-off research probes, not shipped behaviour; each is a __main__ script
    # against a live checkpoint or dataset and has no unit-testable surface.
    "scripts/debug/probe_*.py",
    "scripts/debug/bench_*.py",
    "scripts/debug/inspect_datasets.py",
    "scripts/debug/check_gradient_flow.py",
    "scripts/debug/compare_to_base.py",
    "scripts/debug/analyze_weights.py",
    "scripts/debug/analyze_lora.py",
]

[tool.coverage.report]
# Ratchet: `ta dev test` fails below this. Raise it as coverage grows; never
# lower it to make a red build green. Set from a run without Hub access
# (the model-loading tests error out there), so CI measures higher -- bump
# this to just under CI's number after the next green run.
fail_under = 45
show_missing = true
skip_covered = true
precision = 1
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    # `except ImportError` fallbacks for the flat-layout HF Hub checkout, where
    # the package is loaded as a set of sibling modules rather than `tiny_audio.*`.
    "except ImportError:",
]

[tool.coverage.xml]
output = "coverage.xml"

[tool.bandit]
# Skip B615: We intentionally want latest HuggingFace model versions
# Skip B602: RunPod deployment requires shell=True for remote commands
# Skip B108: RunPod deployment uses /tmp for remote scripts
skips = ["B615", "B602", "B108"]
