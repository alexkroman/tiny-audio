---
# `ta dev install-hooks` (pre-commit install) installs both hook types.
default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: local
    hooks:
      - id: precommit
        name: precommit quality gate
        entry: poetry run ta dev precommit
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: prepush
        name: not main, up to date with origin/main, no conflicts
        entry: poetry run ta dev prepush
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
